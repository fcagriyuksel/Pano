        ['PUL−', 'Darbe girişi (−). NPN çıkışlı PLC’de PUL+ artıya, PUL− PLC çıkışına bağlanır (ortak anot). PNP çıkışta PUL+ çıkışa, PUL− 0 V’a gider (ortak katot).'],
        ['DIR+', 'Yön girişi (+). Seviyesi dönüş yönünü seçer. Yön sinyali, ilk darbeden katalogdaki süre kadar (ör. 5 µs) önce değişmeli.'],
        ['DIR−', 'Yön girişi (−). Bağlantı mantığı PUL− ile aynıdır.'],
        ['ENA+', 'Etkinleştirme girişi (+). Çoğu sürücüde aktif olunca çıkış kesilir, motor serbest kalır; bağlı değilse sürücü çalışır. Mantığı kataloğa göre doğrula.'],
        ['ENA−', 'Etkinleştirme girişi (−).'],
        ['+V', 'DC besleme artı; sürücünün izin verdiği aralıkta (ör. 24–48 V). Ters bağlamak sürücüyü bozar.'],
        ['GND', 'DC besleme eksi (0 V).'],
        ['A+', 'Motorun A sargısının bir ucu.'],
        ['A−', 'A sargısının öbür ucu. A+ ile A− aynı sargının iki ucudur; ölçerek bul.'],
        ['B+', 'Motorun B sargısının bir ucu.'],
        ['B−', 'B sargısının öbür ucu. Motor ters dönerse bir sargının iki ucunu yer değiştir ya da DIR mantığını çevir.'],
        ['SW1–3', 'Çıkış akımı. Motorun faz akımına göre seçilir; hangi konumun hangi akım olduğu sürücünün üstündeki tabloda yazar.'],
        ['SW4', 'Bekleme akımı. Motor durunca akımı düşürür: ısınma azalır, tutma torku düşer.'],
        ['SW5–8', 'Mikroadım: tur başına darbe sayısı. PLC’deki darbe/tur ayarıyla aynı olmalı.'],
        ['PWR', 'Besleme LED’i (yeşil).'],
        ['ALM', 'Alarm LED’i (kırmızı). Yanıp sönme sayısı arıza türünü gösterir (aşırı akım, aşırı ya da düşük gerilim …); tablo sürücünün üstündedir.']
      ],
      parcalar: [
        ['Sinyal klemensi', 'PLC’den gelen darbe (PUL), yön (DIR) ve etkinleştirme (ENA) girişleri. Birçok sürücüde klemens fiş şeklindedir: kabloları sökmeden sürücü değiştirilebilir.'],
        ['Güç ve motor klemensi', '+V ve GND besleme, A± ve B± motor sargıları. Motor kablosunu enerji varken sökme ya da takma: sürücü bozulabilir.'],
        ['DIP anahtarları', 'Akım (SW1–3), bekleme akımı (SW4), mikroadım (SW5–8). Sürücü ayarı açılışta okur: enerjiyi kesip değiştir.'],
        ['LED’ler', 'PWR besleme, ALM alarm.'],
        ['Soğutucu taban', 'Alüminyum taban güç katının ısısını panoya iletir. Metal yüzeye oturmalı; çevresinde hava dolaşmalı.'],
        ['Kapak', 'Kartı korur. Üstündeki tablolar akım ve mikroadım ayarlarını gösterir.'],
        ['Ana kart', 'Denetleyici, optokuplörler ve güç katının bağlantıları bu karttadır.'],
        ['Optokuplörler', 'PLC sinyallerini sürücü devresinden yalıtır. Giriş LED’inin akımı katalogdaki aralıkta olmalı; yüksek gerilimde seri direnç bu akımı sınırlar.'],
        ['Denetleyici', 'Darbeleri sayar; mikroadım için iki sargının akımını sinüs ve kosinüs biçiminde ayarlar.'],
        ['MOSFET köprüleri', 'Her sargı için bir H köprüsü. Akımı hızla açıp kapatarak (PWM) sargı akımını DIP ile seçilen değerde tutar; ısısını tabana verir.'],
        ['Kondansatörler', 'Beslemeyi süzer ve motor yavaşlarken geri bastığı enerjiyi karşılar.']
      ],
      kamera: { yon: [1.5, 0.55, 1] },
      secimdeOdak: true,
      kesitler: [{ ad: 'kapaksız', planlar: [[0, 0, -1, 26]] }, { ad: 'kart altı', planlar: [[0, 0, -1, 11.9]] }],
      yeni: () => ({ enerji: false, ena: false, dip: [true, false, true, false, true, true, false, true], okunan: null }),
      dugmeler: (s) => [
        ['enerji', s.enerji ? 'Enerjiyi kes' : 'Enerji ver', s.enerji],
        ['dip', 'Akım ayarı (SW1–3)'],
        ['ena', s.ena ? 'ENA: aktif' : 'ENA: pasif', s.ena]
      ],
      olay(s, olay) {
        if (olay === 'enerji') { s.enerji = !s.enerji; s.okunan = s.enerji ? s.dip.slice() : null; }
        else if (olay === 'dip') {
          const n = ((s.dip[0] ? 1 : 0) + (s.dip[1] ? 2 : 0) + (s.dip[2] ? 4 : 0) + 1) % 8;
          s.dip[0] = !!(n & 1); s.dip[1] = !!(n & 2); s.dip[2] = !!(n & 4);
        } else if (olay === 'ena') s.ena = !s.ena;
      },
      durum(s) {
        const ayar = `SW1–3: ${grupYaz(s.dip, 0, 3)} · SW4: ${grupYaz(s.dip, 3, 4)} · SW5–8: ${grupYaz(s.dip, 4, 8)}`;
        if (!s.enerji) return { metin: `Enerji yok. ${ayar}. Ayarı enerjisizken değiştir.` };
        if (s.okunan && s.okunan.join() !== s.dip.join()) return { metin: `Anahtar değişti ama sürücü ayarı açılışta okur; hâlâ eski akımla çalışıyor. Enerjiyi kesip yeniden ver. ${ayar}.`, uyari: true };
        if (s.ena) return { metin: 'ENA aktif: çoğu sürücüde çıkış kesilir, motor serbest kalır ve elle çevrilebilir. PWR yanıyor.' };
        return { metin: `Enerji var, PWR yanıyor. Sürücü darbe bekliyor; motor bekleme akımıyla tutuluyor. ${ayar}.` };
      },

      kur(y) {
        const T = y.T, TUR = Math.PI * 2;
        const kok = new T.Group();
        const grup = (...n) => { const g = new T.Group(); n.forEach((x) => g.add(x)); return g; };
        const yer = (n, x, yy, z) => { n.position.set(x, yy, z); return n; };
        const kutu = (w, h, d, m, x, yy, z, sec) => yer(y.ag(new T.BoxGeometry(w, h, d), m, sec), x, yy, z);
        const yuvarlakDikdortgen = y.yuvarlakDikdortgen;
        const dikdortgenDelik = (x0, y0, x1, y1) => new T.Path().moveTo(x0, y0).lineTo(x0, y1).lineTo(x1, y1).lineTo(x1, y0).closePath();
        /* Birbirine değen parçalar arasında 0,05 mm boşluk vardır (kesitte z-fighting olmasın). */

        /* ---- soğutucu taban: bağlantı kulaklı alüminyum plaka ---- */
        const tabanSekli = yuvarlakDikdortgen(75, 130, 3);
        [[28, 61.5], [-28, 61.5], [28, -61.5], [-28, -61.5]].forEach(([x, yy]) => tabanSekli.holes.push(new T.Path().absarc(x, yy, 2.2, 0, TUR, true)));
        const taban = yer(y.ag(y.cek(tabanSekli, 5, { pah: 0.4 }), 'aluminyum'), 0, 0, 2.5);

        /* ---- kapak: üst levha, üç duvar ve açıklıklı sağ panel ---- */
        const SINYAL_Y = 3, GUC_Y = -35, DIP_Y = 33, adim = 5.08;
        const panelSekli = new T.Shape().moveTo(-31, -59).lineTo(-5.05, -59).lineTo(-5.05, 59).lineTo(-31, 59).closePath();   // x = −z (dünya)
        panelSekli.holes.push(dikdortgenDelik(-24.05, SINYAL_Y - 15.3, -11.95, SINYAL_Y + 15.3), dikdortgenDelik(-24.05, GUC_Y - 15.3, -11.95, GUC_Y + 15.3),
          dikdortgenDelik(-23.5, DIP_Y - 11, -14.5, DIP_Y + 11), new T.Path().absarc(-22, 51, 1.8, 0, TUR, true), new T.Path().absarc(-22, 55, 1.8, 0, TUR, true));
        const kapak = grup(
          yer(y.ag(y.cek(yuvarlakDikdortgen(75, 118, 3), 1.95, { pah: 0.4 }), 'plastik'), 0, 0, 32.025),
          kutu(1.5, 118, 25.95, 'plastik', -36.75, 0, 18.025),
          kutu(71.9, 1.5, 25.95, 'plastik', 0, 58.25, 18.025),
          kutu(71.9, 1.5, 25.95, 'plastik', 0, -58.25, 18.025),
          yer(y.ag(new T.ExtrudeGeometry(panelSekli, { depth: 1.5, bevelEnabled: false }).rotateY(Math.PI / 2), 'plastik'), 36, 0, 0),
          kutu(56, 34, 0.1, 'plastikAcik', -2, 30, 33.1, { kenar: false }),    // akım ve mikroadım tabloları (yazısız gösterim)
          kutu(56, 40, 0.1, 'plastikAcik', -2, -20, 33.1, { kenar: false })
        );

        /* ---- klemensler: gövde, vida başları, kablo girişleri ---- */
        const klemens = (yc) => {
          const g = grup(kutu(8.9, 30.5, 12, 'klemens', 42.05, yc, 18));
          const vida = y.silindir(1.55, 1.2, 20), yuva = new T.BoxGeometry(0.5, 2.4, 0.3), giris = new T.BoxGeometry(0.3, 3.4, 3.6);
          for (let i = 0; i < 6; i++) {
            const yy = yc + (2.5 - i) * adim;
            g.add(yer(y.ag(vida, 'celik', { esik: 60 }), 42.5, yy, 24.65), yer(y.ag(yuva, 'entegre', { kenar: false }), 42.5, yy, 25.42), yer(y.ag(giris, 'entegre', { kenar: false }), 46.7, yy, 16));
          }
          return g;
        };
        const sinyal = klemens(SINYAL_Y), guc = klemens(GUC_Y);

        /* ---- DIP anahtarları ve LED’ler ---- */
        const suruguler = [];
        const dip = grup(kutu(3, 21, 8, 'kabloKirmizi', 39.05, DIP_Y, 19));
        for (let j = 0; j < 8; j++) {
          const sg = kutu(1.3, 1.5, 2.6, 'plastikAcik', 41.25, DIP_Y + (3.5 - j) * 2.54, 19, { esik: 60 });   // j = 0: SW1
          dip.add(sg);
          suruguler.push(sg);
        }
        const ledGeo = new T.CylinderGeometry(1.5, 1.5, 2.5, 20).rotateZ(Math.PI / 2);
        const pwr = yer(y.ag(ledGeo, y.malzeme('ledYesil').clone(), { kenar: false }), 38.8, 55, 22);
        const alm = yer(y.ag(ledGeo, y.malzeme('ledKirmizi').clone(), { kenar: false }), 38.8, 51, 22);
        const ledler = grup(pwr, alm);
        const pwrKapali = pwr.material.color.clone(), pwrAcik = new T.Color(0x39e86a);

        /* ---- iç yapı ---- */
        const kart = kutu(70, 112, 1.6, 'kart', 0, 0, 12.8);
        const opto = grup(...[-8, 1, 10].map((yy) => kutu(4.6, 6.4, 3.4, 'plastikAcik', 28, yy, 15.35)));
        const denetleyici = kutu(12, 12, 1.6, 'entegre', 5, 12, 14.45);
        const mosfet = grup();
        [-26, -12].forEach((x) => [-45, -33, -21, -9].forEach((yy) => mosfet.add(kutu(10, 6, 3.95, 'entegre', x, yy, 7.1))));
        const kondansator = grup();
        [-40, -28].forEach((yy) => kondansator.add(yer(y.ag(y.silindir(5, 16, 32), 'kondansator'), 20, yy, 21.65), yer(y.ag(y.silindir(4.6, 0.3, 32), 'celik', { kenar: false }), 20, yy, 29.85)));

        const parcalar = [
          { nesne: sinyal, isaret: [46.6, SINYAL_Y + 15.3, 24.1], patlat: [24, 0, 0] },
          { nesne: guc, isaret: [46.6, GUC_Y + 15.3, 24.1], patlat: [24, 0, 0] },
          { nesne: dip, isaret: [40.6, DIP_Y + 11, 23.1], patlat: [0, 0, 18] },
          { nesne: ledler, isaret: [40.1, 57.5, 22], patlat: [0, 0, 18] },
          { nesne: taban, isaret: [30, 63, 2.55], patlat: [0, 0, 0] },
          { nesne: kapak, isaret: [-20, 20, 33.1], patlat: [0, 0, 44] },
          { nesne: kart, isaret: [-30, 50, 0.85], patlat: [0, 0, 18] },
          { nesne: opto, isaret: [28, 10, 17.1], patlat: [0, 0, 18] },
          { nesne: denetleyici, isaret: [0, 0, 0.85], patlat: [0, 0, 18] },
          { nesne: mosfet, isaret: [-26, -9, 9.1], patlat: [0, 0, 0] },
          { nesne: kondansator, isaret: [20, -40, 30.05], patlat: [0, 0, 18] }
        ];
        parcalar.forEach((p) => kok.add(p.nesne));

        /* Etiketler: klemens uçlarında kablo girişinin hemen önünde; DIP gruplarında ve LED’lerde yanda. */
        const etiketYerleri = [];
        SINYAL.forEach((ad, i) => etiketYerleri.push({ nesne: sinyal, konum: [47.6, SINYAL_Y + (2.5 - i) * adim, 21], parca: 0 }));
        GUC.forEach((ad, i) => etiketYerleri.push({ nesne: guc, konum: [47.6, GUC_Y + (2.5 - i) * adim, 21], parca: 1 }));
        const swY = (j) => DIP_Y + (3.5 - j) * 2.54;   // SW1 en üstte
        [swY(1), swY(3), (swY(5) + swY(6)) / 2].forEach((yy) => etiketYerleri.push({ nesne: dip, konum: [42.5, yy, 24.5], parca: 2 }));
        etiketYerleri.push({ nesne: ledler, konum: [41, 55, 24.5], parca: 3 }, { nesne: ledler, konum: [41, 51, 19.5], parca: 3 });

        return {
          kok,
          parcalar,
          etiketYerleri,
          uygula(s) {
            suruguler.forEach((sg, j) => { sg.position.z = s.dip[j] ? 21.1 : 16.9; });   // ON öne (+z)
            pwr.material.color.copy(s.enerji ? pwrAcik : pwrKapali);
          }
        };
      }
    }
  });
})();

        const kok = new T.Group();
        const grup = (...n) => { const g = new T.Group(); n.forEach((x) => g.add(x)); return g; };
        const yer = (n, x, yy, z) => { n.position.set(x, yy, z); return n; };
        const kutu = (w, h, d, m, x, yy, z, sec) => yer(y.ag(new T.BoxGeometry(w, h, d), m, sec), x, yy, z);
        const koyu = (w, h, d, x, yy, z) => kutu(w, h, d, 'entegre', x, yy, z, { kenar: false });
        /* Birbirine değen parçalar arasında 0,05 mm boşluk vardır (kesitte z-fighting olmasın). */

        /* ---- soğutucu (kanatlar z 0 … 40, taban 40 … 48) ve altındaki fan (y ekseninde) ---- */
        const sogutucu = grup(kutu(100, 200, 8, 'aluminyum', 0, 0, 44),
          ...Array.from({ length: 12 }, (_, k) => kutu(2, 175, 39.95, 'aluminyum', -49 + (98 * k) / 11, 12.5, 19.975, { esik: 60 })),
          ...[1, -1].flatMap((d) => [kutu(40, 10, 2, 'aluminyum', 0, d * 105.05, 41), koyu(8, 5, 0.1, 0, d * 106, 42.1)]));
        const fanCerceve = y.yuvarlakDikdortgen(40, 39.8, 3);   // z 0,05 … 39,85: soğutucu tabanına değmez
        fanCerceve.holes.push(new T.Path().absarc(0, 0, 18.5, 0, TUR, true));
        const pervane = grup(yer(y.ag(y.silindir(7, 20, 24).rotateX(Math.PI / 2), 'plastik'), 0, 0, 0),
          ...Array.from({ length: 7 }, (_, k) => { const a = (k * TUR) / 7, m = kutu(10, 14, 2, 'plastik', 12.5 * Math.cos(a), 0, 12.5 * Math.sin(a)); m.rotation.y = -a; return m; }));
        pervane.position.set(0, -87.5, 19.95);
        const fan = grup(yer(y.ag(y.cek(fanCerceve, 24.9).rotateX(Math.PI / 2), 'plastik', { esik: 60 }), 0, -87.5, 19.95), pervane);

        /* ---- kapak (üst ön yüz dâhil) ve klemens kapağı ---- */
        const kapak = grup(
          kutu(1.5, 200, 110.4, 'plastikAcik', -49.25, 0, 103.25), kutu(1.5, 200, 110.4, 'plastikAcik', 49.25, 0, 103.25),
          kutu(96.9, 1.5, 110.4, 'plastikAcik', 0, 99.25, 103.25), kutu(96.9, 1.5, 110.4, 'plastikAcik', 0, -99.25, 103.25),
          kutu(100, 115, 1.5, 'plastikAcik', 0, 42.5, 159.25),
          ...[-80, -60, -40, -20, 0, 20, 40, 60, 80].map((yy) => koyu(0.1, 4, 60, 50.05, yy, 100)));
        const klemensKapagi = grup(kutu(96.9, 84.8, 1.5, 'plastikAcik', 0, -57.5, 159.25), kutu(40, 3, 3, 'plastikAcik', 0, -93, 161.55));

        /* ---- güç tarafı: IGBT ve doğrultucu (soğutucu tabanında), güç kartı, kondansatörler ---- */
        const pwmMalzeme = y.malzeme('entegre').clone();
        const igbt = grup(kutu(50, 60, 11.9, 'entegre', 0, 10, 54), kutu(40, 8, 0.1, pwmMalzeme, 0, 30, 60.05, { kenar: false }),
          ...[-18, -10, -2, 6, 14].map((x) => kutu(1.2, 1.2, 19.95, 'celik', x, 38, 70, { kenar: false })));
        const dogrultucu = grup(kutu(34, 30, 9.9, 'entegre', 0, -45, 53.05), ...[-12, -4, 4, 12].map((x) => kutu(1.2, 1.2, 21.95, 'celik', x, -32, 69, { kenar: false })));
        const gucKarti = grup(kutu(94, 190, 2, 'kart', 0, 0, 81),
          kutu(16, 20, 18, 'plastik', -30, 5, 91.05), kutu(8, 24, 8, 'plastikAcik', -30, -12, 86.05),   // ön dolum rölesi ve direnci
          kutu(8, 8, 1.4, 'entegre', 20, 5, 82.75), kutu(8, 8, 1.4, 'entegre', 32, 5, 82.75));
        const kondansatorler = grup(...[[-22, 40], [22, 40], [-22, 70], [22, 70]].flatMap(([x, yy]) => [
          yer(y.ag(y.silindir(12.5, 40, 40), 'kondansator', { esik: 60 }), x, yy, 102.05), yer(y.ag(y.silindir(12, 0.5, 40), 'celik'), x, yy, 122.35)]));

        /* ---- kontrol kartı ve operatör paneli ---- */
        const kontrol = grup(kutu(90, 90, 1.6, 'kart', 0, 50, 140.8), kutu(16, 16, 1.4, 'entegre', -10, 40, 139.25), kutu(10, 10, 1.3, 'entegre', 15, 60, 139.3));
        const lcdMalzeme = y.malzeme('entegre').clone();
        const pot = grup(yer(y.ag(y.silindir(7, 6, 32), 'plastik'), 0, 0, 0), kutu(1.2, 5, 0.3, 'vurgu', 0, 3.5, 3.2, { kenar: false }));
        pot.position.set(22, 40, 169.05);
        const panel = grup(kutu(70, 64, 5.9, 'plastik', 0, 58, 163), kutu(50, 18, 0.1, lcdMalzeme, 0, 76, 166.05, { kenar: false }),
          ...[-24, -12, 0, 12].map((x) => kutu(9, 7, 2, 'plastikAcik', x, 58, 167)),
          kutu(10, 8, 2, 'kabloYesil', -22, 40, 167), kutu(10, 8, 2, 'kabloKirmizi', -6, 40, 167), pot);

        /* ---- klemensler: kontrol (üst sıra), güç (alt sıra); CHARGE LED’i ---- */
        const kontrolKl = grup(kutu(88, 12, 20, 'klemens', 0, -34, 144), kutu(70, 8, 51.9, 'plastik', 0, -34, 108));   // klemens ve karta oturan taban
        KONT.forEach((a, k) => kontrolKl.add(yer(y.ag(y.silindir(1.8, 1, 16), 'celik'), kontX(k), -34, 154.55), koyu(0.4, 2.6, 0.1, kontX(k), -34, 155.1), koyu(4, 0.1, 4, kontX(k), -40.1, 146)));
        const gucKl = grup(kutu(96, 16, 26, 'plastik', 0, -78, 141), kutu(80, 12, 45.9, 'plastik', 0, -78, 105));
        GUC.forEach((a, k) => gucKl.add(yer(y.ag(y.silindir(2.8, 1.1, 20), 'celik'), gucX(k), -78, 154.6), koyu(0.6, 4, 0.1, gucX(k), -78, 155.2), koyu(7, 0.1, 7, gucX(k), -86.1, 146)));
        const ledAg = yer(y.ag(y.silindir(2, 1, 16), y.malzeme('ledKirmizi').clone(), { kenar: false }), 40, -8, 160.55);
        const led = grup(ledAg);

        const parcalar = [
          { nesne: sogutucu, isaret: [50, 60, 20], patlat: [0, 0, -45] },
          { nesne: fan, isaret: [20, -87.5, 20], patlat: [0, -25, -45] },
          { nesne: kapak, isaret: [50, 30, 110], patlat: [-120, 0, 30] },
          { nesne: klemensKapagi, isaret: [30, -60, 160], patlat: [0, 0, 70] },
          { nesne: panel, isaret: [-30, 70, 166], patlat: [0, 0, 60] },
          { nesne: kontrol, isaret: [-44, 60, 141.6], patlat: [0, 0, 30] },
          { nesne: gucKarti, isaret: [-44, -10, 82], patlat: [0, 0, 0] },
          { nesne: kondansatorler, isaret: [-34.5, 40, 100], patlat: [0, 0, 0] },
          { nesne: igbt, isaret: [-25, 10, 54], patlat: [0, 0, 0] },
          { nesne: dogrultucu, isaret: [-17, -45, 53], patlat: [0, 0, 0] },
          { nesne: gucKl, isaret: [-45, -78, 154], patlat: [0, 0, 30] },
          { nesne: kontrolKl, isaret: [-43, -34, 154], patlat: [0, 0, 30] },
          { nesne: led, isaret: [40, -8, 161.05], patlat: [0, 0, 20] }
        ];
        parcalar.forEach((p) => kok.add(p.nesne));

        const etiketYerleri = GUC.map((a, k) => ({ nesne: gucKl, konum: [gucX(k), k % 2 ? -99 : -91, 150], parca: 10 }))   // iki kademe: dar aralıkta üst üste binmesin
          .concat(KONT.map((a, k) => ({ nesne: kontrolKl, konum: [kontX(k), k % 2 ? -15 : -22, 150], parca: 11 })));
        const sonuk = new T.Color(0x3a1414), kirmizi = new T.Color(0xff3b2f), lcdSonuk = lcdMalzeme.color.clone(), lcdYanik = new T.Color(0x9fd8a8);
        const pwmRenk = y.malzeme('vurgu').color.clone(), pwmSonuk = pwmMalzeme.color.clone();

        return {
          kok,
          parcalar,
          etiketYerleri,
          uygula(s) {
            /* Malzemeler burada okunur: çalışma zamanı her parçaya kendi kopyasını verir. */
            ledAg.material.color.copy(sonuk).lerp(kirmizi, Math.min(1, s.vdc / VDC));
            panel.children[1].material.color.copy(s.vdc > 300 ? lcdYanik : lcdSonuk);
            igbt.children[1].material.color.copy(s.f > 0 ? pwmRenk : pwmSonuk);
            pervane.rotation.y = s.fanAci;
            pot.rotation.z = 0.75 * Math.PI - (1.5 * Math.PI * s.hedef) / FNOM;   // saat yönünde artar: 0 Hz sol altta, 50 Hz sağ altta
          }
        };
      }
    }
  });

        ['Gövde (sol yarım)', 'Yalıtkan, ısıya dayanıklı plastik. Alt kenardaki klips tornavidayla aşağı çekilince kontaktör raydan çıkar.'],
        ['Gövde (sağ yarım)', 'Kontaktör sökülüp onarılmaz; kontaklar aşınınca ya da yapışınca kontaktör değiştirilir.'],
        ['DIN ray', 'TS35 × 7,5 ray (EN 60715). Büyük kontaktörler montaj plakasına vidayla bağlanır.']
      ],
      kamera: { yon: [1.05, 0.45, 1], patlak: [1, 0.35, 0.8] },
      secimdeOdak: true,
      kesitler: [{ ad: 'yan', planlar: [[-1, 0, 0, 0]] }],
      yeni: () => ({ bobin: false, dusuk: false, k: 0, t: 0 }),
      dugmeler: (s) => [
        ['bobin', s.bobin ? 'Bobin gerilimini kes' : 'Bobine gerilim ver', s.bobin],
        ['gerilim', s.dusuk ? 'Gerilim: düşük' : 'Gerilim: normal', s.dusuk]
      ],
      olay(s, olay) {
        if (olay === 'bobin') s.bobin = !s.bobin;
        else if (olay === 'gerilim') s.dusuk = !s.dusuk;
      },
      tik(s, dt) {
        s.t += dt;
        const vin = s.bobin && s.dusuk;
        const hedef = !s.bobin ? 0 : vin ? 0.8 + 0.1 * Math.sin(s.t * Math.PI * 2 * 6) : 1;   // vınlama: nüve tam çekemez, titrer (gösterim için yavaş)
        const once = s.k;
        s.k = hedef > s.k ? Math.min(hedef, s.k + dt * 10) : Math.max(hedef, s.k - dt * 8);
        return vin || s.k !== once;
      },
      durum(s) {
        if (s.bobin && s.dusuk) return { metin: 'Bobin gerilimi düşük: hareketli nüve tam çekemiyor, kontaktör vınlıyor. Ana kontaklar titreşir, tam basmaz; ısınır ve yapışabilir. Kontrol: A1-A2 gerilimini çekme anında ölç.', uyari: true };
        if (s.bobin) return { metin: s.k > 0.97 ? 'A1-A2 enerjili: nüve çekti, taşıyıcı geride. Ana kontaklar (1-2, 3-4, 5-6) kapalı, 13-14 kapalı, 21-22 açık.' : 'A1-A2 enerjili: nüve çekiyor…' };
        return { metin: s.k < 0.03 ? 'Bobin enerjisiz: yaylar taşıyıcıyı öne itiyor. Ana kontaklar açık, 13-14 açık, 21-22 kapalı.' : 'Bobin enerjisi kesildi: yaylar taşıyıcıyı öne itiyor…' };
      },

      kur(y) {
        const T = y.T;
        const kok = new T.Group();
        const grup = (...n) => { const g = new T.Group(); n.forEach((x) => g.add(x)); return g; };
        const yer = (n, x, yy, z) => { n.position.set(x, yy, z); return n; };
        const kutu = (w, h, d, m, x, yy, z, sec) => yer(y.ag(new T.BoxGeometry(w, h, d), m, sec), x, yy, z);
        const eksenX = (geo) => geo.rotateY(Math.PI / 2);   // şekil (x = −z, y) → x boyunca çekilmiş geometri
        const profil = (n) => new T.Shape(n.map(([z, yy]) => new T.Vector2(-z, yy)));
        const delik = (a, b) => new T.Path().moveTo(-a, -b).lineTo(a, -b).lineTo(a, b).lineTo(-a, b).closePath();
        /* Birbirine değen parçalar arasında 0,05 mm boşluk vardır (kesitte z-fighting olmasın). */

        /* ---- gövde: iki yarım kabuk (yan levha + çevre bandı), yan profil (z, y) ---- */
        const DIS = [[0, -40], [60, -40], [60, -25], [85, -25], [85, 25], [60, 25], [60, 40], [0, 40]];
        const IC = [[1.5, -38.5], [58.5, -38.5], [58.5, -23.5], [83.5, -23.5], [83.5, 23.5], [58.5, 23.5], [58.5, 38.5], [1.5, 38.5]];
        const levhaGeo = eksenX(new T.ExtrudeGeometry(profil(DIS), { depth: 1.5, bevelEnabled: false }));
        const bant = profil(DIS);
        bant.holes.push(new T.Path(IC.map(([z, yy]) => new T.Vector2(-z, yy))));
        const bantGeo = eksenX(new T.ExtrudeGeometry(bant, { depth: 20.9, bevelEnabled: false }));
        const cerceve = y.yuvarlakDikdortgen(9, 11, 1);
        cerceve.holes.push(delik(2.2, 3.2));
        const govdeSol = grup(yer(y.ag(levhaGeo, 'plastikAcik'), -22.5, 0, 0), yer(y.ag(bantGeo, 'plastikAcik'), -20.95, 0, 0),
          yer(y.ag(y.cek(cerceve, 0.1), 'entegre', { kenar: false }), -7, 0, 85.1));   // gösterge penceresi
        const govdeSag = grup(yer(y.ag(levhaGeo, 'plastikAcik'), 21, 0, 0), yer(y.ag(bantGeo, 'plastikAcik'), 0.05, 0, 0));
        govdeSol.add(kutu(12, 4, 6, 'plastikAcik', 0, -42.05, 3.2));   // DIN ray klipsi (alt kenarda)

        /* ---- klemensler: kafes, vida, kablo girişi. Ana klemensler omuzda (z = 60), bobin ve yardımcılar önde (z = 85). ---- */
        const vida = y.silindir(2.6, 1.4, 24), govdeVida = y.silindir(1.7, 1.85, 16), yuva = new T.BoxGeometry(0.5, 3.6, 0.2), giris = new T.BoxGeometry(6.5, 0.1, 6.5);
        const klemens = (x, yy, z0, uzun, yuz, disY) => [   // kafes z0 … z0 + uzun, vida başı yüzün 0,05 mm önünde
          kutu(8, 6, uzun, 'celik', x, yy, z0 + uzun / 2),
          yer(y.ag(govdeVida, 'celik', { esik: 60 }), x, yy, yuz - 0.975),
          yer(y.ag(vida, 'celik'), x, yy, yuz + 0.75),
          yer(y.ag(yuva, 'entegre', { kenar: false }), x, yy, yuz + 1.6),
          yer(y.ag(giris, 'entegre', { kenar: false }), x, disY, z0 + uzun / 2)
        ];
        const besleme = grup(...KUTUP.flatMap((x) => klemens(x, 34, 48, 10, 60, 40.1)));
        const yuk = grup(...KUTUP.flatMap((x) => klemens(x, -34, 48, 10, 60, -40.1)));
        const onKlemens = grup(...ON.flatMap(([x]) => [...klemens(x, 19, 75, 8, 85, 25.1), ...klemens(x, -19, 75, 8, 85, -25.1)]));

        /* ---- mıknatıs sistemi: sabit E nüve (uçlar ayrı; dış bacak ucunun bir bölümünü gölge halkası sarar), bobin ---- */
        const eSekli = profil([[4, -18], [22, -18], [22, -12], [10, -12], [10, -4], [22, -4], [22, 4], [10, 4], [10, 12], [22, 12], [22, 18], [4, 18]]);
        const sabitNuve = grup(yer(y.ag(eksenX(new T.ExtrudeGeometry(eSekli, { depth: 20, bevelEnabled: false })), 'sac'), -10, 0, 0),
          kutu(20, 8, 3.95, 'sac', 0, 0, 24.025),
          kutu(20, 6, 2.4, 'plastik', 0, 14, 2.75), kutu(20, 6, 2.4, 'plastik', 0, -14, 2.75));   // titreşim sönümleyici takozlar
        const halka = y.yuvarlakDikdortgen(21.8, 4.3, 0.4);
        halka.holes.push(delik(10.05, 1.275));
        [1, -1].forEach((d) => sabitNuve.add(kutu(20, 2.45, 3.95, 'sac', 0, d * 13.225, 24.025), kutu(20, 2.45, 3.95, 'sac', 0, d * 16.775, 24.025),
          yer(y.ag(y.cek(halka, 2), 'bakir', { esik: 60 }), 0, d * 16.775, 24.2)));
        const bobinSekli = y.yuvarlakDikdortgen(30, 22.8, 2);
        bobinSekli.holes.push(delik(10.5, 4.5));
        const bobinAg = y.ag(y.cek(bobinSekli, 15, { pah: 0.4 }), y.malzeme('bakir').clone(), { esik: 50 });
        const bobin = grup(yer(bobinAg, 0, 0, 18),
          y.ag(y.boru([[-14, 16, 76], [-19, 12, 62], [-19.5, 9, 34], [-15, 8, 20]], 0.5, 24), 'kabloKirmizi', { kenar: false }),
          y.ag(y.boru([[-14, -16, 76], [-19, -12, 62], [-19.5, -9, 34], [-15, -8, 20]], 0.5, 24), 'kabloKirmizi', { kenar: false }));
        const renkBakir = bobinAg.material.color.clone(), renkEnerjili = y.malzeme('vurgu').color.clone();

        /* ---- hareketli parçalar: her biri iç grupta; uygula iç grubu kaydırır (kök konumu patlatmaya ait) ---- */
        const armSekli = profil([[30, -18], [32, -18], [32, -12], [30, -12], [30, -4], [32, -4], [32, 4], [30, 4], [30, 12], [32, 12], [32, 18], [38, 18], [38, -18]]);
        const armIc = grup(yer(y.ag(eksenX(new T.ExtrudeGeometry(armSekli, { depth: 20, bevelEnabled: false })), 'sac'), -10, 0, 0));
        const armatur = grup(armIc);

        /* Taşıyıcı: x-z profili y boyunca çekilir; her kutupta köprünün geçtiği pencere (z 61,05 … 68). */
        const tasSekli = new T.Shape().moveTo(-20, 38.05).lineTo(20, 38.05).lineTo(20, 70).lineTo(-20, 70).closePath();
        KUTUP.forEach((x) => tasSekli.holes.push(new T.Path().moveTo(x - 3, 61.05).lineTo(x + 3, 61.05).lineTo(x + 3, 68).lineTo(x - 3, 68).closePath()));
        const tasIc = grup(
          yer(y.ag(new T.ExtrudeGeometry(tasSekli, { depth: 10, bevelEnabled: false }).rotateX(Math.PI / 2), 'plastik'), 0, 5, 0),
          kutu(4, 6, 15.95, 'vurgu', -7, 0, 78.025)   // gösterge: bekler durumda ön yüzden 1 mm çıkar, çekince içeri girer
        );
        const tasiyici = grup(tasIc);
        const donusYayi = [-18.3, 18.3].map((x) => yer(y.ag(y.helis(2, 0.35, 35.75, 10), 'celik', { kenar: false }), x, 0, 1.9));
        const yaylar = grup(...donusYayi);

        /* Ana kontaklar: sabit şeritler ve pabuçlar duran; köprüler ANA_YOL kadar gidip durur, basınç yayları sıkışır. */
        const anaKopru = grup();
        const basincYayi = KUTUP.map((x) => yer(y.ag(y.helis(1.3, 0.3, 4.2, 5), 'celik', { kenar: false }), x, 0, 63.45));
        const anaKontak = grup(anaKopru, ...basincYayi);
        KUTUP.forEach((x) => {
          [1, -1].forEach((d) => anaKontak.add(kutu(5, 19, 2, 'bakir', x, d * 21.5, 55), kutu(5, 4, 0.95, 'celik', x, d * 14, 56.525)));
          anaKopru.add(kutu(5, 32, 2, 'bakir', x, 0, 62.1), kutu(5, 4, 1.05, 'celik', x, 14, 60.525), kutu(5, 4, 1.05, 'celik', x, -14, 60.525));
        });

        /* Yardımcı kontaklar: NO (x = 0) köprüsü önde, sabit kontağı arkada; NC (x = 14) köprüsü arkada, sabit kontağı önde. */
        const yrdKopru = grup(
          kutu(3, 3, 6.05, 'plastik', 0, 0, 73.075), kutu(5, 26, 2, 'bakir', 0, 0, 77.15), kutu(5, 4, 1, 'celik', 0, 11, 75.6), kutu(5, 4, 1, 'celik', 0, -11, 75.6),
          kutu(3, 3, 1.9, 'plastik', 14, 0, 71.0), kutu(5, 26, 2, 'bakir', 14, 0, 73.0), kutu(5, 4, 0.95, 'celik', 14, 11, 74.525), kutu(5, 4, 0.95, 'celik', 14, -11, 74.525)
        );
        const yardimci = grup(yrdKopru);
        [1, -1].forEach((d) => {
          yardimci.add(kutu(5, 9.5, 1.9, 'bakir', 0, d * 13.75, 69.1), kutu(5, 2, 5.4, 'bakir', 0, d * 17.5, 72.8), kutu(5, 4, 1, 'celik', 0, d * 11, 70.6));
          yardimci.add(kutu(5, 8, 1.9, 'bakir', 14, d * 13, 77.05), kutu(5, 4, 1, 'celik', 14, d * 11, 75.55));
        });

        /* ---- DIN ray ---- */
        const ray = grup(yer(y.ag(y.dinRay(80), 'aluminyum'), -40, 0, -0.05));

        const parcalar = [
          { nesne: besleme, isaret: [-12, 34, 61.45], patlat: [0, 16, 0] },
          { nesne: yuk, isaret: [-12, -34, 61.45], patlat: [0, -16, 0] },
          { nesne: onKlemens, isaret: [-12.5, 19, 86.45], patlat: [0, 0, 30] },
          { nesne: bobin, isaret: [-8, 8, 25.5], patlat: [0, 0, 0] },
          { nesne: sabitNuve, isaret: [-5, 0, 26], patlat: [0, 0, -14] },
          { nesne: armatur, isaret: [-5, 18, 35], patlat: [0, 0, 8] },
          { nesne: tasiyici, isaret: [-18, 5, 50], patlat: [0, 0, 16] },
          { nesne: yaylar, isaret: [-18.3, 2.35, 20], patlat: [0, 0, 0] },
          { nesne: anaKontak, isaret: [-13.5, 22, 56], patlat: [0, 0, 16] },
          { nesne: yardimci, isaret: [-1, 18.5, 72], patlat: [0, 0, 16] },
          { nesne: govdeSol, isaret: [-10, 40, 20], patlat: [-34, 0, 0] },
          { nesne: govdeSag, isaret: [22.5, 0, 30], patlat: [30, 0, -120] },
          { nesne: ray, isaret: [30, 15, -0.05], patlat: [0, 0, -16] }
        ];
        parcalar.forEach((p) => kok.add(p.nesne));

        const etiketYerleri = [
          ...KUTUP.map((x) => ({ nesne: besleme, konum: [x, 44, 58], parca: 0 })),
          ...KUTUP.map((x) => ({ nesne: yuk, konum: [x, -44, 58], parca: 1 })),
          ...ON.flatMap(([x]) => [1, -1].map((d) => ({ nesne: onKlemens, konum: [x, d * 28.5, 82], parca: 2 })))
        ];

        return {
          kok,
          parcalar,
          etiketYerleri,
          uygula(s) {
            const c = STROK * s.k, b = Math.min(c, ANA_YOL);
            [armIc, tasIc, yrdKopru].forEach((g) => { g.position.z = -c; });
            anaKopru.position.z = -b;
            basincYayi.forEach((g) => { g.position.z = 63.45 - b; g.scale.z = (4.2 - (c - b)) / 4.2; });
            donusYayi.forEach((g) => { g.scale.z = (35.75 - c) / 35.75; });
            bobinAg.material.color.copy(renkBakir).lerp(renkEnerjili, s.bobin ? 0.45 : 0);
          }
        };
      }
    }
  });
})();

/* Termik röle: kontaktörün altına takılan 3 kutuplu tip. Ölçüler mm; z = 0 arka yüz (+z öne), y yukarı (+y kontaktör tarafı), x genişlik (45).
   İç yerleşim tipiktir; mekanizmanın biçimi üreticiye göre değişir. */
(() => {
  const KUTUP = [-13.5, 0, 13.5];
  const YRD = [[-15, '97'], [-5, '98'], [5, '95'], [15, '96']];   // ön üst klemensler: x, ad (97-98 NO, 95-96 NC)
  const ESIK = 1, FARK = 0.55;   // açma: en sıcak bimetal eşiği; faz kaybında sıcak–soğuk farkı (diferansiyel)

  Object.assign(MODELLER, {
    'termik-role': {
      aciklama: 'Termik rölenin 3B modeli: bağlantı pimleri, yük klemensleri, yardımcı kontak klemensleri, bimetaller ve ısıtıcılar, açma sürgüsü, mandal, yardımcı kontaklar, ayar düğmesi, reset ve test butonları, açma göstergesi, gövde.',
      not: 'Kesit ön kapağı kaldırır. Aşırı yük ya da faz kaybı seç: bimetaller ısınıp eğilir, sürgü mandalı iter, 95-96 açılır ve 97-98 kapanır. Bimetaller soğumadan reset tutmaz. Klemenslere dokununca uç adları çıkar.',
      etiketBaslik: 'Klemensler',
      etiketler: [
        ['1/L1', 'Kontaktörün 2/T1 ucuna takılan pim.'], ['3/L2', 'Kontaktörün 4/T2 ucuna takılan pim.'], ['5/L3', 'Kontaktörün 6/T3 ucuna takılan pim.'],
        ['2/T1', 'Motor ucu.'], ['4/T2', 'Motor ucu.'], ['6/T3', 'Motor ucu.'],
        ['97', 'NO yardımcı kontak (97-98): termik atınca kapanır; arıza lambası ya da PLC girişi.'], ['98', 'NO yardımcı kontağın öbür ucu.'],
        ['95', 'NC yardımcı kontak (95-96): kontaktör bobinine seri bağlanır; termik atınca açılır.'], ['96', 'NC yardımcı kontağın öbür ucu.']
      ],
      parcalar: [
        ['Bağlantı pimleri (1-3-5)', 'Termik doğrudan kontaktörün alt klemenslerine takılır; ayrı montajda bir altlık kullanılır.'],
        ['Yük klemensleri (2-4-6)', 'Motora giden fazlar buradan çıkar.'],
        ['Yardımcı kontak klemensleri', '95-96 NC kumanda devresine, 97-98 NO sinyal devresine bağlanır.'],
        ['Bimetaller ve ısıtıcılar', 'Her fazın akımı bir ısıtıcıdan geçer ve bimetali ısıtır; bimetal akımın karesiyle orantılı ısınıp eğilir. Soğuması zaman alır.'],
        ['Açma sürgüsü', 'Bimetallerin uçları sürgüyü iter. Faz kaybında soğuk kalan bimetal ikinci bir sürgüyü tutar; aradaki fark (diferansiyel) röleyi daha erken açtırır.'],
        ['Açma mandalı', 'Sürgü yeterince ilerleyince mandal boşalır ve yardımcı kontakları çevirir.'],
        ['Yardımcı kontaklar', 'Salıncak kol NC köprüyü açar, NO köprüyü kapatır. Termik yükü kesmez; kontaktörü düşürür.'],
        ['Akım ayar düğmesi', 'Motor etiketindeki anma akımına getirilir. Yıldız-üçgende termik sargı kolundaysa ayar = anma akımı × 0,58.'],
        ['Reset ve test butonları', 'Mavi reset rölesi kurar; soğumadan tutmaz. Kırmızı buton röleyi elle açtırıp kontakları dener.'],
        ['Açma göstergesi', 'Röle atınca turuncu görünür; arıza ararken ilk bakılacak yer.'],
        ['Gövde', 'Yalıtkan plastik.'],
        ['Ön kapak', 'Ayar ve butonlar ön yüzdedir; birçok modelde ayar mühürlenebilir kapakla örtülür.']
      ],
      kamera: { yon: [0.5, 0.4, 1], patlak: [0.7, 0.45, 1] },
      secimdeOdak: true,
      kesitler: [{ ad: 'kapaksız', planlar: [[0, 0, -1, 67]] }],
      yeni: () => ({ yuk: 'normal', isi: [0.3, 0.3, 0.3], atti: false, sebep: '', k: 0, uyari: '' }),
      dugmeler: (s) => [
        ['asiri', 'Aşırı yük', s.yuk === 'asiri'],
        ['faz', 'Faz kaybı', s.yuk === 'faz'],
        ['reset', 'Reset'],
        ['test', 'Test']
      ],
      olay(s, olay) {
        s.uyari = '';
        if (olay === 'asiri') s.yuk = s.yuk === 'asiri' ? 'normal' : 'asiri';
        else if (olay === 'faz') s.yuk = s.yuk === 'faz' ? 'normal' : 'faz';
        else if (olay === 'test') { if (!s.atti) { s.atti = true; s.sebep = 'test'; } }
        else if (olay === 'reset') {
          if (!s.atti) s.uyari = 'kurulu';
          else if (Math.max(...s.isi) > 0.45) s.uyari = 'sicak';
          else { s.atti = false; s.sebep = ''; }
        }
      },
      tik(s, dt) {
        const once = s.isi.join() + s.atti + s.k;
        const hedef = (i) => (s.atti ? 0 : s.yuk === 'asiri' ? 1.25 : s.yuk === 'faz' ? (i === 0 ? 0 : 1.25) : 0.3);   // atınca motor durur, akım kesilir
        s.isi = s.isi.map((v, i) => {
          const h = hedef(i), hiz = h > v ? (s.yuk === 'faz' ? 0.5 : 0.35) : 0.2;   // gösterim: gerçekte dakikalar
          const n = v + (h - v) * Math.min(1, dt * hiz * 2);
          return Math.abs(h - n) < 0.002 ? h : n;
        });
        const enSicak = Math.max(...s.isi), enSoguk = Math.min(...s.isi);
        if (!s.atti && (enSicak >= ESIK || (enSicak >= 0.7 && enSicak - enSoguk >= FARK))) { s.atti = true; s.sebep = enSicak >= ESIK ? 'asiri' : 'faz'; }
        const hk = s.atti ? 1 : 0;
        s.k = hk > s.k ? Math.min(hk, s.k + dt * 10) : Math.max(hk, s.k - dt * 10);
        return s.isi.join() + s.atti + s.k !== once;
      },
      durum(s) {
        const yuzde = Math.round(Math.min(1, Math.max(...s.isi)) * 100);
        if (s.uyari === 'sicak') return { metin: 'Bimetaller henüz soğumadı: reset tutmaz. Biraz bekle; önce aşırı yükün nedenini bul.', uyari: true };
        if (s.uyari === 'kurulu') return { metin: 'Röle zaten kurulu; reset gerekmiyor.' };
        if (s.atti) {
          const neden = s.sebep === 'test' ? 'Test butonu röleyi elle açtırdı.' : s.sebep === 'faz' ? 'Faz kaybı: soğuk kalan bimetal ile ısınanlar arasındaki fark röleyi erken açtırdı.' : 'Aşırı yük: bimetaller eşiğe kadar eğildi.';
          return { metin: `${neden} 95-96 açıldı, kontaktör bobini enerjisiz kaldı ve motor durdu; 97-98 kapandı. Gösterge turuncu.${s.sebep !== 'test' && s.yuk !== 'normal' ? ' Neden sürüyor: reset sonrası yine atar.' : ''}`, uyari: s.sebep !== 'test' };
        }
        if (s.yuk === 'asiri') return { metin: `Aşırı yük (ör. 1,5 × Ir): ısıtıcılar bimetalleri ısıtıyor, bimetaller eğiliyor… %${yuzde}. Sınıf 10 röle 1,5 × Ir’de sıcak durumdan 2 dakikadan kısa sürede açar; gösterim hızlandırıldı.` };
        if (s.yuk === 'faz') return { metin: `Faz kaybı: L1’de akım yok, öbür iki fazın akımı arttı. L1 bimetali soğuyor, ötekiler ısınıyor… %${yuzde}. Diferansiyel mekanizma farkı algılar.` };
        return { metin: 'Motor anma akımında: bimetaller ılık ve biraz eğik, açma eşiğinin altında. 95-96 kapalı (bobin beslenir), 97-98 açık.' };
      },

      kur(y) {
        const T = y.T;
        const kok = new T.Group();
        const grup = (...n) => { const g = new T.Group(); n.forEach((x) => g.add(x)); return g; };
        const yer = (n, x, yy, z) => { n.position.set(x, yy, z); return n; };
        const kutu = (w, h, d, m, x, yy, z, sec) => yer(y.ag(new T.BoxGeometry(w, h, d), m, sec), x, yy, z);
        const koyu = (w, h, d, x, yy, z) => kutu(w, h, d, 'entegre', x, yy, z, { kenar: false });
        const tel = (n, r = 1) => y.ag(y.boru(n, r, 24), 'bakir', { kenar: false });
        const onVida = (x, yy, on) => [yer(y.ag(y.silindir(1.6, 69.95 - on, 16), 'celik', { esik: 60 }), x, yy, (on + 70) / 2), yer(y.ag(y.silindir(2.6, 1.4, 24), 'celik'), x, yy, 70.75), koyu(0.5, 3.4, 0.2, x, yy, 71.6)];   // kafesin önünden ön yüze
        /* Birbirine değen parçalar arasında 0,05 mm boşluk vardır (kesitte z-fighting olmasın). */

        /* ---- gövde (arka, yanlar, üst, alt) ve ön kapak ---- */
        const govde = grup(kutu(45, 66, 1.5, 'plastikAcik', 0, 0, 0.75),
          kutu(1.5, 66, 66.9, 'plastikAcik', -21.75, 0, 35), kutu(1.5, 66, 66.9, 'plastikAcik', 21.75, 0, 35),
          kutu(41.9, 1.5, 66.9, 'plastikAcik', 0, 32.25, 35), kutu(41.9, 1.5, 66.9, 'plastikAcik', 0, -32.25, 35));
        const onKapak = grup(kutu(45, 66, 1.5, 'plastikAcik', 0, 0, 69.25));

        /* ---- bağlantı pimleri ve yük klemensleri ---- */
        const pimler = grup(...KUTUP.flatMap((x) => [kutu(4, 22, 2, 'bakir', x, 44, 40), tel([[x, 33.5, 40], [x, 27, 27], [x, 21, 24], [x, 16, 26]])]));
        const yuk = grup(...KUTUP.flatMap((x) => [kutu(8, 6, 10, 'celik', x, -27, 58), ...onVida(x, -27, 63), koyu(6, 0.1, 6, x, -33.05, 58),
          tel([[x, -12.5, 27], [x, -18, 34], [x, -24, 52]])]));

        /* ---- bimetaller ve ısıtıcılar: alt uçtan bağlı, ısınınca üst uç öne eğilir ---- */
        const serit = [], bimetal = KUTUP.map((x) => {
          const s = kutu(5, 32, 1.2, y.malzeme('celik').clone(), 0, 16, 0);
          serit.push(s);
          const isitici = yer(y.ag(y.helis(3.2, 0.55, 26, 7).rotateX(-Math.PI / 2), 'bakir', { kenar: false }), 0, 3, 0);
          return yer(grup(s, isitici, kutu(7, 3, 4, 'plastik', 0, -1.55, 0)), x, -14, 27);
        });
        const bimetaller = grup(...bimetal);
        const renkSoguk = serit[0].material.color.clone(), renkSicak = y.malzeme('kuzey').color.clone();

        /* ---- açma sürgüsü, mandal, yardımcı kontaklar ---- */
        const surguIc = grup(kutu(34, 4, 2, 'plastik', 0, 18, 30.5), kutu(3, 4, 1.9, 'plastik', 18.5, 18, 28.5));   // yandaki dil mandalı iter
        const surgu = grup(surguIc);
        const mandalIc = grup(kutu(3, 18, 3, 'plastik', 0, 9, 0), kutu(3, 3, 26, 'plastik', 0, 17, 14));
        const mandal = yer(grup(mandalIc), 19, 4, 33);   // alt ucundan döner, üst kolu salıncağa uzanır
        const yrdKlemens = grup(...YRD.flatMap(([x]) => [kutu(8, 6, 8, 'celik', x, 27, 62), ...onVida(x, 27, 66), koyu(6, 0.1, 6, x, 33.05, 62)]));
        /* Salıncak: bekler durumda NC köprüsü 95-96 pabuçlarına değer, NO köprüsü 97-98’in 2,5 mm altındadır. */
        const salincak = yer(grup(kutu(36, 2, 2, 'plastik', 0, 0, 0), kutu(14, 1.45, 2, 'bakir', 10, 1.775, 0), kutu(14, 1.45, 2, 'bakir', -10, 1.775, 0), kutu(3, 6, 2, 'plastik', 0, -3.5, 0)), 0, 18, 63);
        const yrdKontak = grup(salincak, ...YRD.flatMap(([x, a]) => (a === '95' || a === '96'
          ? [kutu(4, 2.45, 2, 'bakir', x, 22.725, 63), kutu(4, 0.9, 2, 'celik', x, 21.0, 63)]
          : [kutu(4, 0.9, 2, 'celik', x, 23.5, 63)])));

        /* ---- ön yüz: ayar düğmesi, reset ve test, gösterge ---- */
        const ayar = grup(yer(y.ag(y.halka(7.6, 10.5, 0.1, 48), 'entegre', { kenar: false }), -8, 8, 70.1),
          yer(y.ag(y.silindir(7, 3, 40), 'plastik'), -8, 8, 71.55), kutu(1, 5, 0.3, 'plastikAcik', -8, 11, 73.2, { kenar: false }));
        const butonlar = grup(yer(y.ag(y.silindir(3.5, 3, 24), 'kabloMavi'), 10, 12, 71.55), yer(y.ag(y.silindir(2.5, 2, 24), 'kabloKirmizi'), 10, 2, 71.05));
        const gostergeAg = kutu(8, 3, 0.1, y.malzeme('plastik').clone(), 0, -10, 70.1, { kenar: false });
        const gosterge = grup(gostergeAg);

        const parcalar = [
          { nesne: pimler, isaret: [-11.5, 48, 41], patlat: [0, 14, 0] },
          { nesne: yuk, isaret: [-12, -27, 71.45], patlat: [0, -12, 12] },
          { nesne: yrdKlemens, isaret: [-13.5, 27, 71.45], patlat: [0, 12, 14] },
          { nesne: bimetaller, isaret: [-13.5, 11, 27.6], patlat: [0, 0, 0] },
          { nesne: surgu, isaretNesne: surguIc, isaret: [-10, 20, 30.5], patlat: [0, 0, 12] },
          { nesne: mandal, isaretNesne: mandalIc, isaret: [1.5, 9, 0], patlat: [6, 0, 16] },
          { nesne: yrdKontak, isaretNesne: salincak, isaret: [-10, 2.5, 0], patlat: [0, 0, 22] },
          { nesne: ayar, isaret: [-8, 8, 73.05], patlat: [0, 0, 55] },
          { nesne: butonlar, isaret: [10, 12, 73.05], patlat: [0, 0, 55] },
          { nesne: gosterge, isaret: [0, -10, 70.15], patlat: [0, 0, 55] },
          { nesne: govde, isaret: [22.5, 0, 35], patlat: [0, 0, -20] },
          { nesne: onKapak, isaret: [16, -14, 70], patlat: [0, 0, 45] }
        ];
        parcalar.forEach((p) => kok.add(p.nesne));

        const etiketYerleri = [
          ...KUTUP.map((x) => ({ nesne: pimler, konum: [x, 58, 40], parca: 0 })),
          ...KUTUP.map((x) => ({ nesne: yuk, konum: [x, -38, 60], parca: 1 })),
          ...YRD.map(([x]) => ({ nesne: yrdKlemens, konum: [x, 38, 64], parca: 2 }))
        ];
        const turuncu = new T.Color(0xf08a24), sonuk = gostergeAg.material.color.clone();

        return {
          kok,
          parcalar,
          etiketYerleri,
          uygula(s) {
            /* Malzemeler burada okunur: çalışma zamanı her parçaya kendi kopyasını verir. */
            bimetal.forEach((g, i) => { g.rotation.x = 0.12 * Math.min(1.1, s.isi[i]); serit[i].material.color.copy(renkSoguk).lerp(renkSicak, 0.8 * Math.min(1, s.isi[i])); });
            const uc = Math.max(...s.isi.map((v) => 32 * Math.sin(0.12 * Math.min(1.1, v))));
            surguIc.position.z = Math.max(0, uc - 1.9) + 1.5 * s.k;
            mandal.rotation.x = 0.35 * s.k;   // üst uç öne, sürgüden uzağa
            salincak.rotation.z = -0.25 * s.k;   // sağ uç (NC) iner, sol uç (NO) kalkar
            gostergeAg.material.color.copy(s.atti ? turuncu : sonuk);
          }
        };
      }
    }
  });
})();

    for (let n = 880; n <= 3000; n += 40) d += (d ? 'L' : 'M') + X(n).toFixed(1) + ' ' + Y((9550 * 5.5) / n).toFixed(1);
    const nokta = (n, no, ad, dx, dy) => { const t = (9550 * 5.5) / n; return `<circle cx="${X(n)}" cy="${Y(t)}" r="5" style="fill:var(--accent);stroke:var(--ink)" stroke-width="1.5"></circle>` + _yazi(X(n) + dx, Y(t) + dy, `${ad} · ${sayi(t, 0)} N·m`, { b: 9, w: 600 }) + _no(X(n) + dx - 14, Y(t) + dy - 4, no); };
    let izg = '';
    [0, 1000, 2000, 3000].forEach((n) => { izg += _yazi(X(n), 186, sayi(n), { a: 'middle', b: 9, r: '--muted' }); });

      <path d="M${X(1000)} 20V170M${X(2000)} 20V170M40 ${Y(20)}H300M40 ${Y(40)}H300" style="stroke:var(--line)" stroke-width="1" stroke-dasharray="3 3" fill="none"></path>
      ${_tel('M40 16V170H304', '--ink', { w: 1.5 })}${izg}
      ${_yazi(46, 14, 'Tork (N·m)', { b: 10, w: 600 })}${_yazi(300, 162, 'Devir (d/dk)', { a: 'end', b: 10, w: 600 })}
      ${_tel(d, '--signal', { w: 2.5 })}

      ${nokta(960, 1, '6 kutup', 30, 4)}${nokta(1450, 2, '4 kutup', 30, 2)}${nokta(2900, 3, '2 kutup', -120, 22)}

  })(),
});

Object.assign(HESAPLAR, {
  motorAkim: {
    gruplar: [
      { k: 'p', ad: 'Motor gücü (400 V)', v: 2.2, s: [[0.75, '0,75 kW'], [2.2, '2,2 kW'], [5.5, '5,5 kW'], [11, '11 kW']] },
      { k: 'cos', ad: 'cos φ', v: 0.82, s: [[0.78, '0,78'], [0.82, '0,82'], [0.86, '0,86']] },
      { k: 'eta', ad: 'Verim', v: 0.86, s: [[0.8, '%80'], [0.86, '%86'], [0.9, '%90']] }
    ],
    hesapla(d) {
      const I = (d.p * 1000) / (Math.sqrt(3) * 400 * d.cos * d.eta);
      return {
        sonuclar: [['Anma akımı', sayi(I, 1) + ' A'], ['Y/Δ termik ayarı', sayi(I * 0.58, 1) + ' A'], ['Direkt kalkış', '≈ ' + sayi(I * 5, 0) + '–' + sayi(I * 8, 0) + ' A'], ['Çekilen güç', sayi(d.p / d.eta, 2) + ' kW']],
        adimlar: [`I = P ÷ (√3 × U × cos φ × η)`, `I = ${sayi(d.p * 1000)} ÷ (1,73 × 400 × ${sayi(d.cos)} × ${sayi(d.eta)}) ≈ ${sayi(I, 1)} A`, `Termik (sargı kolunda): ${sayi(I, 1)} × 0,58 ≈ ${sayi(I * 0.58, 1)} A`]
      };
    },
    not: 'Hesap yaklaşıktır; etiketteki akım her zaman önceliklidir. Kalkış akımı motora göre değişir.'

  tork: {

      { k: 'p', ad: 'Motor gücü', v: 5.5, s: [[0.75, '0,75 kW'], [2.2, '2,2 kW'], [5.5, '5,5 kW'], [11, '11 kW'], [22, '22 kW']] },

(() => {
  const TUR = Math.PI * 2, DER = Math.PI / 180;

        ['Sincap kafesi', 'Oluklara dökülmüş alüminyum çubuklar iki uçta kısa devre halkalarıyla birleşir. Çubuklar gürültüyü ve tork dalgalanmasını azaltmak için eğik dökülür. Halkalardaki kanatçıklar içerideki havayı karıştırır.'],
        ['Mil ve kama', 'Tork, mil ucundaki kamayla kaplin ya da kasnağa aktarılır. Mil çapı ve boyu gövde büyüklüğüne göre standarttır (IEC 60072).'],
        ['Rulmanlar', 'Sabit bilyalı rulmanlar. Motor arızalarının önemli bölümü rulmandan çıkar: sesi, titreşimi ve ısınmayı izle; gresörlüklü tipte düzenli yağla.'],
        ['Ön kapak (D tarafı)', 'Mil çıkış tarafı (drive end). Ön rulmanı taşır, gövdeye cıvatayla bağlanır. Flanşlı motorlarda (B5, B14) bu kapak flanşlıdır.'],

        ['Fan', 'Mile takılı, düz kanatlı fan; iki yönde de soğutur. Devir düşünce soğutma da azalır: sürücüyle uzun süre düşük devirde yüklü çalışan motora ayrı fan gerekebilir.'],
        ['Fan kapağı', 'Fanı korur, havayı gövde kanatlarına yönlendirir. Izgarası tıkanırsa motor ısınır.'],
        ['Klemens kutusu kapağı', 'Contalıdır; motorun IP koruma derecesini (ör. IP55) sağlar. Conta bozuksa ya da vida eksikse su girer.'],
        ['Klemens tablası ve köprüler', 'Altı uç iki sırada: üstte U1-V1-W1, altta kaydırılmış W2-U2-V2. Köprüler yıldız ya da üçgen bağlantıyı kurar. Gevşek somun ısınır ve yanar.'],
        ['Besleme kablosu', 'L1-L2-L3 fazları U1-V1-W1’e, koruma iletkeni (PE, yeşil-sarı; modelde yeşil) topraklama vidasına bağlanır. İki fazın yeri değişince motor ters döner.']
      ],
      kamera: { yon: [1.15, 0.6, 1.1], patlak: [1, 0.55, 0.55] },
      secimdeOdak: true,
      yeni: () => ({ calisiyor: false, ucgen: false, ters: false, teta: 0, hiz: 0, aci: 0 }),
      dugmeler: (s) => [
        ['calis', s.calisiyor ? 'Durdur' : 'Çalıştır', s.calisiyor],
        ['baglanti', s.ucgen ? 'Bağlantı: üçgen (Δ)' : 'Bağlantı: yıldız (Y)', s.ucgen],
        ['yon', s.ters ? 'Yön: ters (L1 ↔ L2)' : 'Yön: ileri', s.ters]
      ],
      olay(s, olay) {
        if (olay === 'calis') s.calisiyor = !s.calisiyor;
        else if (olay === 'baglanti') s.ucgen = !s.ucgen;
        else if (olay === 'yon') s.ters = !s.ters;
      },
      tik(s, dt) {
        const hedef = s.calisiyor ? (s.ters ? -1 : 1) : 0, once = s.hiz;
        s.hiz += (hedef - s.hiz) * Math.min(1, dt * 1.6);
        if (Math.abs(hedef - s.hiz) < 0.003) s.hiz = hedef;
        if (s.calisiyor) s.teta += dt * TUR * FE;
        s.aci += (dt * TUR * FE * (1 - KAYMA) * s.hiz) / 2;   // 4 kutup: mekanik hız = elektriksel ÷ 2
        return s.calisiyor || s.hiz !== 0 || once !== s.hiz;
      },
      durum(s) {
        const b = s.ucgen
          ? 'Üçgen (Δ): köprüler dikey (U1-W2, V1-U2, W1-V2); her sargıya şebeke gerilimi (400 V) düşer.'
          : 'Yıldız (Y): köprüler alt sıradaki W2-U2-V2’yi birleştirir; her sargıya 400 V ÷ √3 ≈ 230 V düşer.';
        const y = s.ters ? ' L1 ile L2 yer değiştirdi: döner alan ve rotor ters yönde.' : '';
        if (!s.calisiyor) return { metin: `${b} Motor ${s.hiz !== 0 ? 'duruyor (rotor yavaşlıyor)' : 'duruyor'}.${y}` };
        return { metin: `${b} Döner alan 4 kutupta 50 Hz’de 1.500 d/dk; rotor biraz geriden döner (yükte tipik 1.400–1.450 d/dk), fark kaymadır. Gösterim yavaşlatıldı, kayma abartıldı.${y}` };
      },

      kur(y) {
        const T = y.T;
        const kok = new T.Group();
        const grup = (...n) => { const g = new T.Group(); n.forEach((x) => g.add(x)); return g; };
        const yer = (n, x, yy, z) => { n.position.set(x, yy, z); return n; };
        const kutu = (w, h, d, m, x, yy, z, sec) => yer(y.ag(new T.BoxGeometry(w, h, d), m, sec), x, yy, z);
        const kutupsal = (r, a) => new T.Vector2(r * Math.cos(a), r * Math.sin(a));
        const ayna = (p) => p.map(([r, z, k]) => [r, -z, k]).reverse();   // profili z = 0’a göre aynala (yön korunur)
        const dikdortgenYol = (noktalar) => { const p = new T.Path(); noktalar.forEach(([a, b], i) => (i ? p.lineTo(a, b) : p.moveTo(a, b))); p.closePath(); return p; };
        /* Birbirine değen parçalar arasında 0,05 mm boşluk vardır (kesitte z-fighting olmasın). */

        /* ---- gövde: kanatlı boru (iç çap 124), ayaklar, klemens kutusu yuvası ---- */
        const kanatlar = [];
        for (let k = 0; k < 36; k++) { const a = k * 10; if (Math.abs(a - 90) > 30 && Math.abs(a - 270) > 30) kanatlar.push(a * DER); }
        const cevre = [];
        kanatlar.forEach((f, i) => {
          const w = 1.5, bas = f + w / 70, son = (i + 1 < kanatlar.length ? kanatlar[i + 1] : kanatlar[0] + TUR) - w / 70;
          cevre.push(kutupsal(70, f - w / 70), kutupsal(80, f - w / 80), kutupsal(80, f + w / 80), kutupsal(70, bas));
          const n = Math.max(1, Math.round((son - bas) / (2.5 * DER)));
          for (let j = 1; j < n; j++) cevre.push(kutupsal(70, bas + ((son - bas) * j) / n));
        });
        const govdeSekli = new T.Shape(cevre);
        govdeSekli.holes.push(new T.Path().absarc(0, 0, 62, 0, TUR, true));
        const ayakSekli = new T.Shape([new T.Vector2(-70, -80), new T.Vector2(70, -80), new T.Vector2(70, -72), new T.Vector2(46, -72)]
          .concat(Array.from({ length: 17 }, (_, i) => { const a = -Math.acos(46 / 66) - (i / 16) * (Math.PI - 2 * Math.acos(46 / 66)); return kutupsal(66, a); }))
          .concat([new T.Vector2(-46, -72), new T.Vector2(-70, -72)]));
        const yuvaSekli = new T.Shape([new T.Vector2(42, 72), new T.Vector2(-42, 72)]
          .concat(Array.from({ length: 17 }, (_, i) => { const a = Math.PI - Math.acos(42 / 66) - (i / 16) * (Math.PI - 2 * Math.acos(42 / 66)); return kutupsal(66, a); })));
        const kutuHalka = y.yuvarlakDikdortgen(84, 70, 4);
        kutuHalka.holes.push(y.yuvarlakDikdortgen(78, 64, 2));
        const delikGeo = y.silindir(5, 0.1, 24).rotateX(Math.PI / 2);
        const govde = grup(
          y.ag(y.cek(govdeSekli, 130), 'aluminyum', { esik: 60 }),
          yer(y.ag(y.cek(ayakSekli, 24), 'aluminyum', { esik: 60 }), 0, 0, 50),
          yer(y.ag(y.cek(ayakSekli, 24), 'aluminyum', { esik: 60 }), 0, 0, -50),
          yer(y.ag(y.cek(yuvaSekli, 70), 'aluminyum', { esik: 60 }), 0, 0, 0),
          yer(y.ag(y.cek(kutuHalka, 34).rotateX(-Math.PI / 2), 'aluminyum'), 0, 89, 0),
          ...[[-62.5, 50], [62.5, 50], [-62.5, -50], [62.5, -50]].map(([x, z]) => yer(y.ag(delikGeo, 'entegre', { kenar: false }), x, -71.9, z))   // ayak delikleri (gösterim)
        );

        /* ---- stator: 36 oluklu sac paket (delik Ø76), oluk iletkenleri ve sargı başları ---- */
        const statorSekli = new T.Shape().absarc(0, 0, 61.95, 0, TUR, false);
        const bosluk = new T.Path();
        for (let i = 0; i < OLUK; i++) {
          const a = ((i + 0.5) * TUR) / OLUK;
          [[38, a - 2.41 * DER], [50, a - 2.75 * DER], [50, a + 2.75 * DER], [38, a + 2.41 * DER]].forEach(([r, b], j) => { const v = kutupsal(r, b); if (i || j) bosluk.lineTo(v.x, v.y); else bosluk.moveTo(v.x, v.y); });
        }
        bosluk.closePath();
        statorSekli.holes.push(bosluk);
        const stator = grup(y.ag(y.cek(statorSekli, 80), 'sac', { esik: 60 }));
        const olukGeo = new T.BoxGeometry(2.8, 10.5, 82);
        const bakir = y.malzeme('bakir');
        const olukAglar = Array.from({ length: OLUK }, (_, i) => {
          const a = ((i + 0.5) * TUR) / OLUK, m = y.ag(olukGeo, bakir.clone(), { kenar: false });   // her oluk kendi malzemesiyle (akıma göre renklenir)
          m.position.set(44.25 * Math.cos(a), 44.25 * Math.sin(a), 0);
          m.rotation.z = a - Math.PI / 2;
          return m;
        });
        const basProfil = [[40.5, 40.05], [56.5, 40.05, 1], [57, 44, 1], [55, 57, 1], [52, 58.5, 1], [45, 58.5, 1], [42, 57, 1], [40, 44, 1], [40.5, 40.05]];
        /* Sargı başları 12 faz kuşağına bölünür (her biri 30°, 3 oluk); oluklar gibi akıma göre renklenir. */
        const basAglar = [];
        [basProfil, ayna(basProfil)].forEach((pr) => { for (let b = 0; b < 12; b++) basAglar.push(y.ag(y.torna(pr, 6, (b * TUR) / 12, TUR / 12), bakir.clone(), { esik: 50 })); });
        const sargi = grup(...olukAglar, ...basAglar);
        const renkBakir = bakir.color.clone(), renkArti = y.malzeme('kuzey').color.clone(), renkEksi = y.malzeme('guney').color.clone();

        /* ---- rotor: sac paket, eğik alüminyum çubuklar, kısa devre halkaları ---- */
        const rotor = grup(y.ag(y.halka(12.05, 37.65, 80), 'sac', { esik: 60 }));
        const cubukGeo = new T.BoxGeometry(3, 6, 81), egim = Math.atan((33 * TUR) / CUBUK / 80);
        const kafes = grup(...Array.from({ length: CUBUK }, (_, i) => {
          const a = (i * TUR) / CUBUK, m = y.ag(cubukGeo, 'aluminyum', { kenar: false });
          m.position.set(33 * Math.cos(a), 33 * Math.sin(a), 0);
          m.rotation.set(0, egim, a - Math.PI / 2, 'ZYX');   // önce radyal eksen etrafında eğ, sonra yerine döndür
          return m;
        }));
        const halkaGeo = y.halka(26, 37.5, 7.95), kanatcikGeo = new T.BoxGeometry(2, 9, 5.95);
        [1, -1].forEach((d) => {
          kafes.add(yer(y.ag(halkaGeo, 'aluminyum', { esik: 60 }), 0, 0, d * 44.025));
          for (let k = 0; k < 6; k++) {
            const a = (k * TUR) / 6, m = y.ag(kanatcikGeo, 'aluminyum', { kenar: false });
            m.position.set(31.5 * Math.cos(a), 31.5 * Math.sin(a), d * 51.025);
            m.rotation.z = a - Math.PI / 2;
            kafes.add(m);
          }
        });

        /* ---- mil (Ø19 çıkış, kama 6 × 6) ve rulmanlar (6204) ---- */
        const mil = grup(
          y.ag(y.torna([[0, -95], [9, -95, 1], [9, -77, 1], [9.95, -77, 1], [9.95, -60, 1], [12, -60, 1], [12, 60, 1], [9.95, 60, 1], [9.95, 77, 1], [9.5, 77, 1], [9.5, 117.5, 1], [9, 118, 1], [0, 118]], 40), 'celik', { esik: 50 }),
          kutu(6, 6, 32, 'celik', 0, 8, 100)
        );
        const rulmanlar = grup(yer(y.rulman(10, 23.5, 14), 0, 0, 69), yer(y.rulman(10, 23.5, 14), 0, 0, -69));

        /* ---- yatak kapakları ---- */
        const kapakProfil = [[23.55, 58], [30, 58, 1], [30, 65.05, 1], [70, 65.05, 1], [70, 71, 1], [30, 71, 1], [30, 78, 1], [11, 78, 1], [11, 76.05, 1], [23.55, 76.05, 1], [23.55, 58]];
        const onKapak = grup(y.ag(y.torna(kapakProfil, 64), 'aluminyum', { esik: 50 }));
        const arkaKapak = grup(y.ag(y.torna(ayna(kapakProfil), 64), 'aluminyum', { esik: 50 }));
        [45, 135, 225, 315].forEach((a) => onKapak.add(yer(y.ag(y.silindir(3.5, 3, 6), 'celik'), 64 * Math.cos(a * DER), 64 * Math.sin(a * DER), 72.55)));

        /* ---- fan ve fan kapağı ---- */
        const kanatGeo = new T.BoxGeometry(2.5, 40, 11.9);
        const fan = grup(yer(y.ag(y.halka(9.05, 15, 12), 'plastik'), 0, 0, -86), ...Array.from({ length: 10 }, (_, k) => {
          const a = (k * TUR) / 10, m = y.ag(kanatGeo, 'plastik');

/* Kablo ve topraklama: hesaplayıcılar. */
Object.assign(HESAPLAR, {
  gerilimDusumu: {
    gruplar: [
      { k: 'faz', ad: 'Sistem', v: 1, s: [[1, 'Tek faz 230 V'], [3, 'Üç faz 400 V']] },
      { k: 'kaynak', ad: 'Besleme', v: 1, s: [[1, 'Şebekeden'], [2, 'Özel trafodan']] },
      { k: 's', ad: 'Kesit (bakır, mm²)', v: 2.5, s: [[1.5, '1,5'], [2.5, '2,5'], [4, '4'], [6, '6'], [10, '10'], [16, '16']] },
      { k: 'l', ad: 'Hat uzunluğu', v: 25, s: [[10, '10 m'], [25, '25 m'], [50, '50 m'], [100, '100 m']] },
      { k: 'i', ad: 'Akım', v: 16, s: [[10, '10 A'], [16, '16 A'], [25, '25 A'], [32, '32 A']] }
    ],
    hesapla(d) {
      const U = d.faz === 3 ? 400 : 230, k = d.faz === 3 ? Math.sqrt(3) : 2;
      const dU = (k * d.l * d.i) / (56 * d.s);
      const yuzde = (100 * dU) / U;
      const durum = (sinir) => (yuzde <= sinir ? 'Uygun' : 'Aşıyor');
      const [sa, sm] = d.kaynak === 2 ? [6.5, 8] : [1.5, 3];
      const iz = (d.faz === 3 ? { 1.5: 15.5, 2.5: 21, 4: 28, 6: 36, 10: 50, 16: 68 } : { 1.5: 17.5, 2.5: 24, 4: 32, 6: 41, 10: 57, 16: 76 })[d.s];
      const adimlar = [`ΔU = ${d.faz === 3 ? '1,73' : '2'} × ${d.l} × ${d.i} ÷ (56 × ${sayi(d.s)}) ≈ ${sayi(dU, 2)} V`, `%e = 100 × ${sayi(dU, 2)} ÷ ${U} ≈ %${sayi(yuzde, 2)}`, `Yükteki gerilim ≈ ${sayi(U - dU, 1)} V`];
      if (d.i > iz) adimlar.push(`Uyarı: ${d.i} A, ${sayi(d.s)} mm² kablonun taşıma kapasitesini (boruda ≈ ${sayi(iz)} A) aşar.`);
      return {
        sonuclar: [['Gerilim düşümü', sayi(dU, 1) + ' V'], ['Yüzde', '%' + sayi(yuzde, 2)], [`Aydınlatma %${sayi(sa)}`, durum(sa)], [`Motor %${sayi(sm)}`, durum(sm)]],
        adimlar
      };
    },
    not: 'Bakır iletken, cos φ = 1 kabulü. Uzun hatlarda kesit seçimini bu hesaba göre büyüt.'
  },

  iz: {
    gruplar: [
      { k: 'd', ad: 'Döşeme', v: 1, s: [[1, 'B1 · boruda'], [2, 'C · duvarda'], [3, 'E · tavada']] },
      { k: 'f', ad: 'Sistem', v: 1, s: [[1, 'Tek faz'], [3, 'Üç faz']] },
      { k: 't', ad: 'Ortam sıcaklığı', v: 30, s: [[30, '30 °C'], [35, '35 °C'], [40, '40 °C'], [45, '45 °C']] },
      { k: 'g', ad: 'Aynı yerdeki devre sayısı', v: 1, s: [[1, '1'], [2, '2'], [3, '3'], [4, '4']] },
      { k: 'in', ad: 'Sigorta (In)', v: 16, s: [[10, '10 A'], [16, '16 A'], [20, '20 A'], [25, '25 A'], [32, '32 A'], [40, '40 A'], [63, '63 A']] }
    ],
    hesapla(d) {
      const kesit = [1.5, 2.5, 4, 6, 10, 16, 25];
      const tablo = {
        1: { 1: [17.5, 24, 32, 41, 57, 76, 101], 3: [15.5, 21, 28, 36, 50, 68, 89] },
        2: { 1: [19.5, 27, 36, 46, 63, 85, 112], 3: [17.5, 24, 32, 41, 57, 76, 96] },
        3: { 1: [22, 30, 40, 51, 70, 94, 119], 3: [18.5, 25, 34, 43, 60, 80, 101] }
      }[d.d][d.f];
      const kT = { 30: 1, 35: 0.94, 40: 0.87, 45: 0.79 }[d.t];
      const kG = (d.d === 3 ? { 1: 1, 2: 0.88, 3: 0.82, 4: 0.79 } : { 1: 1, 2: 0.8, 3: 0.7, 4: 0.65 })[d.g];
      const k = kT * kG, gerek = d.in / k;
      const i = tablo.findIndex((x) => x >= gerek);
      const adimlar = [`k = ${sayi(kT)} (sıcaklık) × ${sayi(kG)} (gruplama) = ${sayi(k)}`, `Gereken tablo değeri: ${d.in} ÷ ${sayi(k)} ≈ ${sayi(gerek, 1)} A`];
      if (i < 0) {
        adimlar.push('Tablodaki en büyük kesit (25 mm²) yetmiyor: daha büyük kesit ya da ayrı hatlar.');
        return { sonuclar: [['Düzeltme katsayısı', '× ' + sayi(k)], ['Gereken tablo Iz', '≥ ' + sayi(gerek, 1) + ' A'], ['En küçük kesit', '> 25 mm²'], ['Düzeltilmiş Iz', '—']], adimlar };
      }
      adimlar.push(`${sayi(kesit[i])} mm²: tabloda ${sayi(tablo[i])} A × ${sayi(k)} ≈ ${sayi(tablo[i] * k, 1)} A ≥ ${d.in} A`);
      return {
        sonuclar: [['Düzeltme katsayısı', '× ' + sayi(k)], ['Gereken tablo Iz', '≥ ' + sayi(gerek, 1) + ' A'], ['En küçük kesit', sayi(kesit[i]) + ' mm²'], ['Düzeltilmiş Iz', sayi(tablo[i] * k, 1) + ' A']],
        adimlar
      };
    },
    not: 'IEC 60364-5-52, bakır, PVC yalıtım. MCB içindir; buşon ve NH sigortada In yerine In ÷ 0,9 ile bak. Gerilim düşümünü ayrıca kontrol et.'
  },
});

/* PLC temelleri: hesaplayıcılar. */
Object.assign(HESAPLAR, {
  float: {
    gruplar: [
      { k: 'v', ad: 'REAL değer', v: 12.5, s: [[12.5, '12,5'], [100, '100'], [-1, '−1'], [3.14, '3,14']] },
      { k: 'o', ad: 'Cihazın gönderdiği sıra', v: 2, s: [[1, 'ABCD'], [2, 'CDAB'], [3, 'BADC'], [4, 'DCBA']] }
    ],
    hesapla(d) {
      const dv = new DataView(new ArrayBuffer(4));
      dv.setFloat32(0, d.v);
      const b = [0, 1, 2, 3].map((i) => dv.getUint8(i));
      const sira = { 1: [0, 1, 2, 3], 2: [2, 3, 0, 1], 3: [1, 0, 3, 2], 4: [3, 2, 1, 0] }[d.o];
      const ad = { 1: 'ABCD', 2: 'CDAB', 3: 'BADC', 4: 'DCBA' }[d.o];
      const giden = sira.map((i) => b[i]);
      const hex = (a) => a.map((x) => x.toString(16).toUpperCase().padStart(2, '0')).join('');
      const dv2 = new DataView(new ArrayBuffer(4));
      giden.forEach((x, i) => dv2.setUint8(i, x));
      const yanlis = dv2.getFloat32(0);
      const bicim = (x) => {
        if (!isFinite(x)) return 'geçersiz';
        const m = Math.abs(x), isaret = x < 0 ? '−' : '';
        if (m !== 0 && (m < 0.001 || m >= 1e7)) {
          const [k, u] = m.toExponential(2).split('e');
          const ust = u.replace('+', '').split('').map((c) => '⁰¹²³⁴⁵⁶⁷⁸⁹'[c] || '⁻').join('');
          return isaret + k.replace('.', ',') + ' × 10' + ust;
        }
        return isaret + sayi(m, 4);
      };
      return {
        sonuclar: [['IEEE 754 (hex)', '0x' + hex(b)], ['1. register', '0x' + hex(giden.slice(0, 2))], ['2. register', '0x' + hex(giden.slice(2))], ['ABCD okunursa', bicim(yanlis)]],
        adimlar: [`${bicim(d.v)} → 32 bit: A=${hex([b[0]])} B=${hex([b[1]])} C=${hex([b[2]])} D=${hex([b[3]])}`, `Cihaz ${ad} sırasıyla gönderir: ${hex(giden.slice(0, 2))} ${hex(giden.slice(2))}`, d.o === 1 ? 'Sıralar aynı: değer doğru okunur.' : `ABCD bekleyen taraf ${bicim(yanlis)} görür; ayarda word ya da byte sırasını (swap) değiştir.`]
      };
    },
    not: 'Modbus’ta 32 bitlik değer iki register’a bölünür; sıra üreticiye göre değişir. Değer saçma çıkıyorsa önce word swap (CDAB) dene.'

      o += _yazi(306, 11, `PV ${sayi(s.pv, 1)} · CV %${sayi(s.cv, 0)}`, { a: 'end', b: 10, w: 600 });
      if (s.boz) o += _yazi(x0 + 4, 11, 'bozucu etkin', { b: 9, w: 600, r: '--dc-plus' });
      const lej = (x, renk, t, k) => `<path d="M${x} 180H${x + 18}" style="stroke:var(${renk})" stroke-width="2.5"${k ? ' stroke-dasharray="6 4"' : ''}></path>` + _yazi(x + 22, 184, t, { b: 9 });
      o += lej(34, '--accent', 'SP hedef', true) + lej(120, '--signal', 'PV ölçülen') + lej(214, '--muted', 'CV çıkış');
      o += _yazi(306, 166, 'son 30 s', { a: 'end', b: 8, r: '--muted' });
      return o + '</svg>';
    }
  },
});

/* ---- kaynak/konular/09-plc-temelleri/modeller.js ---- */
/* PLC temelleri: 3B modeller. Ölçüler mm; z = 0 DIN ray yüzü (+z öne), y dikey, x genişlik.
   Genel bir kompakt PLC (DC/DC/DC: 24 V besleme, 24 V giriş, transistör çıkış); uç adları üreticiye göre değişir. */
(() => {
  const P = 5.08;   // klemens adımı
  /* Klemens düzeni: [bloğun sol kenarı x, uç adları]. Üst sıra: besleme ve girişler; alt sıra: sensör beslemesi ve çıkışlar. */
  const BESLEME = [-53, ['L+', 'M', 'PE']], GIRIS = [-35, ['1M', 'I0.0', 'I0.1', 'I0.2', 'I0.3', 'I0.4', 'I0.5', 'I0.6', 'I0.7']];
  const SENSOR = [-53, ['L+ çıkış', 'M çıkış']], CIKIS = [-40, ['3L+', '3M', 'Q0.0', 'Q0.1', 'Q0.2', 'Q0.3', 'Q0.4', 'Q0.5']];
  const ucX = ([x0], i) => x0 + (i + 0.5) * P;
  const bit = (b) => (b ? '1' : '0');
  const girisAciklama = (ad) => ({
    'I0.0': 'Dijital giriş, bit 0. Örnek programda start butonu (NO).',
    'I0.1': 'Dijital giriş, bit 1. Örnek programda stop butonu; NC bağlanır, basılı değilken giriş 1’dir. Kablo koparsa makine durur.'
  }[ad] || 'Dijital giriş, 24 V DC. Sensör ya da buton bağlanır.');
  const cikisAciklama = (ad) => (ad === 'Q0.0' ? 'Dijital çıkış, bit 0. Örnek programda motor kontaktörünü süren ara röle.' : 'Dijital çıkış (transistör), 24 V DC; tipik 0,5 A.');

  Object.assign(MODELLER, {
    'kompakt-plc': {
      aciklama: 'Kompakt PLC’nin 3B modeli: besleme, giriş, çıkış ve sensör beslemesi klemensleri, durum ve G/Ç LED’leri, Ethernet portu, genişleme bağlantısı, CPU ve güç kartları, DIN ray.',
      not: 'Bir klemense dokun: kamera yaklaşır, uç adları çıkar. Start ve Stop’a bas: giriş LED’leri hemen yanar, çıkış LED’i yalnızca RUN’da programın sonucuna göre yanar. Örnek, genel bir kompakt PLC’dir; adlar ve yerleşim üreticiye göre değişir.',
      etiketBaslik: 'Klemensler ve LED’ler',
      etiketler: [
        ['L+', 'CPU beslemesi +24 V DC. AC beslemeli modelde bu uçlar L1 ve N’dir; etiketi okumadan enerji verme.'],
        ['M', 'CPU beslemesi 0 V.'],
        ['PE', 'Topraklama ucu; panonun PE barasına bağlanır.'],
        ['1M', 'Giriş grubunun ortak ucu. PNP sensörde 0 V’a, NPN sensörde +24 V’a bağlanır.'],
        ...GIRIS[1].slice(1).map((ad) => [ad, girisAciklama(ad)]),
        ['L+ çıkış', 'Sensörler için 24 V DC çıkış. Akımı sınırlıdır; çok sensör varsa ayrı güç kaynağı kullan.'],
        ['M çıkış', 'Sensör beslemesinin 0 V’u.'],
        ['3L+', 'Çıkış grubunun beslemesi +24 V. Transistör çıkış bu gerilimi yüke verir.'],
        ['3M', 'Çıkış grubunun 0 V’u; yüklerin dönüşü buraya gelir.'],
        ...CIKIS[1].slice(2).map((ad) => [ad, cikisAciklama(ad)]),
        ['RUN/STOP', 'Çoğu PLC’de yeşil RUN, sarı STOP demektir.'],
        ['ERROR', 'Kırmızı yanıyorsa CPU hatadadır; tanı arabelleğine bak.'],
        ['MAINT', 'Bakım isteği (ör. hafıza kartı, zorlanmış değişken); PLC çalışmaya devam eder.']
      ],
      parcalar: [
        ['Besleme klemensi', 'CPU’nun beslemesi. DC modelde L+ ve M (24 V DC), AC modelde L1 ve N (230 V AC) yazar.'],
        ['Giriş klemensi', 'Buton ve sensörler buraya bağlanır. 1M ortak ucu PNP ya da NPN bağlantıyı belirler.'],
        ['Çıkış klemensi', 'Ara röle, lamba, valf gibi yükler buraya bağlanır. Transistör çıkış yalnızca DC ve düşük akım içindir; büyük yükte ara röle kullan.'],
        ['Sensör beslemesi', 'Az sayıda sensörü beslemek için 24 V çıkış. Çok sensör varsa ayrı güç kaynağı kullan.'],
        ['Durum LED’leri', 'RUN/STOP, ERROR ve MAINT. PLC’nin çalışma durumunu gösterir.'],
        ['G/Ç LED’leri', 'Her giriş ve çıkışın durumu. Arıza bulmada ilk bakılan yer: sinyal nerede kayboluyor?'],
        ['Ethernet portu', 'Programlama ve haberleşme (PROFINET, Modbus TCP gibi). Bilgisayarın IP adresi PLC ile aynı ağda olmalı.'],
        ['Ön kapak', 'Yalıtkan ön kapak ve etiket alanı.'],
        ['Gövde', 'Arka gövde. PLC’nin altında ve üstünde havalandırma için boşluk bırak.'],
        ['Genişleme bağlantısı', 'Sağ yandaki kapağın altında; ek giriş/çıkış ve haberleşme modülleri buradan bağlanır. Modülü enerji varken takma.'],
        ['CPU kartı', 'İşlemci, program hafızası ve saat. Programı tarama çevrimiyle sürekli çalıştırır: girişleri oku, programı işle, çıkışları yaz.'],
        ['Güç kartı', 'Beslemeyi iç gerilimlere çevirir. Giriş ve çıkış devreleri CPU’dan optokuplörle yalıtılır.'],
        ['DIN ray ve klips', 'TS35 raya takılır; klips tornavidayla aşağı çekilince çıkar.']
      ],
      kamera: { yon: [0.45, 0.35, 1], patlak: [1, 0.55, 0.85] },
      secimdeOdak: true,
      kesitler: [{ ad: 'yarım', planlar: [[-1, 0, 0, 0]] }],
      yeni: () => ({ run: true, giris: [false, true, false, false, false, false, false, false], q: [false, false, false, false, false, false], startT: 0, stopT: 0 }),
      dugmeler: (s) => [
        ['run', s.run ? 'STOP’a al' : 'RUN’a al', s.run],
        ['start', 'Start (I0.0)', s.startT > 0],
        ['stop', 'Stop (I0.1)', s.stopT > 0]
      ],
      olay(s, olay) {
        if (olay === 'run') s.run = !s.run;
        else if (olay === 'start') s.startT = 0.6;
        else if (olay === 'stop') s.stopT = 0.6;
      },
      /* Tarama çevrimi (sadeleştirilmiş): girişleri oku → Q0.0 = (I0.0 VEYA Q0.0) VE I0.1 → çıkışları yaz. */
      tik(s, dt) {
        const once = JSON.stringify([s.giris, s.q]);
        s.startT = Math.max(0, s.startT - dt);
        s.stopT = Math.max(0, s.stopT - dt);
        s.giris[0] = s.startT > 0;
        s.giris[1] = !(s.stopT > 0);   // NC stop: basılı değilken 1
        s.q[0] = s.run && (s.giris[0] || s.q[0]) && s.giris[1];
        return s.startT > 0 || s.stopT > 0 || JSON.stringify([s.giris, s.q]) !== once;
      },
      durum(s) {
        if (!s.run) return { metin: `STOP: program çalışmıyor, çıkışlar kapalı. Giriş LED’leri yine de girişi gösterir (I0.0 = ${bit(s.giris[0])}, I0.1 = ${bit(s.giris[1])}).` };
        return { metin: `RUN · I0.0 = ${bit(s.giris[0])}, I0.1 = ${bit(s.giris[1])} → Q0.0 = ${bit(s.q[0])}. Program: Q0.0 = (I0.0 VEYA Q0.0) VE I0.1 (mühürleme).` };
      },

      kur(y) {
        const T = y.T;
        const kok = new T.Group();
        const grup = (...n) => { const g = new T.Group(); n.forEach((x) => g.add(x)); return g; };
        const yer = (n, x, yy, z) => { n.position.set(x, yy, z); return n; };
        const kutu = (w, h, d, m, x, yy, z, sec) => yer(y.ag(new T.BoxGeometry(w, h, d), m, sec), x, yy, z);
        /* Birbirine değen parçalar arasında 0,05 mm boşluk vardır (kesitte z-fighting olmasın). */

        /* ---- gövde: içi boş kutu (arka levha + çevre bandı), ön kapak (ön levha + yükseltilmiş panel) ---- */
        const band = y.yuvarlakDikdortgen(110, 100, 4);
        band.holes.push(y.yuvarlakDikdortgen(106, 96, 2));
        const govde = grup(
          yer(y.ag(y.cek(y.yuvarlakDikdortgen(110, 100, 4), 2), 'plastik'), 0, 0, 2),
          yer(y.ag(y.cek(band, 53.95), 'plastik'), 0, 0, 30.025)
        );
        const onKapak = grup(
          yer(y.ag(y.cek(y.yuvarlakDikdortgen(110, 100, 4), 2), 'plastik'), 0, 0, 58.075),
          yer(y.ag(y.cek(y.yuvarlakDikdortgen(108, 52, 3), 14.9, { pah: 0.6 }), 'plastik'), 0, 0, 66.6),
          kutu(40, 26, 0.1, 'plastikAcik', 22, 0, 74.1, { kenar: false })   // etiket alanı
        );

        /* ---- klemensler: gövde, vida başları (önde), kablo girişleri (üstte ya da altta) ---- */
        const blok = ([x0, adlar], ust) => {
          const n = adlar.length, w = n * P, yc = ust ? 39 : -39, d = ust ? 1 : -1;
          const g = grup(kutu(w - 0.1, 16, 11.9, 'plastikAcik', x0 + w / 2, yc, 65.1));
          const vida = y.silindir(1.6, 1, 20), giris = new T.BoxGeometry(3.4, 0.1, 3.6);
          adlar.forEach((a, i) => {
            const x = x0 + (i + 0.5) * P;
            g.add(yer(y.ag(vida, 'celik', { esik: 60 }), x, yc - d * 3, 71.6), yer(y.ag(giris, 'entegre', { kenar: false }), x, yc + d * 8.05, 66));
          });
          return g;
        };
        const besleme = blok(BESLEME, true), giris = blok(GIRIS, true), sensor = blok(SENSOR, false), cikis = blok(CIKIS, false);

        /* ---- LED’ler (her biri kendi malzemesiyle; uygula renklendirir) ---- */
        const led = (w, h, x, yy) => kutu(w, h, 0.4, y.malzeme('ledYesil').clone(), x, yy, 74.3, { kenar: false });
        const durumLed = [led(5, 2.5, -46, 12), led(5, 2.5, -46, 6), led(5, 2.5, -46, 0)];
        const girisLed = GIRIS[1].slice(1).map((a, i) => led(2.4, 1.6, ucX(GIRIS, i + 1), 22));
        const cikisLed = CIKIS[1].slice(2).map((a, i) => led(2.4, 1.6, ucX(CIKIS, i + 2), -22));
        const durumLedleri = grup(...durumLed), gcLedleri = grup(...girisLed, ...cikisLed);
        const YESIL = new T.Color(0x39e86a), SONUK = new T.Color(0x1f3d29), SARI = new T.Color(0xf0b020), KIRMIZI_S = new T.Color(0x4a1f1f), SARI_S = new T.Color(0x4a3a14);

        /* ---- Ethernet portu (alt yüz), genişleme kapağı (sağ yan) ---- */
        const ethernet = grup(kutu(16, 0.1, 13, 'entegre', 35, -50.1, 30, { kenar: false }), kutu(12, 0.1, 3, 'celik', 35, -50.2, 24, { kenar: false }));
        const genisleme = grup(kutu(0.4, 34, 40, 'plastikAcik', 55.25, 0, 30));

        /* ---- iç kartlar ---- */
        const cpu = grup(kutu(100, 90, 1.6, 'kart', 0, 0, 42), kutu(14, 14, 1.5, 'entegre', -10, 8, 43.6), kutu(10, 6, 1.2, 'entegre', 12, 8, 43.45), kutu(8, 3, 2, 'celik', 12, -8, 43.85));
        const guc = grup(kutu(100, 90, 1.6, 'kart', 0, 0, 12), kutu(18, 14, 10, 'entegre', 25, -20, 17.85), yer(y.ag(y.silindir(5, 14, 28), 'kondansator'), -25, -20, 19.85), yer(y.ag(y.silindir(4, 11, 28), 'kondansator'), -12, -20, 18.35));
        for (let i = 0; i < 4; i++) guc.add(kutu(4.6, 6.4, 3, 'plastikAcik', -35 + i * 9, 25, 14.35));   // optokuplörler

        /* ---- DIN ray ve klips ---- */
        const ray = grup(yer(y.ag(y.dinRay(150), 'aluminyum'), -75, 0, -0.05), kutu(12, 6, 8, 'plastikAcik', 0, -53.05, 4.2));

        const parcalar = [
          { nesne: besleme, isaret: [-53, 47.1, 71.1], patlat: [0, 22, 18] },
          { nesne: giris, isaret: [10.7, 47.1, 71.1], patlat: [0, 22, 18] },
          { nesne: cikis, isaret: [0.6, -47.1, 71.1], patlat: [0, -22, 18] },
          { nesne: sensor, isaret: [-53, -47.1, 71.1], patlat: [0, -22, 18] },
          { nesne: durumLedleri, isaret: [-46, 17, 74.6], patlat: [0, 0, 48] },
          { nesne: gcLedleri, isaret: [10, 22, 74.6], patlat: [0, 0, 48] },
          { nesne: ethernet, isaret: [35, -50.3, 38], patlat: [0, -12, 0] },
          { nesne: onKapak, isaret: [40, 20, 74.2], patlat: [0, 0, 48] },
          { nesne: govde, isaret: [55.05, -30, 30], patlat: [0, 0, 0] },
          { nesne: genisleme, isaret: [55.5, 12, 45], patlat: [22, 0, 0] },
          { nesne: cpu, isaret: [-10, 8, 44.4], patlat: [0, 0, 30] },
          { nesne: guc, isaret: [25, -20, 22.9], patlat: [0, 0, 12] },
          { nesne: ray, isaret: [60, 16, 0.05], patlat: [0, 0, -16] }
        ];
        parcalar.forEach((p) => kok.add(p.nesne));

        /* Etiketler: klemens uçlarının dışında, sıra sıra yukarı-aşağı kaydırılmış (yan yana binmesin). */
        const etiketYerleri = [];
        const ekle = (tanim, nesne, parca, ust, bas = 0) => tanim[1].slice(bas).forEach((a, i) => {
          const j = i + bas, d = ust ? 1 : -1;
          etiketYerleri.push({ nesne, konum: [ucX(tanim, j), d * (49.5 + (j % 2) * 5), 66], parca });
        });
        ekle(BESLEME, besleme, 0, true);
        ekle(GIRIS, giris, 1, true);
        ekle(SENSOR, sensor, 3, false);
        ekle(CIKIS, cikis, 2, false);
        [12, 6, 0].forEach((yy) => etiketYerleri.push({ nesne: durumLedleri, konum: [-34, yy, 75], parca: 4 }));
        /* etiketler listesi sırası: besleme (3), giriş (9), sensör (2), çıkış (8), durum LED’leri (3) */

        return {
          kok,
          parcalar,
          etiketYerleri,
          uygula(s) {
            durumLed[0].material.color.copy(s.run ? YESIL : SARI);
            durumLed[1].material.color.copy(KIRMIZI_S);
            durumLed[2].material.color.copy(SARI_S);
            girisLed.forEach((l, i) => l.material.color.copy(s.giris[i] ? YESIL : SONUK));
            cikisLed.forEach((l, i) => l.material.color.copy(s.q[i] ? YESIL : SONUK));
          }
        };
      }
    }
  });
})();
