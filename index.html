<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Elektrik-elektronik konularında şemalı, hesaplı ve arıza odaklı bilgi notları.">
<meta name="theme-color" content="#F3F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141619" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PANO">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="pano-surum" content="202609270926">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>PANO Bilgi Notları</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F3F1EA; --card:#FFFDF8; --ink:#1B1E21; --ink-2:#3A3F44; --muted:#50565C;
  --line:#DAD5C8; --line-soft:#E4E0D5; --chip:#E9E5DA;
  --accent:#F2B01E; --on-accent:#1B1E21; --signal:#1D5FB8;
  --panel:#1B1E21; --panel-ink:#F3F1EA; --panel-muted:#C9C5BA; --panel-track:#3A3F44;
  --danger-bg:#F8E4DE; --danger-line:#E7B9AD; --danger-ink:#7F2414;
  --mark:#FBE3A6; --focus:#1D5FB8;
  --wire-l:#7A4A22; --wire-l2:#1B1E21; --wire-l3:#8A8F94; --wire-n:#1D5FB8; --wire-pe:#4E8A2A; --wire-pe2:#E0C21A; --dc-plus:#A8321F;
  --rail:#D3CEC1; --svg-body:#FFFFFF; --hatch:#8A8F94;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --nav-h:68px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#141619; --card:#1D2024; --ink:#ECE8DF; --ink-2:#C9C5BB; --muted:#A7A398;
    --line:#343940; --line-soft:#2A2E34; --chip:#2A2E34;
    --signal:#7AAAF2; --panel:#262A30; --panel-ink:#F3F1EA; --panel-muted:#C3BFB5; --panel-track:#454B52;
    --danger-bg:#3A201B; --danger-line:#6B3328; --danger-ink:#F2A996;
    --mark:#6B5410; --focus:#7AAAF2;
    --wire-l:#C58B55; --wire-l2:#646B73; --wire-l3:#B3B7BC; --wire-n:#7AAAF2; --wire-pe:#6DB043; --dc-plus:#E07A64;
    --rail:#3A3F45; --svg-body:#2A2E34; --hatch:#7D838A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#141619; --card:#1D2024; --ink:#ECE8DF; --ink-2:#C9C5BB; --muted:#A7A398;
  --line:#343940; --line-soft:#2A2E34; --chip:#2A2E34;
  --signal:#7AAAF2; --panel:#262A30; --panel-ink:#F3F1EA; --panel-muted:#C3BFB5; --panel-track:#454B52;
  --danger-bg:#3A201B; --danger-line:#6B3328; --danger-ink:#F2A996;
  --mark:#6B5410; --focus:#7AAAF2;
  --wire-l:#C58B55; --wire-l2:#646B73; --wire-l3:#B3B7BC; --wire-n:#7AAAF2; --wire-pe:#6DB043; --dc-plus:#E07A64;
  --rail:#3A3F45; --svg-body:#2A2E34; --hatch:#7D838A;
}

html{background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
a{color:var(--signal)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
h1,h2,h3{text-wrap:balance}
.mono{font-family:var(--f-mono)}
.ust{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.app{max-width:480px;margin:0 auto;padding-inline:20px;padding-block:16px calc(var(--nav-h) + 32px);display:flex;flex-direction:column;gap:20px;min-height:100%}

/* Marka */
.marka{display:flex;align-items:center;gap:12px;padding-top:8px}
.marka-plaka{width:12px;height:40px;border-radius:3px;background:var(--accent);flex-shrink:0}
.marka-ad{margin:0;font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;letter-spacing:.09em}
.marka-alt{font-size:13px;color:var(--muted);margin:4px 0 0}

/* Arama kutusu (ana sayfa) */
.arama-dugme{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--muted);font-size:15px;text-align:left;cursor:pointer;width:100%}
.arama-dugme svg{color:var(--ink);flex-shrink:0}

/* Koyu panel (kaldığın yer) */
.panel{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:16px;background:var(--panel);color:var(--panel-ink);border:0;text-align:left;cursor:pointer;width:100%}
.panel-ust{display:flex;justify-content:space-between;align-items:center;gap:12px}
.panel-etiket{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.panel-sayac{font-family:var(--f-mono);font-size:12px;color:var(--panel-muted);font-variant-numeric:tabular-nums}
.panel-baslik{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.panel-alt{font-size:13px;color:var(--panel-muted);margin-top:6px}
.ilerleme{display:grid;gap:4px}
.ilerleme span{height:4px;border-radius:2px;background:var(--panel-track)}
.ilerleme span.dolu{background:var(--accent)}

/* Bölüm başlıkları */
.satir-baslik{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.h2{margin:0;font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.1}

/* Konu kartları */
.konu-izgara{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.konu-kart{display:flex;flex-direction:column;gap:8px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left;cursor:pointer;min-height:168px}
.konu-kart:hover{border-color:var(--ink)}
.konu-kart-ust{display:flex;justify-content:space-between;align-items:flex-start;color:var(--ink)}
.konu-kart-ad{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.1}
.konu-kart-ozet{font-size:13px;line-height:1.35;color:var(--muted)}
.konu-kart-durum{margin-top:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Üst çubuk (alt ekranlar) */
.ust-cubuk{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);margin-inline:-20px;padding:8px 20px 10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid transparent}
.ust-cubuk.golgeli{border-bottom-color:var(--line)}
.ust-satir{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.geri{display:flex;align-items:center;gap:4px;height:44px;padding:0 12px 0 4px;margin-left:-4px;border:0;background:none;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;color:var(--ink)}
.ikon-dugme{width:44px;height:44px;flex-shrink:0;border:1px solid var(--line);border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.ikon-dugme[aria-pressed="true"] .yerimi{fill:var(--accent)}

/* Çipler */
.cipler{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding-inline:20px;padding-bottom:2px}
.cipler::-webkit-scrollbar{display:none}
.cip{flex-shrink:0;height:36px;padding:0 13px;display:flex;align-items:center;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--ink)}
.cip[aria-pressed="true"],.cip.etkin{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.cip-kutu{display:flex;flex-wrap:wrap;gap:8px}
.parca{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:13px;cursor:pointer;color:var(--ink);text-align:left}
.parca:hover{border-color:var(--ink)}

/* Başlık bloğu */
.baslik-blok{display:flex;flex-direction:column;gap:10px}
.h1{margin:0;font-family:var(--f-display);font-size:38px;font-weight:700;line-height:1.02}
.giris{margin:0;font-size:15px;line-height:1.55;color:var(--ink-2)}
.etiketler{display:flex;flex-wrap:wrap;gap:6px}
.etiket{padding:4px 10px;border-radius:6px;background:var(--chip);font-family:var(--f-mono);font-size:12px;color:var(--ink)}

/* Liste satırları */
.liste{display:flex;flex-direction:column;gap:8px}
.satir{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left;width:100%;color:var(--ink)}
button.satir{cursor:pointer}
button.satir:hover{border-color:var(--ink)}
.kod{width:52px;height:52px;flex-shrink:0;border-radius:10px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--ink);text-align:center;line-height:1.1;padding:2px}
.kod.hazir{background:var(--accent);color:var(--on-accent)}
.satir-metin{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.satir-ad{font-size:16px;font-weight:600;line-height:1.3}
.satir-alt{font-size:13px;line-height:1.4;color:var(--muted)}
.rozet{flex-shrink:0;padding:3px 8px;border-radius:6px;border:1px dashed var(--line);font-family:var(--f-mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.satir .ok{flex-shrink:0;color:var(--ink)}

/* Bilgi sayfası bölümleri */
.bolumler{display:flex;flex-direction:column;gap:40px;padding-top:8px}
.konu-no{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.gizli{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.blok-grup{display:flex;flex-direction:column;gap:12px}
.bolum{display:flex;flex-direction:column;gap:14px;scroll-margin-top:120px}
.bolum-baslik{display:flex;align-items:baseline;gap:10px}
.bolum-no{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.bolum-ad{margin:0;font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1}
.kart{padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card);display:flex;flex-direction:column;gap:12px}
.sema{display:block;width:100%;height:auto}
.sema text{font-family:var(--f-mono)}
.lejant{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.lejant span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:18px;height:3px;border-radius:2px}
.sw-l{background:var(--wire-l)} .sw-l2{background:var(--wire-l2)} .sw-l3{background:var(--wire-l3)} .sw-acc{background:var(--accent);height:8px} .sw-opt2{background:repeating-linear-gradient(90deg,var(--ink) 0 5px,transparent 5px 9px)} .sw-kacak{background:repeating-linear-gradient(90deg,var(--dc-plus) 0 4px,transparent 4px 7px)} .sw-n{background:var(--wire-n)} .sw-sig{background:var(--signal)} .sw-dc{background:var(--dc-plus)} .sw-ink{background:var(--ink)}
.sw-pe{background:repeating-linear-gradient(90deg,var(--wire-pe) 0 6px,var(--wire-pe2) 6px 12px)}
.sw-opt{background:repeating-linear-gradient(90deg,var(--signal) 0 5px,transparent 5px 9px)}

.isaretler{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.isaretler li{display:flex;gap:12px}
.isaret-no{width:24px;height:24px;flex-shrink:0;border-radius:12px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:12px;font-weight:600}
.isaret-ad{font-size:15px;font-weight:600;display:block}
.isaret-metin{display:block;font-size:14px;line-height:1.5;color:var(--ink-2)}
.not{margin:0;padding:12px 14px;border-radius:12px;background:var(--chip);font-size:13px;line-height:1.5;color:var(--ink)}

.ikili{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini-kart{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.mini-kart svg{color:var(--ink)}
.mini-ad{font-size:15px;font-weight:600;line-height:1.3}
.mini-etiket{align-self:flex-start;padding:2px 8px;border-radius:6px;background:var(--chip);font-family:var(--f-mono);font-size:11px}
.mini-metin{font-size:13px;line-height:1.5;color:var(--ink-2)}

.aralik-alt{font-family:var(--f-mono);font-size:11px;color:var(--muted);align-self:flex-end}
.aralik-liste{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line-soft)}
.aralik-liste div{display:flex;gap:10px}
.aralik-kod{width:70px;flex-shrink:0;font-family:var(--f-mono);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.kucuk{margin:0;font-size:12px;line-height:1.5;color:var(--muted)}

.formul{padding:14px;border-radius:12px;background:var(--panel);color:var(--panel-ink);text-align:center;font-family:var(--f-mono);font-size:24px;font-weight:600;letter-spacing:.04em}
.tanimlar{display:flex;flex-direction:column;gap:8px}
.tanim{display:flex;gap:10px;font-size:13px;line-height:1.5;color:var(--ink-2)}
.tanim b{width:30px;flex-shrink:0;font-family:var(--f-mono);font-weight:600;color:var(--ink)}
.ornek{padding:14px;border-radius:12px;background:var(--paper);display:flex;flex-direction:column;gap:10px}
.ornek-satir{font-size:14px;line-height:1.5}
.ornek-satir b{font-family:var(--f-mono);font-weight:600}
.kural{margin:0;font-size:14px;font-weight:600;line-height:1.5}

.tablo{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.tablo-satir{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line-soft)}
.tablo-satir:last-child{border-bottom:0}
.tablo-etiket{width:92px;flex-shrink:0;font-family:var(--f-mono);font-size:13px;font-weight:600}
.tablo-etiket.sig{color:var(--signal)} .tablo-etiket.dc{color:var(--dc-plus)}
.tablo-metin{font-size:13px;line-height:1.5}

.ariza{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.ariza-ust{padding:14px 16px;background:var(--panel);color:var(--panel-ink);display:flex;flex-direction:column;gap:4px}
.ariza-ust .panel-etiket{font-size:11px}
.ariza-belirti{font-size:17px;font-weight:600}
.ariza-satir{padding:12px 16px;border-bottom:1px solid var(--line-soft);display:flex;flex-direction:column;gap:4px}
.ariza-satir:last-child{border-bottom:0}
.ariza-ad{font-size:14px;font-weight:600}
.ariza-metin{font-size:13px;line-height:1.5;color:var(--ink-2)}

.hata{padding:14px 16px;border:1px solid var(--danger-line);border-radius:14px;background:var(--danger-bg);display:flex;gap:12px}
.hata svg{flex-shrink:0;margin-top:1px;color:var(--danger-ink)}
.hata-ad{font-size:15px;font-weight:600;color:var(--danger-ink);display:block;margin-bottom:4px}
.hata-metin{font-size:13px;line-height:1.5;color:var(--ink)}

/* Renk kodu ve adımlar */
.renk-izgara{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.renk{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:center}
.renk-nokta{width:24px;height:24px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.28),0 0 0 1px var(--line)}
.renk-akim{font-family:var(--f-mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.renk-ad{font-size:12px;color:var(--muted);line-height:1.2}
.sira-liste{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.sira-liste li{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line-soft);font-size:14px;line-height:1.5}
.sira-liste li:last-child{border-bottom:0}
.sira-no{width:22px;flex-shrink:0;font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}

/* Hesaplayıcı */
.hesap-grup{border:0;margin:0;padding:0;min-width:0}
.hesap-grup legend{font-size:13px;font-weight:600;padding:0;margin-bottom:8px}
.secenekler{display:flex;gap:6px}
.secenek{flex:1 1 0;min-width:0;height:44px;padding:0 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-family:var(--f-mono);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.secenek[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.sonuc{padding:14px;border-radius:14px;background:var(--panel);color:var(--panel-ink);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.sonuc div{display:flex;flex-direction:column;gap:2px;min-width:0}
.sonuc-ad{font-size:12px;color:var(--panel-muted)}
.sonuc-deger{font-family:var(--f-mono);font-size:18px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.adimlar{display:flex;flex-direction:column;gap:6px;font-family:var(--f-mono);font-size:13px;line-height:1.4;font-variant-numeric:tabular-nums}

/* Sonraki */
.sonraki{padding:16px;border-radius:14px;background:var(--panel);color:var(--panel-ink);display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;width:100%;text-align:left}
button.sonraki{cursor:pointer}
.sonraki-ad{font-size:16px;font-weight:600}
.sonraki .rozet{border-color:var(--panel-track);color:var(--panel-muted)}

/* Arama ekranı */
.arama-satir{display:flex;align-items:center;gap:10px}
.arama-alan{flex-grow:1;display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border:2px solid var(--ink);border-radius:12px;background:var(--card)}
.arama-alan input{flex-grow:1;min-width:0;height:100%;border:0;outline:none;background:transparent;font:inherit;font-size:16px;color:var(--ink)}
.arama-alan input::placeholder{color:var(--muted)}
.metin-dugme{height:44px;padding:0 4px;border:0;background:none;color:var(--signal);font-size:15px;font-weight:500;cursor:pointer}
.sonuc-kart{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left;width:100%;color:var(--ink)}
button.sonuc-kart{cursor:pointer}
button.sonuc-kart:hover{border-color:var(--ink)}
.sonuc-yol{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.bulgu-ad{font-size:16px;font-weight:600}
.sonuc-parca{font-size:13px;line-height:1.5;color:var(--ink-2)}
mark{background:var(--mark);color:var(--ink);padding:0 2px;border-radius:3px}
.bos{padding:28px 20px;border:1px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5;display:flex;flex-direction:column;align-items:center;gap:10px}
.bos svg{color:var(--muted)}

/* Alt menü */
.alt-menu{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px))}
.alt-menu-ic{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.menu-oge{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;border:0;background:none;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer}
.menu-ikon{width:60px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.menu-oge[aria-current="page"]{color:var(--ink);font-weight:600}
.menu-oge[aria-current="page"] .menu-ikon{background:var(--accent);color:var(--on-accent)}
.sayi{font-family:var(--f-mono);font-size:10px;margin-left:2px}

.bildirim{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;padding:10px 16px;border-radius:12px;background:var(--panel);color:var(--panel-ink);font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .2s}
.bildirim.acik{opacity:1}

@media (prefers-reduced-motion: reduce){
  *{scroll-behavior:auto!important;transition:none!important}
}

const _no = (x, y, n) => `<circle cx="${x}" cy="${y}" r="10" style="fill:var(--ink)"></circle><text x="${x}" y="${y + 4}" text-anchor="middle" font-size="11" font-weight="600" style="fill:var(--paper)">${n}</text>`;
const _cizgi = (d) => `<path d="${d}" style="stroke:var(--ink)" stroke-width="1" stroke-dasharray="2 2" fill="none"></path>`;
const _yazi = (x, y, t, o = {}) => `<text x="${x}" y="${y}" font-size="${o.b || 11}"${o.a ? ` text-anchor="${o.a}"` : ''}${o.w ? ` font-weight="${o.w}"` : ''} style="fill:var(${o.r || '--ink'})">${t}</text>`;
const _kutu = (x, y, w, h, o = {}) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx == null ? 6 : o.rx}" style="fill:var(${o.f || '--svg-body'});stroke:var(--ink)" stroke-width="${o.sw || 1.5}"></rect>`;
const _tel = (d, renk, o = {}) => `<path d="${d}" style="stroke:var(${renk})" stroke-width="${o.w || 3}"${o.k ? ` stroke-dasharray="${o.k}"` : ''} stroke-linejoin="round" fill="none"></path>`;
const _pe = (d) => _tel(d, '--wire-pe') + _tel(d, '--wire-pe2', { k: '6 6' });
const _okSag = (x, y) => `<path d="M${x - 7} ${y - 4}L${x} ${y}L${x - 7} ${y + 4}Z" style="fill:var(--ink)"></path>`;
const _okYukari = (x, y) => `<path d="M${x - 4} ${y + 7}L${x} ${y}L${x + 4} ${y + 7}Z" style="fill:var(--ink)"></path>`;

  servoEnkoder: (() => {
    const cx = 70, cy = 88;
    let yarik = '';
    for (let i = 0; i < 24; i++) {
      const a = (i * Math.PI) / 12, c = Math.cos(a), s = Math.sin(a);
      yarik += `M${(cx + 38 * c).toFixed(1)} ${(cy + 38 * s).toFixed(1)}L${(cx + 48 * c).toFixed(1)} ${(cy + 48 * s).toFixed(1)}`;
    }
    const kare = (y0, ilk) => {
      const hi = y0 - 11, lo = y0 + 11;
      let d = `M150 ${lo}`, x = ilk, yuksek = false;
      while (x <= 280) { d += `H${x}V${yuksek ? lo : hi}`; yuksek = !yuksek; x += 20; }
      return d + 'H290';
    };
    return `<svg class="sema" viewBox="0 0 318 184" role="img" aria-label="Artımsal enkoder diski ve A, B, Z kanal sinyalleri">
      <circle cx="${cx}" cy="${cy}" r="52" style="fill:var(--card);stroke:var(--ink)" stroke-width="1.5"></circle>
      <path d="${yarik}" style="stroke:var(--ink)" stroke-width="3" fill="none"></path>
      <path d="M${cx} ${cy - 32}V${cy - 24}" style="stroke:var(--dc-plus)" stroke-width="4" fill="none"></path>
      <circle cx="${cx}" cy="${cy}" r="11" style="fill:var(--ink)"></circle>
      ${_yazi(142, 44, 'A', { a: 'end', w: 600, r: '--signal' })}
      ${_yazi(142, 92, 'B', { a: 'end', w: 600 })}
      ${_yazi(142, 140, 'Z', { a: 'end', w: 600, r: '--dc-plus' })}
      ${_tel(kare(40, 160), '--signal', { w: 2 })}
      ${_tel(kare(88, 170), '--ink', { w: 2 })}
      ${_tel('M150 147H200V125H210V147H290', '--dc-plus', { w: 2 })}
      ${_yazi(220, 172, 'A önde → ileri yön', { a: 'middle', b: 10, r: '--muted' })}
      ${_cizgi(`M${cx} 141V150`)}
      ${_no(cx, 160, 1)}${_no(306, 64, 2)}${_no(306, 136, 3)}
    </svg>`;
  })(),

  /* ---------- Hesaplayıcılar ----------
     Yeni hesaplayıcı: buraya bir kayıt ekle, bilgi sayfasında { tip: 'hesap', tur: '<ad>' } kullan. */
  const HESAPLAR = {
    step: {
      gruplar: [
        { k: 'ms', ad: 'Mikroadım', v: 8, s: [[1, 'Tam'], [2, '1/2'], [4, '1/4'], [8, '1/8'], [16, '1/16']] },
        { k: 'hatve', ad: 'Vida hatvesi', v: 5, s: [[4, '4 mm'], [5, '5 mm'], [8, '8 mm'], [10, '10 mm']] },

      ],

        const ppr = 200 * d.ms, ppmm = ppr / d.hatve, hz = ppmm * d.hiz, rpm = (d.hiz / d.hatve) * 60;
        return {
          sonuclar: [['Darbe / tur', sayi(ppr)], ['Darbe / mm', sayi(ppmm)], ['Darbe frekansı', sayi(hz) + ' Hz'], ['Motor hızı', sayi(rpm) + ' d/dk']],
          adimlar: [`200 × ${d.ms} = ${sayi(ppr)} darbe/tur`, `${sayi(ppr)} ÷ ${d.hatve} = ${sayi(ppmm)} darbe/mm`, `${sayi(ppmm)} × ${d.hiz} = ${sayi(hz)} Hz`]
        };
      },
      not: '1,8° motor: 360 ÷ 1,8 = 200 tam adım/tur. PLC darbe çıkışının frekans sınırını kataloğundan kontrol et; motor torku yüksek devirde düşer.'
    },
    enkoder: {
      gruplar: [
        { k: 'c', ad: 'Enkoder', v: 131072, s: [[10000, '2500 ppr'], [131072, '17 bit'], [8388608, '23 bit']] },
        { k: 'hatve', ad: 'Vida hatvesi', v: 10, s: [[5, '5 mm'], [10, '10 mm'], [20, '20 mm']] }
      ],
      hesapla(d) {
        const um = (d.hatve * 1000) / d.c;
        const yol = um >= 1 ? sayi(um, 2) + ' µm' : sayi(um * 1000, 1) + ' nm';
        const aci = (360 * 3600) / d.c;
        const ad = d.c === 10000 ? '2500 ppr × 4' : d.c === 131072 ? '2¹⁷' : '2²³';
        return {
          sonuclar: [['Sayım / tur', sayi(d.c)], ['Sayım başına yol', yol], ['Sayım başına açı', sayi(aci, 2) + '″'], ['1 mm için sayım', sayi(d.c / d.hatve, 0)]],
          adimlar: [`${ad} = ${sayi(d.c)} sayım/tur`, `${d.hatve} mm ÷ ${sayi(d.c)} = ${yol}`, `360° ÷ ${sayi(d.c)} = ${sayi(aci, 2)} yay saniyesi`]
        };
      },
      not: 'Mekanik doğruluk (vida hatası, boşluk) çoğu zaman enkoder çözünürlüğünden büyüktür; çözünürlük tek başına hassasiyet demek değildir.'
    },
    reduktor: {
      gruplar: [
        { k: 'p', ad: 'Servo motor (3000 d/dk)', v: 750, s: [[400, '400 W'], [750, '750 W'], [1000, '1 kW']] },
        { k: 'i', ad: 'Redüktör oranı', v: 10, s: [[3, '3:1'], [5, '5:1'], [10, '10:1'], [20, '20:1']] }
      ],
      hesapla(d) {
        const T = d.p / ((2 * Math.PI * 3000) / 60);
        const Tc = T * d.i * 0.95;
        const n = 3000 / d.i;
        return {
          sonuclar: [['Motor anma torku', sayi(T, 2) + ' N·m'], ['Çıkış torku', '≈ ' + sayi(Tc, 1) + ' N·m'], ['Çıkış hızı', sayi(n, 0) + ' d/dk'], ['Yansıyan atalet', '÷ ' + sayi(d.i * d.i)]],
          adimlar: [`T = ${sayi(d.p)} W ÷ (2π × 3000 ÷ 60) ≈ ${sayi(T, 2)} N·m`, `${sayi(T, 2)} × ${d.i} × 0,95 ≈ ${sayi(Tc, 1)} N·m`, `3000 ÷ ${d.i} = ${sayi(n, 0)} d/dk`, `Yük ataleti motora ${d.i}² = ${sayi(d.i * d.i)} kat küçük yansır`]
        };
      },
      not: 'Verim tek kademeli planet redüktör için yaklaşık %95 alındı. Çıkış torku redüktör kataloğundaki sınırı aşmamalı.'
    },
    disli: {
      gruplar: [
        { k: 'dt', ad: 'Tur başına darbe', v: 10000, s: [[1000, '1.000'], [10000, '10.000'], [100000, '100.000']] },
        { k: 'hatve', ad: 'Vida hatvesi', v: 10, s: [[5, '5 mm'], [10, '10 mm'], [20, '20 mm']] },
        { k: 'hiz', ad: 'İlerleme hızı', v: 100, s: [[50, '50 mm/s'], [100, '100 mm/s'], [500, '500 mm/s']] }
      ],
      hesapla(d) {
        const um = (d.hatve * 1000) / d.dt;
        const f = (d.dt / d.hatve) * d.hiz;
        const rpm = (d.hiz / d.hatve) * 60;
        return {
          sonuclar: [['Darbe başına yol', sayi(um, 2) + ' µm'], ['1 mm için darbe', sayi(d.dt / d.hatve, 0)], ['Darbe frekansı', sayi(f, 0) + ' Hz'], ['Motor hızı', sayi(rpm, 0) + ' d/dk']],

        };

      not: 'Elektronik dişli, PLC’nin gönderdiği darbeleri enkoder sayımına ölçekler. Darbe başına yolu büyütmek aynı hız için gereken frekansı düşürür.'
    },
    vfd: {
      gruplar: [
        { k: 'f', ad: 'Çıkış frekansı', v: 50, s: [[10, '10 Hz'], [25, '25 Hz'], [50, '50 Hz'], [75, '75 Hz']] },
        { k: 'p', ad: 'Motor kutup sayısı', v: 4, s: [[2, '2 kutup'], [4, '4 kutup'], [6, '6 kutup']] }
      ],
      hesapla(d) {
        const ns = (120 * d.f) / d.p;
        const n = Math.round((ns * 0.96) / 5) * 5;
        const V = d.f <= 50 ? (400 * d.f) / 50 : 400;
        return {
          sonuclar: [['Senkron hız', sayi(ns, 0) + ' d/dk'], ['Yaklaşık mil hızı', '≈ ' + sayi(n, 0) + ' d/dk'], ['Çıkış gerilimi', sayi(V, 0) + ' V'], ['Bölge', d.f <= 50 ? 'Sabit tork' : 'Sabit güç']],
          adimlar: [`n = 120 × ${d.f} ÷ ${d.p} = ${sayi(ns, 0)} d/dk`, `%4 kayma ile ≈ ${sayi(n, 0)} d/dk`, d.f <= 50 ? `V/f: 400 × ${d.f} ÷ 50 = ${sayi(V, 0)} V` : '50 Hz üstünde gerilim 400 V’ta kalır; tork düşer']
        };

      not: '400 V / 50 Hz asenkron motor için. Kayma motora ve yüke göre değişir; etiketteki devir 50 Hz tam yükteki değerdir.'

  /* ---------- Dizinler ---------- */
  const KONU = {};
  const ALT = {};
  VERI.konular.forEach((k, ki) => {
    k.no = String(ki + 1).padStart(2, '0');
    KONU[k.id] = k;
    k.altlar.forEach((a, ai) => {
      a.no = String(ai + 1).padStart(2, '0');
      a.konu = k;
      a.sira = ai;
      ALT[a.id] = a;
    });
  });
  const sayfaOf = (a) => (a && a.sayfa ? VERI.sayfalar[a.sayfa] : null);
  const hazirMi = (a) => !!sayfaOf(a);
  const hazirlar = () => VERI.konular.flatMap((k) => k.altlar.filter(hazirMi));

  /* ---------- Tarayıcı deposu (yalnızca bu cihaz) ---------- */
  const DEPO = {
    oku(k, v) { try { const x = localStorage.getItem('pano.' + k); return x == null ? v : JSON.parse(x); } catch (e) { return v; } },
    yaz(k, v) { try { localStorage.setItem('pano.' + k, JSON.stringify(v)); } catch (e) { /* depo kapalı olabilir */ } }
  };
  const durum = {
    kayitli: DEPO.oku('kayitli', []),
    son: DEPO.oku('son', null),
    ilerleme: DEPO.oku('ilerleme', {}),
    aramalar: DEPO.oku('aramalar', []),
    hesaplar: DEPO.oku('hesaplar', {}),
    filtre: {},
    sorgu: ''
  };
  if (!Array.isArray(durum.kayitli)) durum.kayitli = [];
  if (!Array.isArray(durum.aramalar)) durum.aramalar = [];
  if (!durum.ilerleme || typeof durum.ilerleme !== 'object') durum.ilerleme = {};
  if (!durum.hesaplar || typeof durum.hesaplar !== 'object') durum.hesaplar = {};

  /* ---------- Arama dizini ---------- */
  const KATLA = { 'ı': 'i', 'ş': 's', 'ğ': 'g', 'ü': 'u', 'ö': 'o', 'ç': 'c', 'â': 'a', 'î': 'i', 'û': 'u' };
  function katla(s) {
    s = String(s);
    let o = '';
    for (let i = 0; i < s.length; i++) {
      let l = s[i].toLocaleLowerCase('tr-TR');
      if (l.length !== 1) l = l[0];
      o += KATLA[l] || l;
    }
    return o;
  }
  function blokMetni(b) {
    const p = [];
    const ekle = (...x) => x.forEach((y) => { if (y) p.push(Array.isArray(y) ? y.join(' ') : y); });
    switch (b.tip) {
      case 'sema': (b.lejant || []).forEach((l) => ekle(l[1])); (b.isaretler || []).forEach((i) => ekle(i)); ekle(b.not); break;
      case 'kartlar': b.kartlar.forEach((k) => ekle(k.baslik, k.etiket, k.metin)); break;
      case 'aralik': ekle(b.baslik, b.eksen); b.satirlar.forEach((r) => ekle(r.ad + ' ' + r.bas + '–' + r.son, r.metin)); ekle(b.not); break;
      case 'formul': ekle(b.formul); b.tanimlar.forEach((t) => ekle(t)); if (b.ornek) { ekle(b.ornek.baslik); b.ornek.satirlar.forEach((t) => ekle(t)); } ekle(b.kural); break;
      case 'tablo': b.satirlar.forEach((r) => ekle(r[0], r[2])); break;
      case 'hesap': if (HESAPLAR[b.tur]) { ekle(HESAPLAR[b.tur].gruplar.map((g) => g.ad).join(', ')); ekle(HESAPLAR[b.tur].not); } break;
      case 'ariza': ekle('Belirti: ' + b.belirti); b.satirlar.forEach((r) => ekle(r)); break;
      case 'hatalar': b.hatalar.forEach((r) => ekle(r)); break;
      case 'parcalar': ekle(b.parcalar.join(', ')); break;
      case 'not': ekle(b.metin); break;
      case 'renkler': b.satirlar.forEach((r) => ekle(r[0] + ' ' + r[2])); break;
      case 'adimlar': b.satirlar.forEach((m) => ekle(m)); break;
    }
    return p.join(' · ');
  }
  const DIZIN = [];
  VERI.konular.forEach((k) => k.altlar.forEach((a) => {
    const s = sayfaOf(a);
    if (!s) {
      const m = a.ad + ' · ' + a.alt;
      DIZIN.push({ alt: a, bolum: null, bolumAd: null, metin: m, katli: katla(m) });
      return;
    }
    const bm = [s.baslik, a.alt, s.giris].concat(s.etiketler || []).join(' · ');
    DIZIN.push({ alt: a, bolum: null, bolumAd: null, metin: bm, katli: katla(bm) });
    s.bolumler.forEach((b) => {
      const m = [b.baslik].concat(b.bloklar.map(blokMetni)).join(' · ');
      DIZIN.push({ alt: a, bolum: b.id, bolumAd: b.kisa, metin: m, katli: katla(m) });
    });
  }));
  const TUM_PARCALAR = Array.from(new Set(Object.values(VERI.sayfalar).flatMap((s) => s.bolumler.flatMap((b) => b.bloklar.filter((x) => x.tip === 'parcalar').flatMap((x) => x.parcalar)))));
  const aramaTerimi = (p) => p.replace(/\s*\(.*\)\s*$/, '');

  function ara(q) {
    const terimler = katla(q.trim()).split(/\s+/).filter((t) => t.length > 0);
    if (!terimler.length || katla(q.trim()).length < 2) return { terimler, sonuclar: [] };
    const gorulen = new Map();
    DIZIN.forEach((d) => {
      if (!terimler.every((t) => d.katli.includes(t))) return;
      const var_ = gorulen.get(d.alt.id);
      if (!var_) gorulen.set(d.alt.id, d);
    });
    const sonuclar = Array.from(gorulen.values()).sort((x, y) => (hazirMi(y.alt) ? 1 : 0) - (hazirMi(x.alt) ? 1 : 0));
    return { terimler, sonuclar };
  }
  function vurgula(metin, terimler) {
    const k = katla(metin);
    const araliklar = [];
    terimler.forEach((t) => {
      if (!t) return;
      let i = k.indexOf(t);
      while (i !== -1) { araliklar.push([i, i + t.length]); i = k.indexOf(t, i + t.length); }
    });
    if (!araliklar.length) return esc(metin);
    araliklar.sort((a, b) => a[0] - b[0]);
    const birlesik = [araliklar[0].slice()];
    araliklar.slice(1).forEach((r) => { const s = birlesik[birlesik.length - 1]; if (r[0] <= s[1]) s[1] = Math.max(s[1], r[1]); else birlesik.push(r.slice()); });
    let o = '', son = 0;
    birlesik.forEach(([a, b]) => { o += esc(metin.slice(son, a)) + '<mark>' + esc(metin.slice(a, b)) + '</mark>'; son = b; });
    return o + esc(metin.slice(son));
  }
  function kesit(metin, terim) {
    const i = katla(metin).indexOf(terim);
    if (i < 0 || metin.length <= 140) return metin;
    let bas = Math.max(0, i - 45);
    if (bas > 0) { const b = metin.indexOf(' ', bas); if (b !== -1 && b < i) bas = b + 1; }
    let bit = Math.min(metin.length, i + 110);
    if (bit < metin.length) { const b = metin.lastIndexOf(' ', bit); if (b > i) bit = b; }
    return (bas > 0 ? '…' : '') + metin.slice(bas, bit) + (bit < metin.length ? '…' : '');
  }

  /* ---------- Yönlendirme ---------- */
  let rota = null;
  let onceki = 'ana';
  let bekleyenBolum = null;
  let ilkCizim = true;
  function rotaCoz(t) {
    t = String(t || '').replace(/^#/, '');
    if (!t || t === 'ana') return 'ana';
    if (t === 'ara' || t === 'kaydedilenler') return t;
    if (KONU[t]) return t;
    if (ALT[t] && hazirMi(ALT[t])) return t;
    return 'ana';
  }
  function git(hedef, bolum) {
    const t = rotaCoz(hedef);
    bekleyenBolum = bolum || null;
    let hashDegisti = false;
    try {
      if (location.hash.replace(/^#/, '') !== t) { location.hash = t; hashDegisti = true; }
    } catch (e) { hashDegisti = false; }
    if (!hashDegisti) ciz(t);
    else setTimeout(() => { if (rota !== t) ciz(t); }, 80);
  }
  window.addEventListener('hashchange', () => {
    let t = 'ana';
    try { t = rotaCoz(location.hash); } catch (e) { /* yok say */ }
    if (t !== rota) ciz(t);
  });

  function ciz(t, secenek) {
    const koru = secenek && secenek.koru;
    if (rota && rota !== t) onceki = rota;
    rota = t;
    const app = $('#uygulama');
    const y = window.scrollY;
    let html;
    if (t === 'ara') html = aramaEkrani();
    else if (t === 'kaydedilenler') html = kayitEkrani();
    else if (KONU[t]) html = konuEkrani(KONU[t]);
    else if (ALT[t]) html = bilgiSayfasi(ALT[t]);
    else html = anaSayfa();
    app.innerHTML = html;
    menuGuncelle();
    aktifBolum = null;
    if (ALT[t]) sayfaAcildi(ALT[t]);
    if (koru) {
      window.scrollTo(0, y);
    } else if (bekleyenBolum && ALT[t]) {
      const hedef = bekleyenBolum;
      requestAnimationFrame(() => bolumeGit(hedef, false));
    } else {
      window.scrollTo(0, 0);
    }
    bekleyenBolum = null;
    if (!koru && !ilkCizim) {
      if (t === 'ara') { const g = $('#arama-kutusu'); if (g) g.focus({ preventScroll: true }); }
      else { const h = app.querySelector('h1'); if (h) h.focus({ preventScroll: true }); }
    }
    ilkCizim = false;
    kaydirmaIzle();
  }

  function menuGuncelle() {
    const aktif = rota === 'ara' ? 'ara' : rota === 'kaydedilenler' ? 'kaydedilenler' : 'konular';
    $$('[data-menu]').forEach((b) => {
      if (b.dataset.menu === aktif) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
  }

  /* ---------- Ekranlar ---------- */
  function anaSayfa() {
    return `
      <header class="marka">
        <span class="marka-plaka" aria-hidden="true"></span>
        <div><h1 class="marka-ad" tabindex="-1">PANO</h1><p class="marka-alt">Elektrik-elektronik bilgi notları</p></div>
      </header>
      <button type="button" class="arama-dugme" data-git="ara">${IKON.ara}<span>Konu, parça veya terim ara</span></button>
      ${devamKarti()}
      <section class="blok-grup" aria-labelledby="konular-baslik">
        <div class="satir-baslik"><h2 class="h2" id="konular-baslik">Konular</h2><span class="ust">${VERI.konular.length} konu</span></div>
        <div class="konu-izgara">${VERI.konular.map(konuKarti).join('')}</div>
      </section>`;
  }

  function devamKarti() {
    let a = durum.son && ALT[durum.son.sayfa];
    let devam = !!(a && hazirMi(a));
    if (!devam) a = hazirlar()[0];
    if (!a) return '';
    const s = sayfaOf(a);
    const toplam = s.bolumler.length;
    let bi = 0;
    if (devam) bi = Math.max(0, s.bolumler.findIndex((b) => b.id === durum.son.bolum));
    const okunan = devam ? Math.min(toplam, Math.max(bi, Number(durum.ilerleme[a.id]) || 0) + 1) : 0;
    const alt = devam ? `${a.konu.ad} · ${s.bolumler[bi].kisa} bölümünden devam et` : `${a.konu.ad} · ${toplam} bölüm`;
    const seg = s.bolumler.map((b, i) => `<span class="${i < okunan ? 'dolu' : ''}"></span>`).join('');
    return `
      <button type="button" class="panel" data-git="${a.id}"${devam ? ` data-hedef-bolum="${s.bolumler[bi].id}"` : ''}>
        <span class="panel-ust"><span class="panel-etiket">${devam ? 'Kaldığın yer' : 'Buradan başla'}</span><span class="panel-sayac">${okunan} / ${toplam} bölüm</span></span>
        <span><span class="panel-baslik" style="display:block">${esc(s.baslik)}</span><span class="panel-alt" style="display:block">${esc(alt)}</span></span>
        <span class="ilerleme" style="grid-template-columns:repeat(${toplam},minmax(0,1fr))" aria-hidden="true">${seg}</span>
      </button>`;
  }

  function konuKarti(k) {
    const hazir = k.altlar.filter(hazirMi).length;
    return `
      <button type="button" class="konu-kart" data-git="${k.id}">
        <span class="konu-kart-ust">${IKON[k.ikon] || ''}<span class="konu-no">${k.no}</span></span>
        <span class="konu-kart-ad">${esc(k.ad)}</span>
        <span class="konu-kart-ozet">${esc(k.ozet)}</span>
        <span class="konu-kart-durum">${hazir} / ${k.altlar.length} hazır</span>
      </button>`;
  }

  function altSatiri(a, yolGoster) {
    const h = hazirMi(a);
    const ic = `<span class="kod${h ? ' hazir' : ''}">${esc(a.kod)}</span>
      <span class="satir-metin">${yolGoster ? `<span class="sonuc-yol">${esc(a.konu.ad)}</span>` : ''}<span class="satir-ad">${esc(a.ad)}</span><span class="satir-alt">${esc(a.alt)}</span></span>`;
    return h
      ? `<button type="button" class="satir" data-git="${a.id}">${ic}<span class="ok">${IKON.ok}</span></button>`
      : `<div class="satir">${ic}<span class="rozet">Hazırlanıyor</span></div>`;
  }

  function konuEkrani(k) {
    const f = durum.filtre[k.id] || 'tumu';
    const altlar = k.altlar.filter((a) => f === 'tumu' || a.filtre === f);
    const filtreler = k.filtreler
      ? `<div class="cipler" role="group" aria-label="Filtre">${[{ id: 'tumu', ad: 'Tümü' }].concat(k.filtreler).map((x) =>
          `<button type="button" class="cip" data-filtre="${x.id}" data-konu="${k.id}" aria-pressed="${x.id === f}">${esc(x.ad)}</button>`).join('')}</div>`
      : '';
    return `
      <div class="ust-cubuk" id="ust-cubuk">
        <div class="ust-satir"><button type="button" class="geri" data-git="ana">${IKON.geri}<span>Konular</span></button><span class="ust">Konu ${k.no}</span></div>
      </div>
      <div class="baslik-blok"><h1 class="h1" tabindex="-1">${esc(k.ad)}</h1><p class="giris">${esc(k.giris)}</p></div>
      ${filtreler}
      <div class="liste">
        <span class="ust">${altlar.length} alt başlık · ${altlar.filter(hazirMi).length} hazır</span>
        ${altlar.map((a) => altSatiri(a, false)).join('')}
      </div>`;
  }

  function bilgiSayfasi(a) {
    const s = sayfaOf(a);
    const kayitli = durum.kayitli.includes(a.id);
    return `
      <div class="ust-cubuk" id="ust-cubuk">
        <div class="ust-satir">
          <button type="button" class="geri" data-git="${a.konu.id}">${IKON.geri}<span>${esc(a.konu.ad)}</span></button>
          <button type="button" class="ikon-dugme" data-kaydet="${a.id}" aria-pressed="${kayitli}" aria-label="${kayitli ? 'Kayıtlardan çıkar' : 'Kaydet'}">${IKON.yerimi}</button>
        </div>
        <nav class="cipler" id="bolum-cipleri" aria-label="Sayfa bölümleri">
          ${s.bolumler.map((b) => `<button type="button" class="cip" data-bolum-kaydir="${b.id}">${esc(b.kisa)}</button>`).join('')}
        </nav>
      </div>
      <div class="baslik-blok">
        <span class="ust">${esc(a.konu.ad)} › ${a.no}</span>
        <h1 class="h1" tabindex="-1">${esc(s.baslik)}</h1>
        <p class="giris">${esc(s.giris)}</p>
        ${s.etiketler ? `<div class="etiketler">${s.etiketler.map((e) => `<span class="etiket">${esc(e)}</span>`).join('')}</div>` : ''}
      </div>
      <div class="bolumler">
        ${s.bolumler.map((b, i) => `
          <section class="bolum" id="b-${b.id}" data-bolum="${b.id}" aria-labelledby="h-${b.id}">
            <div class="bolum-baslik"><span class="bolum-no">${String(i + 1).padStart(2, '0')}</span><h2 class="bolum-ad" id="h-${b.id}">${esc(b.baslik)}</h2></div>
            ${b.bloklar.map(blok).join('')}
          </section>`).join('')}
        ${sonrakiKart(a)}
      </div>`;
  }

  function sonrakiKart(a) {
    const n = a.konu.altlar[a.sira + 1];
    if (!n) {
      return `<button type="button" class="sonraki" data-git="${a.konu.id}"><span><span class="panel-etiket" style="display:block">Konu sonu</span><span class="sonraki-ad">${esc(a.konu.ad)} listesine dön</span></span>${IKON.ok}</button>`;
    }
    if (hazirMi(n)) {
      return `<button type="button" class="sonraki" data-git="${n.id}"><span><span class="panel-etiket" style="display:block">Sonraki</span><span class="sonraki-ad">${esc(n.ad)}</span></span>${IKON.ok}</button>`;
    }
    return `<div class="sonraki"><span><span class="panel-etiket" style="display:block">Sonraki</span><span class="sonraki-ad">${esc(n.ad)}</span></span><span class="rozet">Hazırlanıyor</span></div>`;
  }

  /* ---------- Bloklar ---------- */
  function blok(b) {
    switch (b.tip) {
      case 'sema': return semaBlok(b);
      case 'kartlar': return `<div class="ikili">${b.kartlar.map((k) => `
        <div class="mini-kart">${IKON[k.ikon] || ''}<span class="mini-ad">${esc(k.baslik)}</span>${k.etiket ? `<span class="mini-etiket">${esc(k.etiket)}</span>` : ''}<span class="mini-metin">${esc(k.metin)}</span></div>`).join('')}</div>`;
      case 'aralik': return aralikBlok(b);
      case 'formul': return formulBlok(b);
      case 'tablo': return `<div class="tablo">${b.satirlar.map((r) => `<div class="tablo-satir"><span class="tablo-etiket ${esc(r[1] || '')}">${esc(r[0])}</span><span class="tablo-metin">${esc(r[2])}</span></div>`).join('')}</div>`;
      case 'hesap': return hesapBlok(b.tur);
      case 'ariza': return `
        <div class="ariza">
          <div class="ariza-ust"><span class="panel-etiket">Belirti</span><span class="ariza-belirti">${esc(b.belirti)}</span></div>
          ${b.satirlar.map((r) => `<div class="ariza-satir"><span class="ariza-ad">${esc(r[0])}</span><span class="ariza-metin">${esc(r[1])}</span></div>`).join('')}
        </div>`;
      case 'hatalar': return b.hatalar.map((h) => `
        <div class="hata">${IKON.uyari}<div><span class="hata-ad">${esc(h[0])}</span><span class="hata-metin">${esc(h[1])}</span></div></div>`).join('');
      case 'parcalar': return `<div class="cip-kutu">${b.parcalar.map((p) => `<button type="button" class="parca" data-ara-terim="${esc(aramaTerimi(p))}">${esc(p)}</button>`).join('')}</div>
        <p class="kucuk">Bir parçaya dokununca geçtiği tüm notları gösterir.</p>`;
      case 'not': return `<p class="not">${esc(b.metin)}</p>`;
      case 'renkler': return `<div class="renk-izgara">${b.satirlar.map((r) => `<div class="renk"><span class="renk-nokta" style="background:${esc(r[1])}" aria-hidden="true"></span><span class="renk-akim">${esc(r[0])}</span><span class="renk-ad">${esc(r[2])}</span></div>`).join('')}</div>`;
      case 'adimlar': return `<ol class="sira-liste">${b.satirlar.map((m, i) => `<li><span class="sira-no">${i + 1}</span><span>${esc(m)}</span></li>`).join('')}</ol>`;
      default: return '';
    }
  }

  function semaBlok(b) {
    const lejant = b.lejant ? `<div class="lejant">${b.lejant.map(([s, ad]) => `<span><i class="sw sw-${esc(s)}" aria-hidden="true"></i>${esc(ad)}</span>`).join('')}</div>` : '';
    const isaret = b.isaretler ? `<ol class="isaretler">${b.isaretler.map(([ad, m], i) => `
      <li><span class="isaret-no" aria-hidden="true">${i + 1}</span><div><span class="isaret-ad"><span class="gizli">${i + 1}. </span>${esc(ad)}</span><span class="isaret-metin">${esc(m)}</span></div></li>`).join('')}</ol>` : '';
    return `<div class="kart">${SEMALAR[b.svg] || ''}${lejant}</div>${isaret}${b.not ? `<p class="not">${esc(b.not)}</p>` : ''}`;
  }

  function aralikBlok(b) {
    const W = 318, x0 = 36, x1 = 306, ust = 14, ara_ = 36;
    const eksenY = ust + b.satirlar.length * ara_ - 4;
    const H = eksenY + 28;
    const sx = (v) => +(x0 + ((x1 - x0) * v) / b.max).toFixed(2);
    let izgara = '';
    for (let v = b.adim; v <= b.max; v += b.adim) izgara += `M${sx(v)} 4V${eksenY}`;
    let ticks = '';
    for (let v = 0; v <= b.max; v += b.adim) ticks += `<text x="${Math.min(sx(v), W - 12)}" y="${eksenY + 20}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${v}</text>`;
    const satirlar = b.satirlar.map((r, i) => {
      const y = ust + i * ara_;
      return `<text x="14" y="${y + 13}" text-anchor="middle" font-size="13" font-weight="600" style="fill:var(--ink)">${esc(r.ad)}</text>
        <rect x="${sx(r.bas)}" y="${y}" width="${sx(r.son) - sx(r.bas)}" height="16" rx="4" style="fill:var(--signal)"><title>${esc(r.ad)}: ${r.bas}–${r.son} × In</title></rect>`;
    }).join('');
    const aciklama = b.satirlar.map((r) => `${r.ad}: ${r.bas}–${r.son}`).join(', ');
    return `
      <div class="kart">
        <span style="font-size:13px;font-weight:600">${esc(b.baslik)}</span>
        <svg class="sema" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(b.baslik)}. ${esc(aciklama)}">
          <path d="${izgara}" style="stroke:var(--line)" stroke-width="1" stroke-dasharray="3 3" fill="none"></path>
          <path d="M${x0} 4V${eksenY}" style="stroke:var(--muted)" stroke-width="1" fill="none"></path>
          ${satirlar}${ticks}
        </svg>
        <span class="aralik-alt">${esc(b.eksen)}</span>
        <div class="aralik-liste">${b.satirlar.map((r) => `<div><span class="aralik-kod">${esc(r.ad)} ${r.bas}–${r.son}×</span><span class="mini-metin">${esc(r.metin)}</span></div>`).join('')}</div>
        ${b.not ? `<p class="kucuk">${esc(b.not)}</p>` : ''}
      </div>`;
  }

  function formulBlok(b) {
    return `
      <div class="kart" style="gap:14px">
        <div class="formul">${esc(b.formul)}</div>
        <div class="tanimlar">${(b.tanimlar || []).map((t) => `<div class="tanim"><b>${esc(t[0])}</b><span>${esc(t[1])}</span></div>`).join('')}</div>
        ${b.ornek ? `<div class="ornek"><span class="ust" style="font-size:11px">${esc(b.ornek.baslik)}</span>${b.ornek.satirlar.map((t) => `<div class="ornek-satir"><b>${esc(t[0])}</b> ${esc(t[1])}</div>`).join('')}</div>` : ''}
        ${b.kural ? `<p class="kural">${esc(b.kural)}</p>` : ''}
      </div>`;
  }

  /* ---------- Hesaplayıcı görünümü ---------- */
  function hesapDurum(tur) {
    const h = HESAPLAR[tur];
    const kayit = (durum.hesaplar[tur] = durum.hesaplar[tur] && typeof durum.hesaplar[tur] === 'object' ? durum.hesaplar[tur] : {});
    h.gruplar.forEach((g) => { if (!g.s.some(([v]) => v === kayit[g.k])) kayit[g.k] = g.v; });
    return kayit;
  }
  function hesapBlok(tur) {
    const h = HESAPLAR[tur];
    if (!h) return '';
    const d = hesapDurum(tur);
    const r = h.hesapla(d);
    const grup = (g) => `
      <fieldset class="hesap-grup"><legend>${esc(g.ad)}</legend>
        <div class="secenekler">${g.s.map(([v, l]) => `<button type="button" class="secenek" data-hesap-tur="${tur}" data-hesap="${g.k}" data-deger="${v}" aria-pressed="${d[g.k] === v}">${esc(l)}</button>`).join('')}</div>
      </fieldset>`;
    return `
      <div class="kart" style="gap:16px" data-hesap-kutu="${tur}">
        ${h.gruplar.map(grup).join('')}
        <div class="sonuc" aria-live="polite">${r.sonuclar.map((s, i) => `<div><span class="sonuc-ad">${esc(s[0])}</span><span class="sonuc-deger" id="h-${tur}-s${i}">${esc(s[1])}</span></div>`).join('')}</div>
        <div class="adimlar">${r.adimlar.map((a, i) => `<span id="h-${tur}-a${i}">${esc(a)}</span>`).join('')}</div>
        ${h.not ? `<p class="kucuk">${esc(h.not)}</p>` : ''}
      </div>`;
  }
  function hesapYaz(tur) {
    const h = HESAPLAR[tur];
    if (!h) return;
    const r = h.hesapla(hesapDurum(tur));
    r.sonuclar.forEach((s, i) => { const e = document.getElementById(`h-${tur}-s${i}`); if (e) e.textContent = s[1]; });
    r.adimlar.forEach((a, i) => { const e = document.getElementById(`h-${tur}-a${i}`); if (e) e.textContent = a; });
  }

  /* ---------- Arama ekranı ---------- */
  function aramaEkrani() {
    const vazgec = onceki && onceki !== 'ara' ? onceki : 'ana';
    return `
      <div class="ust-cubuk" id="ust-cubuk">
        <div class="arama-satir">
          <label class="arama-alan" for="arama-kutusu">${IKON.ara}<span class="gizli">Konu, parça veya terim ara</span>
            <input id="arama-kutusu" type="search" autocomplete="off" enterkeyhint="search" placeholder="Konu, parça veya terim ara" value="${esc(durum.sorgu)}">
          </label>
          <button type="button" class="metin-dugme" data-git="${vazgec}">Vazgeç</button>
        </div>
      </div>
      <h1 class="gizli" tabindex="-1">Arama</h1>
      <div id="arama-sonuc" class="blok-grup" style="gap:20px">${aramaSonuclari()}</div>`;
  }
  function aramaSonuclari() {
    const q = durum.sorgu.trim();
    if (katla(q).length < 2) {
      const son = durum.aramalar.length ? durum.aramalar : ['C eğrisi', 'PUL', 'Mikroadım', 'Kaplin', 'gG'];
      return `
        <div class="blok-grup" style="gap:10px"><span class="ust">${durum.aramalar.length ? 'Son aramalar' : 'Örnek aramalar'}</span>
          <div class="cip-kutu">${son.map((t) => `<button type="button" class="parca" data-ara-terim="${esc(t)}">${esc(t)}</button>`).join('')}</div></div>
        <div class="blok-grup" style="gap:10px"><span class="ust">Parçalar ve terimler</span>
          <div class="cip-kutu">${TUM_PARCALAR.map((p) => `<button type="button" class="parca" data-ara-terim="${esc(aramaTerimi(p))}">${esc(p)}</button>`).join('')}</div></div>`;
    }
    const { terimler, sonuclar } = ara(q);
    if (!sonuclar.length) {
      return `<div class="bos">${IKON.ara}<span>“${esc(q)}” için sonuç yok. Daha kısa bir terim ya da parça adı dene.</span></div>`;
    }
    return `
      <span class="ust" aria-live="polite">“${esc(q)}” için ${sonuclar.length} sonuç</span>
      <div class="liste">${sonuclar.map((d) => {
        const a = d.alt;
        const h = hazirMi(a);
        const baslik = h ? sayfaOf(a).baslik : a.ad;
        const yol = a.konu.ad + (d.bolumAd ? ' › ' + d.bolumAd : '');
        const parca = vurgula(kesit(d.metin, terimler[0]), terimler);
        const ic = `<span class="sonuc-yol">${esc(yol)}</span><span class="bulgu-ad">${vurgula(baslik, terimler)}</span><span class="sonuc-parca">${parca}</span>`;
        return h
          ? `<button type="button" class="sonuc-kart" data-git="${a.id}"${d.bolum ? ` data-hedef-bolum="${d.bolum}"` : ''}>${ic}</button>`
          : `<div class="sonuc-kart">${ic}<span class="rozet" style="align-self:flex-start">Hazırlanıyor</span></div>`;
      }).join('')}</div>`;
  }
  function aramaKaydet(q) {
    q = q.trim();
    if (katla(q).length < 2) return;
    durum.aramalar = [q].concat(durum.aramalar.filter((x) => katla(x) !== katla(q))).slice(0, 6);
    DEPO.yaz('aramalar', durum.aramalar);
  }
  function sonucYenile() {
    const k = $('#arama-sonuc');
    if (k) k.innerHTML = aramaSonuclari();
  }

  /* ---------- Kaydedilenler ---------- */
  function kayitEkrani() {
    const liste = durum.kayitli.map((id) => ALT[id]).filter((a) => a && hazirMi(a));
    return `
      <div class="baslik-blok" style="padding-top:8px">
        <h1 class="h1" tabindex="-1">Kaydedilenler</h1>
        <p class="giris">Bilgi sayfalarındaki yer imi düğmesiyle kaydettiğin notlar burada. Kayıtlar bu cihazda, bu tarayıcıda tutulur.</p>
      </div>
      ${liste.length
        ? `<div class="liste">${liste.map((a) => altSatiri(a, true)).join('')}</div>`
        : `<div class="bos">${IKON.yerimiBuyuk}<span>Henüz kaydettiğin bir not yok.</span><button type="button" class="cip" data-git="ana">Konulara göz at</button></div>`}`;
  }

  /* ---------- Bölüm takibi ---------- */
  let aktifBolum = null;
  let kareBekliyor = false;
  function sayfaAcildi(a) {
    const s = sayfaOf(a);
    const bolum = bekleyenBolum && s.bolumler.some((b) => b.id === bekleyenBolum) ? bekleyenBolum : s.bolumler[0].id;
    durum.son = { sayfa: a.id, bolum };
    DEPO.yaz('son', durum.son);
  }
  function bolumeGit(id, yumusak) {
    const sec = document.getElementById('b-' + id);
    if (!sec) return;
    const cubuk = $('#ust-cubuk');
    const h = cubuk ? cubuk.offsetHeight : 0;
    const top = sec.getBoundingClientRect().top + window.scrollY - h - 12;
    window.scrollTo({ top: Math.max(0, top), behavior: yumusak && !azHareket() ? 'smooth' : 'auto' });
  }
  function kaydirmaIzle() {
    const cubuk = $('#ust-cubuk');
    if (cubuk) cubuk.classList.toggle('golgeli', window.scrollY > 4);
    if (!ALT[rota]) return;
    const secs = $$('.bolum');
    if (!secs.length) return;
    const alt = cubuk ? cubuk.getBoundingClientRect().bottom : 0;
    let idx = 0;
    secs.forEach((s, i) => { if (s.getBoundingClientRect().top <= alt + 48) idx = i; });
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 8) idx = secs.length - 1;
    const id = secs[idx].dataset.bolum;
    if (id === aktifBolum) return;
    aktifBolum = id;
    const satir = $('#bolum-cipleri');
    if (satir) {
      $$('.cip', satir).forEach((c) => c.classList.toggle('etkin', c.dataset.bolumKaydir === id));
      const c = $(`[data-bolum-kaydir="${id}"]`, satir);
      if (c) {
        const hedef = c.offsetLeft - satir.offsetLeft - 40;
        try { satir.scrollTo({ left: Math.max(0, hedef), behavior: azHareket() ? 'auto' : 'smooth' }); } catch (e) { satir.scrollLeft = Math.max(0, hedef); }
      }
    }
    durum.son = { sayfa: rota, bolum: id };
    DEPO.yaz('son', durum.son);
    if (idx > (Number(durum.ilerleme[rota]) || 0)) {
      durum.ilerleme[rota] = idx;
      DEPO.yaz('ilerleme', durum.ilerleme);
    }
  }
  window.addEventListener('scroll', () => {
    if (kareBekliyor) return;
    kareBekliyor = true;
    requestAnimationFrame(() => { kareBekliyor = false; kaydirmaIzle(); });
  }, { passive: true });

  /* ---------- Bildirim ---------- */
  let bildirimZamani = null;
  function bildir(m) {
    const b = $('#bildirim');
    b.textContent = m;
    b.classList.add('acik');
    clearTimeout(bildirimZamani);
    bildirimZamani = setTimeout(() => b.classList.remove('acik'), 1800);
  }

  /* ---------- Olaylar ---------- */
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-kaydet],[data-bolum-kaydir],[data-filtre],[data-hesap],[data-ara-terim],[data-git]');
    if (!el) return;
    const d = el.dataset;
    if (d.kaydet) {
      const i = durum.kayitli.indexOf(d.kaydet);
      if (i >= 0) durum.kayitli.splice(i, 1); else durum.kayitli.unshift(d.kaydet);
      DEPO.yaz('kayitli', durum.kayitli);
      const acik = i < 0;
      el.setAttribute('aria-pressed', String(acik));
      el.setAttribute('aria-label', acik ? 'Kayıtlardan çıkar' : 'Kaydet');
      bildir(acik ? 'Kaydedildi' : 'Kayıtlardan çıkarıldı');
    } else if (d.bolumKaydir) {
      bolumeGit(d.bolumKaydir, true);
    } else if (d.filtre) {
      durum.filtre[d.konu] = d.filtre;
      ciz(rota, { koru: true });
      const b = $(`[data-filtre="${d.filtre}"]`);
      if (b) b.focus({ preventScroll: true });
    } else if (d.hesap) {
      const tur = d.hesapTur;
      if (!HESAPLAR[tur]) return;
      hesapDurum(tur)[d.hesap] = Number(d.deger);
      DEPO.yaz('hesaplar', durum.hesaplar);
      $$(`[data-hesap-tur="${tur}"][data-hesap="${d.hesap}"]`).forEach((b) => b.setAttribute('aria-pressed', String(b === el)));
      hesapYaz(tur);
    } else if (d.araTerim) {
      durum.sorgu = d.araTerim;
      aramaKaydet(d.araTerim);
      if (rota === 'ara') {
        const g = $('#arama-kutusu');
        if (g) g.value = durum.sorgu;
        sonucYenile();
        window.scrollTo(0, 0);
      } else {
        git('ara');
      }
    } else if (d.git) {
      if (rota === 'ara' && el.closest('#arama-sonuc')) aramaKaydet(durum.sorgu);
      git(d.git, d.hedefBolum);
    }
  });
  document.addEventListener('input', (e) => {
    if (e.target && e.target.id === 'arama-kutusu') {
      durum.sorgu = e.target.value;
      sonucYenile();
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.id === 'arama-kutusu' && e.key === 'Enter') {
      aramaKaydet(e.target.value);
      e.target.blur();
    }
  });

  /* ---------- Başlat ---------- */
  let ilk = 'ana';
  try { ilk = rotaCoz(location.hash); } catch (e) { /* yok say */ }
  ciz(ilk);
})();

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
}
</script>
