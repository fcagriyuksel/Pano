          <div class="bolum-baslik"><span class="bolum-no">${String(i + 1).padStart(2, '0')}</span><h2 class="bolum-ad" id="h-${b.id}">${esc(b.baslik)}</h2></div>
          ${b.bloklar.map(blok).join('')}
        </section>`).join('')}
      ${sonrakiKart(a)}
    </div>`;
}

function sonrakiKart(a) {
  const n = a.konu.altlar[a.sira + 1];
  if (!n) {
    return `<button type="button" class="sonraki" data-git="${a.konu.id}"><span><span class="panel-etiket" style="display:block">Konu Sonu</span><span class="sonraki-ad">${esc(a.konu.ad)} Listesine Dön</span></span>${IKON.ok}</button>`;
  }
  if (hazirMi(n)) {
    return `<button type="button" class="sonraki" data-git="${n.id}"><span><span class="panel-etiket" style="display:block">Sonraki</span><span class="sonraki-ad">${esc(n.ad)}</span></span>${kilitli(n) ? `<span class="rozet" style="color:var(--accent);border-color:var(--accent)">Premium</span>` : IKON.ok}</button>`;
  }
  return `<div class="sonraki"><span><span class="panel-etiket" style="display:block">Sonraki</span><span class="sonraki-ad">${esc(n.ad)}</span></span><span class="rozet">Hazırlanıyor</span></div>`;
}

/* ---- kaynak/uygulama/81-bloklar.js ---- */
/* ---------- Bloklar ---------- */
function blok(b) {
  switch (b.tip) {
    case 'sema': return semaBlok(b);
    case 'kartlar': return `<div class="ikili">${b.kartlar.map((k) => `
      <div class="mini-kart">${IKON[k.ikon] || ''}<span class="mini-ad">${esc(k.baslik)}</span>${k.etiket ? `<span class="mini-etiket">${esc(k.etiket)}</span>` : ''}<span class="mini-metin">${esc(k.metin)}</span></div>`).join('')}</div>`;
    case 'aralik': return aralikBlok(b);
    case 'formul': return formulBlok(b);
    case 'tablo': return `<div class="tablo">${b.satirlar.map((r) => `<div class="tablo-satir"><span class="tablo-etiket ${esc(r[1] || '')}">${esc(r[0])}</span><span class="tablo-metin">${esc(r[2])}</span></div>`).join('')}</div>`;
    case 'hesap': return hesapBlok(b.tur);
    case 'sim': return simBlok(b.tur);
    case 'model': return modelBlok(b.tur);
    case 'ariza': return `
      <div class="ariza">
        <div class="ariza-ust"><span class="panel-etiket">Belirti</span><span class="ariza-belirti">${esc(b.belirti)}</span></div>
        ${b.satirlar.map((r) => `<div class="ariza-satir"><span class="ariza-ad">${esc(r[0])}</span><span class="ariza-metin">${esc(r[1])}</span></div>`).join('')}
      </div>`;
    case 'hatalar': return b.hatalar.map((h) => `
      <div class="hata">${IKON.uyari}<div><span class="hata-ad">${esc(h[0])}</span><span class="hata-metin">${esc(h[1])}</span></div></div>`).join('');
    case 'parcalar': return `<div class="cip-kutu">${b.parcalar.map((p) => `<button type="button" class="parca" data-ara-terim="${esc(aramaTerimi(p))}">${esc(p)}</button>`).join('')}</div>
      <p class="kucuk">Bir parçaya dokununca geçtiği tüm notları gösterir.</p>`;
    case 'not': return `<p class="not">${esc(b.metin)}</p>`;
    case 'renkler': return `<div class="renk-izgara">${b.satirlar.map((r) => `<div class="renk"><span class="renk-nokta" style="background:${esc(r[1])}" aria-hidden="true"></span><span class="renk-akim">${esc(r[0])}</span><span class="renk-ad">${esc(r[2])}</span></div>`).join('')}</div>`;
    case 'adimlar': return `<ol class="sira-liste">${b.satirlar.map((m, i) => `<li><span class="sira-no">${i + 1}</span><span>${esc(m)}</span></li>`).join('')}</ol>`;
    default: return '';
  }
}

function semaBlok(b) {
  const lejant = b.lejant ? `<div class="lejant">${b.lejant.map(([s, ad]) => `<span><i class="sw sw-${esc(s)}" aria-hidden="true"></i>${esc(ad)}</span>`).join('')}</div>` : '';
  const isaret = b.isaretler ? `<ol class="isaretler">${b.isaretler.map(([ad, m], i) => `
    <li><span class="isaret-no" aria-hidden="true">${i + 1}</span><div><span class="isaret-ad"><span class="gizli">${i + 1}. </span>${esc(ad)}</span><span class="isaret-metin">${esc(m)}</span></div></li>`).join('')}</ol>` : '';
  return `<div class="kart">${SEMALAR[b.svg] || ''}${lejant}</div>${isaret}${b.not ? `<p class="not">${esc(b.not)}</p>` : ''}`;
}

function aralikBlok(b) {
  const enUzun = Math.max(...b.satirlar.map((r) => r.ad.length));
  const W = 318, x0 = enUzun > 1 ? 14 + enUzun * 9 : 36, x1 = 306, ust = 14, ara_ = 36;
  const eksenY = ust + b.satirlar.length * ara_ - 4;
  const H = eksenY + 28;
  const sx = (v) => +(x0 + ((x1 - x0) * v) / b.max).toFixed(2);
  let izgara = '';
  for (let v = b.adim; v <= b.max; v += b.adim) izgara += `M${sx(v)} 4V${eksenY}`;
  let ticks = '';
  for (let v = 0; v <= b.max; v += b.adim) ticks += `<text x="${Math.min(sx(v), W - 12)}" y="${eksenY + 20}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${sayi(v)}</text>`;
  const satirlar = b.satirlar.map((r, i) => {
    const y = ust + i * ara_;
    const etiket = enUzun > 1 ? `x="6"` : `x="14" text-anchor="middle"`;
    return `<text ${etiket} y="${y + 13}" font-size="13" font-weight="600" style="fill:var(--ink)">${esc(r.ad)}</text>
      <rect x="${sx(r.bas)}" y="${y}" width="${sx(r.son) - sx(r.bas)}" height="16" rx="4" style="fill:var(--signal)"><title>${esc(r.ad)}: ${sayi(r.bas)}–${sayi(r.son)} × In</title></rect>`;
  }).join('');
  const aciklama = b.satirlar.map((r) => `${r.ad}: ${sayi(r.bas)}–${sayi(r.son)}`).join(', ');
  return `
    <div class="kart">
      <span style="font-size:13px;font-weight:600">${esc(b.baslik)}</span>
      <svg class="sema" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(b.baslik)}. ${esc(aciklama)}">
        <path d="${izgara}" style="stroke:var(--line)" stroke-width="1" stroke-dasharray="3 3" fill="none"></path>
        <path d="M${x0} 4V${eksenY}" style="stroke:var(--muted)" stroke-width="1" fill="none"></path>
        ${satirlar}${ticks}
      </svg>
      <span class="aralik-alt">${esc(b.eksen)}</span>
      <div class="aralik-liste">${b.satirlar.map((r) => `<div><span class="aralik-kod">${esc(r.ad)} ${sayi(r.bas)}–${sayi(r.son)}×</span><span class="mini-metin">${esc(r.metin)}</span></div>`).join('')}</div>
      ${b.not ? `<p class="kucuk">${esc(b.not)}</p>` : ''}
    </div>`;
}

function formulBlok(b) {
  return `
    <div class="kart" style="gap:14px">
      <div class="formul">${esc(b.formul)}</div>
      <div class="tanimlar">${(b.tanimlar || []).map((t) => `<div class="tanim"><b>${esc(t[0])}</b><span>${esc(t[1])}</span></div>`).join('')}</div>
      ${b.ornek ? `<div class="ornek"><span class="ust" style="font-size:11px">${esc(b.ornek.baslik)}</span>${b.ornek.satirlar.map((t) => `<div class="ornek-satir"><b>${esc(t[0])}</b> ${esc(t[1])}</div>`).join('')}</div>` : ''}
      ${b.kural ? `<p class="kural">${esc(b.kural)}</p>` : ''}
    </div>`;
}

/* ---- kaynak/uygulama/82-hesaplayici.js ---- */
/* ---------- Hesaplayıcı görünümü ---------- */
function hesapDurum(tur) {
  const h = HESAPLAR[tur];
  const kayit = (durum.hesaplar[tur] = durum.hesaplar[tur] && typeof durum.hesaplar[tur] === 'object' ? durum.hesaplar[tur] : {});
  h.gruplar.forEach((g) => { if (!g.s.some(([v]) => v === kayit[g.k])) kayit[g.k] = g.v; });
  return kayit;
}
function hesapBlok(tur) {
  const h = HESAPLAR[tur];
  if (!h) return '';
  const d = hesapDurum(tur);
  const r = h.hesapla(d);
  const grup = (g) => `
    <fieldset class="hesap-grup"><legend>${esc(g.ad)}</legend>
      <div class="secenekler">${g.s.map(([v, l]) => `<button type="button" class="secenek" data-hesap-tur="${tur}" data-hesap="${g.k}" data-deger="${v}" aria-pressed="${d[g.k] === v}">${esc(l)}</button>`).join('')}</div>
    </fieldset>`;
  return `
    <div class="kart" style="gap:16px" data-hesap-kutu="${tur}">
      ${h.gruplar.map(grup).join('')}
      <div class="sonuc" aria-live="polite">${sonucHtml(r)}</div>
      <div class="adimlar">${adimHtml(r)}</div>
      ${h.not ? `<p class="kucuk">${esc(h.not)}</p>` : ''}
    </div>`;
}
const sonucHtml = (r) => r.sonuclar.map((s) => `<div><span class="sonuc-ad">${esc(s[0])}</span><span class="sonuc-deger">${esc(s[1])}</span></div>`).join('');
const adimHtml = (r) => r.adimlar.map((a) => `<span>${esc(a)}</span>`).join('');
function hesapYaz(tur) {
  const h = HESAPLAR[tur];
  if (!h) return;
  const r = h.hesapla(hesapDurum(tur));
  $$(`[data-hesap-kutu="${tur}"]`).forEach((k) => {
    const s = $('.sonuc', k), a = $('.adimlar', k);
    if (s) s.innerHTML = sonucHtml(r);
    if (a) a.innerHTML = adimHtml(r);
  });
}

/* ---- kaynak/uygulama/83-arama-ekrani.js ---- */
/* ---------- Arama ekranı ---------- */
function aramaEkrani() {
  const vazgec = onceki && onceki !== 'ara' ? onceki : 'ana';
  return `
    <div class="ust-cubuk" id="ust-cubuk">
      <div class="arama-satir">
        <label class="arama-alan" for="arama-kutusu">${IKON.ara}<span class="gizli">Konu, parça veya terim ara</span>
          <input id="arama-kutusu" type="search" autocomplete="off" enterkeyhint="search" placeholder="Konu, parça veya terim ara" value="${esc(durum.sorgu)}">
        </label>
        <button type="button" class="metin-dugme" data-git="${vazgec}">Vazgeç</button>
      </div>
    </div>
    <h1 class="gizli" tabindex="-1">Arama</h1>
    <div id="arama-sonuc" class="blok-grup" style="gap:20px">${aramaSonuclari()}</div>`;
}
function aramaSonuclari() {
  const q = durum.sorgu.trim();
  if (katla(q).length < 2) {
    const son = durum.aramalar.length ? durum.aramalar : ['C eğrisi', 'PUL', 'Mikroadım', 'Kaplin', 'gG'];
    return `
      <div class="blok-grup" style="gap:10px"><span class="ust">${durum.aramalar.length ? 'Son aramalar' : 'Örnek aramalar'}</span>
        <div class="cip-kutu">${son.map((t) => `<button type="button" class="parca" data-ara-terim="${esc(t)}">${esc(t)}</button>`).join('')}</div></div>
      <div class="blok-grup" style="gap:10px"><span class="ust">Parçalar ve terimler</span>
        <div class="cip-kutu">${TUM_PARCALAR.map((p) => `<button type="button" class="parca" data-ara-terim="${esc(aramaTerimi(p))}">${esc(p)}</button>`).join('')}</div></div>`;
  }
  const { terimler, sonuclar } = ara(q);
  if (!sonuclar.length) {
    return `<div class="bos">${IKON.ara}<span>“${esc(q)}” için sonuç yok. Daha kısa bir terim ya da parça adı dene.</span></div>`;
  }
  return `
    <span class="ust" aria-live="polite">“${esc(q)}” için ${sonuclar.length} sonuç</span>
    <div class="liste">${sonuclar.map((d) => {
      const a = d.alt;
      const h = hazirMi(a);
      const baslik = h ? sayfaOf(a).baslik : a.ad;
      const yol = a.konu.ad + (d.bolumAd ? ' › ' + d.bolumAd : '') + (kilitli(a) ? ' · Premium' : '');
      const parca = vurgula(kesit(d.metin, terimler[0]), terimler);
      const ic = `<span class="sonuc-yol">${esc(yol)}</span><span class="bulgu-ad">${vurgula(baslik, terimler)}</span><span class="sonuc-parca">${parca}</span>`;
      return h
        ? `<button type="button" class="sonuc-kart" data-git="${a.id}"${d.bolum ? ` data-hedef-bolum="${d.bolum}"` : ''}>${ic}</button>`
        : `<div class="sonuc-kart">${ic}<span class="rozet" style="align-self:flex-start">Hazırlanıyor</span></div>`;
    }).join('')}</div>`;
}
function aramaKaydet(q) {
  q = q.trim();
  if (katla(q).length < 2) return;
  durum.aramalar = [q].concat(durum.aramalar.filter((x) => katla(x) !== katla(q))).slice(0, 6);
  DEPO.yaz('aramalar', durum.aramalar);
}
function sonucYenile() {
  const k = $('#arama-sonuc');
  if (k) k.innerHTML = aramaSonuclari();
}

let aktifBolum = null;
let kareBekliyor = false;
function sayfaAcildi(a) {

  const bolum = bekleyenBolum && s.bolumler.some((b) => b.id === bekleyenBolum) ? bekleyenBolum : s.bolumler[0].id;
  durum.son = { sayfa: a.id, bolum };

}
function bolumeGit(id, yumusak) {
  const sec = document.getElementById('b-' + id);
  if (!sec) return;
  const cubuk = $('#ust-cubuk');
  const h = cubuk ? cubuk.offsetHeight : 0;
  const top = sec.getBoundingClientRect().top + window.scrollY - h - 12;
  window.scrollTo({ top: Math.max(0, top), behavior: yumusak && !azHareket() ? 'smooth' : 'auto' });
}
function kaydirmaIzle() {
  const cubuk = $('#ust-cubuk');
  if (cubuk) cubuk.classList.toggle('golgeli', window.scrollY > 4);
  if (!ALT[rota]) return;
  const secs = $$('.bolum');
  if (!secs.length) return;
  const alt = cubuk ? cubuk.getBoundingClientRect().bottom : 0;
  let idx = 0;
  secs.forEach((s, i) => { if (s.getBoundingClientRect().top <= alt + 48) idx = i; });
  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 8) idx = secs.length - 1;
  const id = secs[idx].dataset.bolum;

  aktifBolum = id;

    $$('.cip', satir).forEach((c) => c.classList.toggle('etkin', c.dataset.bolumKaydir === id));
    const c = $(`[data-bolum-kaydir="${id}"]`, satir);
    if (c) {
      const hedef = c.offsetLeft - satir.offsetLeft - 40;
      try { satir.scrollTo({ left: Math.max(0, hedef), behavior: azHareket() ? 'auto' : 'smooth' }); } catch (e) { satir.scrollLeft = Math.max(0, hedef); }
    }
  }
  durum.son = { sayfa: rota, bolum: id };
  DEPO.yaz('son', durum.son);
  if (idx > (Number(durum.ilerleme[rota]) || 0)) {
    durum.ilerleme[rota] = idx;

  }
}

/* ---- kaynak/uygulama/86-model.js ---- */
/* ---------- 3B modeller ----------
   Sayfada { tip: 'model', tur: '<ad>' }. Modeller: konular/<konu>/modeller.js (MODELLER). Rehber: belgeler/model-3b.md
   Three.js ilk model açılınca bir kez yüklenir ve önbellekte kalır. Çizim yalnızca bir şey değişince yapılır
   (sürükleme, düğme, animasyon). Sayfadan çıkınca sahne, GPU kaynakları ve dinleyiciler temizlenir. */
const THREE_YOLU = './varliklar/kutuphane/three-0.186.1/three.min.js';
let threeSozu = null;
const threeYukle = () => threeSozu || (threeSozu = import(THREE_YOLU).catch((e) => { threeSozu = null; throw e; }));
const modelOrnekleri = [];

/* Malzemeler: gerçek malzeme hissi, uygulamanın renkleri. r: belirteç adı verilirse renk temadan okunur. */
const MALZEMELER = {
  aluminyum: { renk: 0xc4c9cf, metal: 0.3, puruz: 0.42 },
  celik: { renk: 0xa3aab1, metal: 0.45, puruz: 0.32 },
  sac: { renk: 0x646b73, metal: 0.25, puruz: 0.5 },
  bakir: { renk: 0xc07a3e, metal: 0.35, puruz: 0.38 },
  miknatis: { renk: 0x4a5058, metal: 0.1, puruz: 0.6 },
  kuzey: { r: '--dc-plus', metal: 0.1, puruz: 0.55 },
  guney: { r: '--wire-n', metal: 0.1, puruz: 0.55 },
  plastik: { renk: 0x2b2f34, metal: 0, puruz: 0.7 },
  plastikAcik: { renk: 0xe8e4da, metal: 0, puruz: 0.65 },
  balata: { renk: 0x8c7b66, metal: 0, puruz: 0.85 },
  kart: { renk: 0x2f6b4a, metal: 0.05, puruz: 0.6 },
  klemens: { renk: 0x2e7a4e, metal: 0, puruz: 0.6 },
  kondansator: { renk: 0x2b4476, metal: 0.15, puruz: 0.45 },
  ledYesil: { renk: 0x1f4d2e, metal: 0, puruz: 0.3 },
  ledKirmizi: { renk: 0x5a2020, metal: 0, puruz: 0.3 },
  entegre: { renk: 0x1c1f22, metal: 0.1, puruz: 0.5 },
  vurgu: { r: '--accent', metal: 0.1, puruz: 0.5 },
  kabloSiyah: { renk: 0x1f2226, metal: 0, puruz: 0.6 },
  kabloYesil: { renk: 0x3f8a3a, metal: 0, puruz: 0.6 },
  kabloKirmizi: { renk: 0xb7352a, metal: 0, puruz: 0.6 },
  kabloMavi: { renk: 0x2c63b0, metal: 0, puruz: 0.6 },
  kabloKahve: { renk: 0x7b4a2c, metal: 0, puruz: 0.6 },
  kabloGri: { renk: 0x8b9096, metal: 0, puruz: 0.6 }
};

const modelDurum = (tur) => {
  if (!durum.model[tur]) durum.model[tur] = Object.assign({ patlat: false, kesit: 0, secili: -1, etiket: -1 }, MODELLER[tur].yeni ? MODELLER[tur].yeni() : {});
  return durum.model[tur];
};

function modelDugmeleri(tur, s) {
  const M = MODELLER[tur];
  const d = (M.dugmeler ? M.dugmeler(s) : []).slice();
  if (M.patlat !== false) d.push(['patlat', s.patlat ? 'Birleştir' : 'Parçala', s.patlat]);
  const k = modelKesitleri(tur);
  if (k.length) d.push(['kesit', s.kesit ? `Kesit: ${k[s.kesit - 1].ad}` : 'Kesit', s.kesit > 0]);
  d.push(['sifirla', 'Görünümü sıfırla']);
  return d.map(([o, e, b]) => `<button type="button" class="dugme dugme-kucuk" data-model-olay="${o}"${b == null ? '' : ` aria-pressed="${!!b}"`}>${esc(e)}</button>`).join('');
}

/* Kesit kipleri: düğme sırayla dolaşır (yok → 1 → 2 …). Varsayılan: sağ üst çeyrek kesilir. */
const modelKesitleri = (tur) => MODELLER[tur].kesitler || [{ ad: 'çeyrek', planlar: [[-1, 0, 0, 0], [0, -1, 0, 0]] }];

function modelSecimMetni(tur, s) {
  const e = s.etiket >= 0 && MODELLER[tur].etiketler ? MODELLER[tur].etiketler[s.etiket] : null;
  if (e) return `<span class="model-etiket-ad">${esc(e[0])}</span><span><span class="isaret-metin">${esc(e[1])}</span></span>`;
  const p = MODELLER[tur].parcalar[s.secili];
  return p ? `<span class="isaret-no" aria-hidden="true">${s.secili + 1}</span><span><span class="isaret-ad">${esc(p[0])}</span><span class="isaret-metin">${esc(p[1])}</span></span>` : '';
}

function modelBlok(tur) {
  const M = MODELLER[tur];
  if (!M) return '';
  const s = modelDurum(tur), d = M.durum ? M.durum(s) : null;
  return `
    <div class="model-blok" data-model-kutu="${tur}" data-durum="yukleniyor">
      <div class="kart model-kutu">
        <div class="model-sahne" id="model-${tur}-s" role="img" aria-label="${esc(M.aciklama)}">
          <p class="model-bilgi" id="model-${tur}-y">3B model yükleniyor…</p>
          <div class="model-isaretler" id="model-${tur}-i">${M.parcalar.map((p, i) => `<button type="button" class="model-no" tabindex="-1" aria-hidden="true" data-model-parca="${i}" aria-pressed="${s.secili === i}">${i + 1}</button>`).join('')}${(M.etiketler || []).map(([ad], i) => `<button type="button" class="model-etiket gizli-no" tabindex="-1" aria-hidden="true" data-model-etiket="${i}" aria-pressed="${s.etiket === i}">${esc(ad)}</button>`).join('')}</div>
        </div>
        <div class="model-secim" id="model-${tur}-c" aria-live="polite"${s.secili < 0 ? ' hidden' : ''}>${modelSecimMetni(tur, s)}</div>
        ${d ? `<div class="sim-durum${d.uyari ? ' uyari' : ''}" id="model-${tur}-d" aria-live="polite">${esc(d.metin)}</div>` : ''}
        <div class="dugme-satir" id="model-${tur}-b">${modelDugmeleri(tur, s)}</div>
        <p class="kucuk">${esc(M.not)}</p>
      </div>
      <ol class="isaretler model-parcalar">${M.parcalar.map(([ad, m], i) => `
        <li><button type="button" class="model-parca" data-model-parca="${i}" aria-pressed="${s.secili === i}"><span class="isaret-no" aria-hidden="true">${i + 1}</span><span><span class="isaret-ad"><span class="gizli">${i + 1}. </span>${esc(ad)}</span><span class="isaret-metin">${esc(m)}</span></span></button></li>`).join('')}</ol>
      ${M.etiketler ? `<p class="ust">${esc(M.etiketBaslik || 'Etiketler')}</p>
      <div class="tablo">${M.etiketler.map(([ad, m], i) => `<button type="button" class="tablo-satir model-etiket-satir" data-model-etiket="${i}" aria-pressed="${s.etiket === i}"><span class="tablo-etiket">${esc(ad)}</span><span class="tablo-metin">${esc(m)}</span></button>`).join('')}</div>` : ''}
    </div>`;
}

function modelleriTemizle() {
  modelOrnekleri.splice(0).forEach((o) => { o.bitti = true; if (o.temizle) o.temizle(); });
}

function modelleriKur() {
  modelleriTemizle();
  $$('[data-model-kutu]').forEach((kutu) => {
    const tur = kutu.dataset.modelKutu;
    if (!MODELLER[tur]) return;
    const o = { tur, kutu, bitti: false, gorunum: null };
    modelOrnekleri.push(o);
    kutu.addEventListener('click', (e) => modelTikla(o, e));
    threeYukle()
      .then((T) => { if (!o.bitti) modelBaslat(T, o); }, () => { if (!o.bitti) modelHata(o, 'yukleme'); })
      .catch((e) => { modelHata(o, 'hata'); console.error('3B model:', o.tur, e); });
  });
}

function modelHata(o, neden) {
  o.kutu.dataset.durum = 'hata';
  const b = document.getElementById(`model-${o.tur}-y`);
  if (b) {
    b.innerHTML = neden === 'webgl' ? 'Bu cihazda 3B çizim açılamadı (WebGL desteklenmiyor). Parçaların listesi aşağıda.'
      : neden === 'yukleme' ? '3B model yüklenemedi. İnternete bağlanıp <button type="button" class="metin-dugme" data-model-olay="yeniden">yeniden dene</button>.'
      : '3B model açılamadı. Parçaların listesi aşağıda.';
  }
}

/* Durum metni, düğmeler ve seçim kutusu; animasyonda her karede çağrılır, bu yüzden yalnızca değişen yazılır
   (odak korunur, aria-live alanları boşuna yeniden okunmaz). */
function modelYaz(o) {
  const M = MODELLER[o.tur], s = modelDurum(o.tur);
  const de = document.getElementById(`model-${o.tur}-d`);
  if (de && M.durum) {
    const d = M.durum(s);
    if (de.textContent !== d.metin) de.textContent = d.metin;
    de.classList.toggle('uyari', !!d.uyari);
  }
  const be = document.getElementById(`model-${o.tur}-b`), yeni = modelDugmeleri(o.tur, s);
  if (be && be.dataset.son !== yeni) {
    const odak = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.modelOlay : null;
    be.innerHTML = yeni;
    be.dataset.son = yeni;
    if (odak) { const b = be.querySelector(`[data-model-olay="${odak}"]`); if (b) b.focus({ preventScroll: true }); }
  }
  const ce = document.getElementById(`model-${o.tur}-c`);
  if (ce) {
    ce.hidden = s.secili < 0;
    const metin = modelSecimMetni(o.tur, s);
    if (ce.dataset.son !== metin) { ce.innerHTML = metin; ce.dataset.son = metin; }
  }
  const bas = (b, deger) => { if (b.getAttribute('aria-pressed') !== deger) b.setAttribute('aria-pressed', deger); };
  $$('[data-model-parca]', o.kutu).forEach((b) => bas(b, String(Number(b.dataset.modelParca) === s.secili && s.etiket < 0)));
  $$('[data-model-etiket]', o.kutu).forEach((b) => bas(b, String(Number(b.dataset.modelEtiket) === s.etiket)));
}

function modelTikla(o, e) {
  const el = e.target.closest('[data-model-olay],[data-model-parca],[data-model-etiket]');
  if (!el) return;
  const M = MODELLER[o.tur], s = modelDurum(o.tur);
  if (el.dataset.modelEtiket != null) {
    const i = Number(el.dataset.modelEtiket);
    s.etiket = s.etiket === i ? -1 : i;
    if (s.etiket >= 0 && o.etiketParca) s.secili = o.etiketParca[i];
  } else if (el.dataset.modelParca != null) {
    const i = Number(el.dataset.modelParca);
    s.secili = s.secili === i && s.etiket < 0 ? -1 : i;
    s.etiket = -1;
  } else {
    const olay = el.dataset.modelOlay;
    if (olay === 'yeniden') { modelleriKur(); return; }
    if (olay === 'patlat') { s.patlat = !s.patlat; if (o.gorunum) o.gorunum.patlatildi(); }
    else if (olay === 'kesit') s.kesit = (s.kesit + 1) % (modelKesitleri(o.tur).length + 1);
    else if (olay === 'sifirla') { s.patlat = false; s.kesit = 0; s.secili = -1; s.etiket = -1; if (o.gorunum) o.gorunum.kameraSifirla(); }
    else if (M.olay) M.olay(s, olay);
  }
  modelYaz(o);
  if (o.gorunum) o.gorunum.guncelle();
}

function modelBaslat(T, o) {
  const M = MODELLER[o.tur], s = modelDurum(o.tur);
  const sahneEl = document.getElementById(`model-${o.tur}-s`), isaretEl = document.getElementById(`model-${o.tur}-i`);
  if (!sahneEl) return;
  let renderer;
  try {
    renderer = new T.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'low-power' });
  } catch (e) { modelHata(o, 'webgl'); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = T.SRGBColorSpace;
  renderer.toneMapping = T.NoToneMapping;
  renderer.localClippingEnabled = true;
  const tuval = renderer.domElement;
  tuval.className = 'model-tuval';
  sahneEl.insertBefore(tuval, isaretEl);

  const belirtec = (ad) => getComputedStyle(document.documentElement).getPropertyValue(ad).trim() || '#888888';
  const sahne = new T.Scene();
  const kamera = new T.PerspectiveCamera(28, 1, 1, 5000);
  /* Işık kameraya bağlı: model döndükçe bakılan yüz hep aydınlık kalır. Değerler, dik bakan açık yüz beyaza kaçmayacak kadar düşük. */
  const isik = new T.DirectionalLight(0xffffff, 1.45);
  isik.position.set(0.6, 1.1, 1);
  const dolgu = new T.DirectionalLight(0xffffff, 0.45);
  dolgu.position.set(-1, -0.4, 0.2);
  kamera.add(isik, dolgu);
  sahne.add(kamera, new T.HemisphereLight(0xffffff, 0x9a9fa6, 0.95));

  /* ---- modele verilen yardımcılar ---- */
  const malzemeler = new Map();
  const cizgiMalzeme = new T.LineBasicMaterial({ color: belirtec('--ink'), transparent: true, opacity: 0.4 });
  const y = {
    T,
    malzeme(ad) {
      if (!malzemeler.has(ad)) {
        const m = MALZEMELER[ad];
        if (!m) throw new Error('Bilinmeyen malzeme: ' + ad);
        malzemeler.set(ad, new T.MeshStandardMaterial({ color: m.r ? belirtec(m.r) : m.renk, metalness: m.metal, roughness: m.puruz }));
      }
      return malzemeler.get(ad);
    },
    /* Ağ: geometri + malzeme adı. kenar: false verilmezse keskin kenarlar ince çizgiyle çizilir (teknik çizim görünümü). */
    ag(geo, malzeme, sec = {}) {
      const a = new T.Mesh(geo, typeof malzeme === 'string' ? y.malzeme(malzeme) : malzeme);
      if (sec.kenar !== false) a.add(new T.LineSegments(new T.EdgesGeometry(geo, sec.esik || 35), cizgiMalzeme));
      return a;
    },
    /* Z ekseni boyunca, z = 0 merkezli geometriler */
    silindir: (r, u, bolum = 48) => new T.CylinderGeometry(r, r, u, bolum).rotateX(Math.PI / 2),
    halka(ic, dis, u, bolum = 64) {
      const sekil = new T.Shape().absarc(0, 0, dis, 0, Math.PI * 2, false);
      sekil.holes.push(new T.Path().absarc(0, 0, ic, 0, Math.PI * 2, true));
      return y.cek(sekil, u, { bolum });
    },
    /* Şekli z boyunca u kadar çeker, ortalar. pah: kenar yuvarlatma (mm); pah içe doğrudur, dış ölçü ve delikler şekildeki gibi kalır. */
    cek(sekil, u, sec = {}) {
      const pah = sec.pah || 0;
      const g = new T.ExtrudeGeometry(sekil, { depth: u - pah * 2, bevelEnabled: pah > 0, bevelThickness: pah, bevelSize: pah, bevelOffset: -pah, bevelSegments: 2, curveSegments: sec.bolum || 24 });
      return g.translate(0, 0, -(u - pah * 2) / 2);
    },
    pahliKare(kenar, pah) {
      const k = kenar / 2, p = pah;
      return new T.Shape().moveTo(-k + p, -k).lineTo(k - p, -k).lineTo(k, -k + p).lineTo(k, k - p).lineTo(k - p, k).lineTo(-k + p, k).lineTo(-k, k - p).lineTo(-k, -k + p).closePath();
    },
    boru(noktalar, r, bolum = 48) {
      return new T.TubeGeometry(new T.CatmullRomCurve3(noktalar.map((n) => new T.Vector3(...n))), bolum, r, 10, false);
    },
    /* Kutuplu stator boşluğu (şeklin deliği olarak kullanılır). n kutup, 1. kutup bas açısında, sonrakiler artan açıyla.
       rArka: arka demir, rUc: kutup ucunun sırtı, rIc: delik (hava aralığı) yarıçapı, g: kutup gövdesinin yarı genişliği,
       uc: kutup ucunun yarı açısı (rad). dis: { sayi, adim (rad), derinlik, oran } kutup yüzündeki ince dişler (isteğe bağlı). */
    kutupluBosluk({ n, rArka, rUc, rIc, g, uc, bas = Math.PI / 2, dis = null }) {

        const N = (r, t) => new T.Vector2(r * u[0] + t * v[0], r * u[1] + t * v[1]);
        d.push(N(Math.sqrt(rArka * rArka - g * g), -g), N(Math.sqrt(rUc * rUc - g * g), -g));

        d.push(V(rUc, c - uc), V(rY, c - uc));

          for (let j = 0; j < dis.sayi; j++) {

            d.push(V(rY, a - h), V(rIc, a - h), V(rIc, a + h), V(rY, a + h));

        d.push(V(rY, c + uc), V(rUc, c + uc));
        yay(d, rUc, c + uc, c + aS, 3);
        d.push(N(Math.sqrt(rUc * rUc - g * g), g), N(Math.sqrt(rArka * rArka - g * g), g));
        yay(d, rArka, c + aB, c + adim - aB, 6);

    },
    /* Kutup gövdesine sarılı bobin, +y yönündeki kutup için; z ekseni boyunca uzanır. gw, gh: gövde deliğinin yarı
       genişliği ve yarı boyu, kalinlik: tel sargısının kalınlığı, uzanti: gövdeden taşan uç, r0 ve derinlik: radyal konum. */
    bobin({ gw, gh, kalinlik, uzanti, r0, derinlik, pah = 0.3 }) {
      const bw = gw + kalinlik, bh = gh + uzanti, br = Math.min(2, kalinlik);
      const s = new T.Shape().moveTo(-bw + br, -bh).lineTo(bw - br, -bh).quadraticCurveTo(bw, -bh, bw, -bh + br).lineTo(bw, bh - br).quadraticCurveTo(bw, bh, bw - br, bh)
        .lineTo(-bw + br, bh).quadraticCurveTo(-bw, bh, -bw, bh - br).lineTo(-bw, -bh + br).quadraticCurveTo(-bw, -bh, -bw + br, -bh);
      s.holes.push(new T.Path().moveTo(-gw, -gh).lineTo(-gw, gh).lineTo(gw, gh).lineTo(gw, -gh).closePath());
      return new T.ExtrudeGeometry(s, { depth: derinlik - 2 * pah, bevelEnabled: pah > 0, bevelThickness: pah, bevelSize: pah, bevelSegments: 2, curveSegments: 6 })

    /* Dişli disk şekli: diş üstü rDis, diş dibi rTaban, ortada rDelik. oran: diş tabanının adıma oranı. kayma: açı (rad). */
    disli({ sayi, rDis, rTaban, rDelik = 0, kayma = 0, oran = 0.42 }) {
      const n = [], p = (Math.PI * 2) / sayi, h = (p * oran) / 2;
      for (let i = 0; i < sayi; i++) {

      }

    },
    /* Helis yay: z = 0’dan uzunluk kadar, sarım yarıçapı r, tel yarıçapı tel, tur sayısı. Sıkışma için scale.z kullan. */
    helis(r, tel, uzunluk, tur) {
      const n = Math.max(16, Math.round(tur * 20)), noktalar = [];
      for (let i = 0; i <= n; i++) { const a = (i / n) * tur * Math.PI * 2; noktalar.push(new T.Vector3(r * Math.cos(a), r * Math.sin(a), (i / n) * uzunluk)); }
      return new T.TubeGeometry(new T.CatmullRomCurve3(noktalar), n * 2, tel, 8, false);

    /* Dönel parça: (r, z) profilini z ekseni etrafında döndürür. Kapalı ağ için profil kapalı olmalı (ilk ve son nokta aynı
       ya da ikisi de eksende) ve saat yönünün tersine dolaşmalı (r sağa, z yukarı). [r, z, 1] köşeyi keskin yapar.
       bas, aci: yalnızca bir dilim (radyan; bas, +x ekseninden saat yönünün tersine ölçülür). */
    torna(noktalar, bolum = 48, bas = 0, aci = Math.PI * 2) {
      const p = [], son = noktalar.length - 1;
      noktalar.forEach(([r, z, k], i) => { p.push(new T.Vector2(r, z)); if (k && i > 0 && i < son) p.push(new T.Vector2(r, z)); });
      const g = new T.LatheGeometry(p, bolum, bas + Math.PI / 2, aci).rotateX(Math.PI / 2);   // Lathe açısı −y’den başlar
      const n = g.attributes.normal, v = new T.Vector3();   // LatheGeometry son halkanın normalini boyutlandırmaz
      for (let i = 0; i < n.count; i++) { v.fromBufferAttribute(n, i).normalize(); n.setXYZ(i, v.x, v.y, v.z); }
      return g;

    /* Köşeleri yuvarlatılmış dikdörtgen şekil (merkezli). */
    yuvarlakDikdortgen(w, h, r) {
      const a = w / 2, b = h / 2;
      return new T.Shape().moveTo(-a + r, -b).lineTo(a - r, -b).quadraticCurveTo(a, -b, a, -b + r).lineTo(a, b - r).quadraticCurveTo(a, b, a - r, b)
        .lineTo(-a + r, b).quadraticCurveTo(-a, b, -a, b - r).lineTo(-a, -b + r).quadraticCurveTo(-a, -b, -a + r, -b);
    },
    /* TS35 × 7,5 DIN ray (EN 60715): x ekseni boyunca uzunluk kadar, x = 0’dan başlar; ray yüzü z = 0, panoya doğru −z. */
    dinRay(uzunluk) {
      const p = [[-17.5, 0], [-12.5, 0], [-12.5, -6.5], [12.5, -6.5], [12.5, 0], [17.5, 0], [17.5, -1], [13.5, -1], [13.5, -7.5], [-13.5, -7.5], [-13.5, -1], [-17.5, -1]];
      return new T.ExtrudeGeometry(new T.Shape(p.map(([yy, z]) => new T.Vector2(-z, yy))), { depth: uzunluk, bevelEnabled: false }).rotateY(Math.PI / 2);
    },
    /* Sabit bilyalı rulman (z ekseninde, z = 0 merkezli): dış bilezik, iç bilezik, bilyeler. */
    rulman(ic, dis, gen) {
      const t = (dis - ic) * 0.28, rb = (dis - ic - 2 * t) * 0.46, rc = (ic + dis) / 2, n = Math.floor((Math.PI * 2 * rc) / (rb * 2.6));
      const g = new T.Group();
      g.add(y.ag(y.halka(dis - t, dis, gen), 'celik'), y.ag(y.halka(ic, ic + t, gen), 'celik'));
      const bilye = new T.SphereGeometry(rb, 14, 10);
      for (let i = 0; i < n; i++) {
        const b = y.ag(bilye, 'celik', { kenar: false });
        b.position.set(rc * Math.cos((i * Math.PI * 2) / n), rc * Math.sin((i * Math.PI * 2) / n), 0);

  let m;

  const parcalar = m.parcalar.map((p, i) => {
    const kopya = new Map();
    const aglar = [];
    p.nesne.traverse((n) => {
      if (n.isMesh || n.isLineSegments) {

        n.material = kopya.get(n.material);

  /* Kesit yüzleri: her ağın arka yüzleri düz renkle çizilir. Kesitten içeri bakınca görünen arka yüzler dolu bir kesit
     yüzeyi gibi görünür (kapalı ağlarda çalışır). Yalnızca kesit açıkken görünür; renk ve saydamlık ana ağdan kopyalanır. */
  const kapaklar = [];

  function kapaklariEsle() {
    if (!s.kesit) return;
    kapaklar.forEach((k) => {
      const a = k.userData.ana.material, km = k.material;
      km.color.copy(a.color).multiplyScalar(0.82);

  /* ---- kamera: başlangıç yönünden bakınca model (birleşik ve parçalı hâlde) çerçeveye sığar ---- */
  const yon = new T.Vector3(...(M.kamera && M.kamera.yon ? M.kamera.yon : [1, 0.7, 1.6])).normalize();
  /* kamera.patlak: parçalı görünümde kameranın döneceği yön (uzun modellerde yandan bakış). */

  const acilar = (v) => ({ teta: Math.atan2(v.x, v.z), fi: Math.acos(v.y) });

  }
  function sigdir(pp, bakis) {
    parcalar.forEach((pr) => pr.nesne.position.copy(pr.taban).addScaledVector(pr.patlat, pp));
    m.kok.updateMatrixWorld(true);
    const koseler = [];   // her ağın kendi kutusunun köşeleri: tek büyük kutudan daha sıkı sığdırır
    m.kok.traverse((n) => {
      if (!n.isMesh) return;

      const k = n.geometry.boundingBox;
      for (const x of [k.min.x, k.max.x]) for (const yy of [k.min.y, k.max.y]) for (const z of [k.min.z, k.max.z]) koseler.push(new T.Vector3(x, yy, z).applyMatrix4(n.matrixWorld));
    });
    (m.cerceve || []).forEach((c) => koseler.push(new T.Vector3(...c)));   // hareketli parçaların ulaştığı uçlar (ör. ileri çıkan kol)
    const kutu = new T.Box3().setFromPoints(koseler), merkez = kutu.getCenter(new T.Vector3());
    let d = kutu.getBoundingSphere(new T.Sphere()).radius / Math.sin((kamera.fov * Math.PI) / 360);

      kamera.updateMatrixWorld();
      kamera.updateProjectionMatrix();

  let cerceve = null;
  const cerceveHesapla = () => { cerceve = [sigdir(0, yon), sigdir(1, yonPatlak)]; patlatUygula(); };

  const kesitPlanlari = modelKesitleri(o.tur).map((k) => k.planlar.map(([a, b, c, d]) => new T.Plane(new T.Vector3(a, b, c), d)));
  const planlar = () => kesitPlanlari[s.kesit - 1] || [];
  /* Işın testi kesimi bilmez: kesit açıkken kesilip atılan bölgeye (bütün planların arkası) düşen vuruşlar yok sayılır.
     0,01 mm pay: düzlemin tam üstündeki nokta (ör. döndürülmüş grupta yerel x = 0) yuvarlama hatasıyla kesik sayılmasın. */
  const kesik = (nk) => s.kesit > 0 && planlar().every((pl) => pl.distanceToPoint(nk) < -0.01);
  const gorunenVurus = (liste) => liste.find((x) => x.object.visible && x.object.material.opacity > 0.5 && !kesik(x.point));
  let p = s.patlat ? 1 : 0, kesitUygulanan = null, seciliUygulanan = null;

  const vurgu = new T.Color(belirtec('--accent'));

    parcalar.forEach((pr, i) => pr.malzemeler.forEach((mm) => {
      const secili = i === s.secili, soluk = s.secili >= 0 && !secili, cizgi = mm.isLineBasicMaterial;

  function patlatUygula() {

    const simdi = performance.now();

    if (!nw || !nh || (nw === w && nh === h)) return;
    w = nw; h = nh;
    renderer.setSize(w, h, false);
    kamera.aspect = w / h;

    iste();
  }

  /* ---- dokunma ve fare: tek parmak döndürür, iki parmak yakınlaştırır; kısa dokunuş parça seçer ---- */
  const isaretci = new Map();
  let dokunus = null, ikiliBas = 0;
  const sinirla = (x, a, b) => Math.max(a, Math.min(b, x));
  tuval.addEventListener('pointerdown', (e) => {
    isaretci.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { tuval.setPointerCapture(e.pointerId); } catch (x) { /* yok say */ }
    dokunus = isaretci.size === 1 ? { x: e.clientX, y: e.clientY } : null;
    kameraHedef = null;
    if (isaretci.size === 2) { const [a, b] = [...isaretci.values()]; ikiliBas = Math.hypot(a.x - b.x, a.y - b.y); }
    surukleniyor = true;
  });
  tuval.addEventListener('pointermove', (e) => {
    const onceki = isaretci.get(e.pointerId);
    if (!onceki) return;
    const yeni = { x: e.clientX, y: e.clientY };
    isaretci.set(e.pointerId, yeni);
    if (isaretci.size === 1) {
      gor.teta -= (yeni.x - onceki.x) * 0.009;
      gor.fi = sinirla(gor.fi - (yeni.y - onceki.y) * 0.009, 0.12, Math.PI - 0.12);
      if (dokunus && Math.hypot(yeni.x - dokunus.x, yeni.y - dokunus.y) > 6) dokunus = null;
    } else if (isaretci.size === 2) {
      const [a, b] = [...isaretci.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (ikiliBas > 0 && d > 0) gor.yakin = sinirla(gor.yakin * (ikiliBas / d), 0.35, 2.5);
      ikiliBas = d;
    }
    iste();
  });
  const birak = (e) => {
    if (!isaretci.has(e.pointerId)) return;
    isaretci.delete(e.pointerId);
    if (e.type === 'pointerup' && dokunus && isaretci.size === 0) {
      const r = tuval.getBoundingClientRect();
      isin.far = Infinity;
      isin.setFromCamera(new T.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), kamera);
      const vurus = gorunenVurus(isin.intersectObjects(secilebilir, false));
      const i = vurus ? vurus.object.userData.parca : -1;
      s.secili = s.secili === i && s.etiket < 0 ? -1 : i;
      s.etiket = -1;
      modelYaz(o);
    }
    if (!isaretci.size) { surukleniyor = false; dokunus = null; }
    iste();
  };
  tuval.addEventListener('pointerup', birak);
  tuval.addEventListener('pointercancel', birak);
  tuval.addEventListener('wheel', (e) => {
    if (!e.ctrlKey) return;   // düz tekerlek sayfayı kaydırır; Ctrl + tekerlek (ya da izleme dörtgeninde kıstırma) yakınlaştırır
    e.preventDefault();
    gor.yakin = sinirla(gor.yakin * Math.exp(e.deltaY * 0.01), 0.35, 2.5);
    iste();
  }, { passive: false });
  tuval.addEventListener('webglcontextlost', (e) => e.preventDefault());
  tuval.addEventListener('webglcontextrestored', iste);

  const boyutGozlem = new ResizeObserver(boyutla);
  boyutGozlem.observe(sahneEl);
  const gorunurGozlem = new IntersectionObserver((g) => { gorunur = g[0].isIntersecting; if (gorunur) iste(); });
  gorunurGozlem.observe(sahneEl);
  const koyuSorgu = matchMedia('(prefers-color-scheme: dark)');
  const temaDegisti = () => { cizgiMalzeme.color.set(belirtec('--ink')); tumMalzemeler.forEach((mm) => { if (mm.isLineBasicMaterial) mm.color.set(belirtec('--ink')); }); iste(); };
  koyuSorgu.addEventListener('change', temaDegisti);

  o.gorunum = {
    guncelle() { m.uygula(s); kapaklariEsle(); iste(); },
    kameraSifirla() { kameraHedef = null; gor.teta = bas.teta; gor.fi = bas.fi; gor.yakin = 1; },
    patlatildi() { if (yonPatlak !== yon) kameraYonel(s.patlat ? yonPatlak : yon); }
  };
  o.temizle = () => {
    cancelAnimationFrame(istek);
    boyutGozlem.disconnect();
    gorunurGozlem.disconnect();
    koyuSorgu.removeEventListener('change', temaDegisti);
    sahne.traverse((n) => {
      if (n.geometry) n.geometry.dispose();
      if (n.material) [].concat(n.material).forEach((mm) => mm.dispose());
    });
    malzemeler.forEach((mm) => mm.dispose());
    cizgiMalzeme.dispose();
    renderer.dispose();
    renderer.forceContextLoss();
  };

  m.uygula(s);
  cerceveHesapla();
  boyutla();
  o.kutu.dataset.durum = 'hazir';
  iste();
}

/* ---- kaynak/uygulama/90-olaylar.js ---- */
/* ---------- Olaylar ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-sim-olay],[data-kaydet],[data-bolum-kaydir],[data-filtre],[data-hesap],[data-ara-terim],[data-ayar],[data-sifirla],[data-uyari-onay],[data-premium],[data-git]');
  if (!el) return;
  const d = el.dataset;
  if (d.simOlay) {
    const tur = d.simTur;
    if (!SIMLER[tur]) return;
    SIMLER[tur].olay(simDurum(tur), d.simOlay, () => simGuncelle(tur));
    simGuncelle(tur);
    return;
  }
  if (el.hasAttribute('data-uyari-onay')) {
    durum.uyariOnay = true;
    DEPO.yaz('uyariOnay', true);
    if (rota === 'ana') ciz('ana', { koru: true }); else git('ana');
    return;
  }
  if (d.ayar) {
    durum.ayarlar[d.ayar] = d.deger;
    DEPO.yaz('ayarlar', durum.ayarlar);
    $$(`[data-ayar="${d.ayar}"]`).forEach((b) => b.setAttribute('aria-pressed', String(b === el)));
    temaUygula();
    return;
  }
  if (d.sifirla) {
    if (d.sifirla === 'evet') {
      durum.kayitli = []; durum.son = null; durum.ilerleme = {}; durum.aramalar = []; durum.hesaplar = {};
      ['kayitli', 'son', 'ilerleme', 'aramalar', 'hesaplar'].forEach((k) => { try { localStorage.removeItem(DEPO_ONEK + k); } catch (x) { /* yok say */ } });
      durum.sifirlaOnay = false;
      bildir('Veriler sıfırlandı');
    } else {
      durum.sifirlaOnay = d.sifirla === 'sor';
    }
    ciz(rota, { koru: true });
    const odak = $(durum.sifirlaOnay ? '[data-sifirla="evet"]' : '[data-sifirla="sor"]');
    if (odak) odak.focus({ preventScroll: true });
    return;
  }
  if (d.premium) {
    const is = d.premium === 'al' ? PREMIUM.satinAl() : PREMIUM.geriYukle(false);
    is.then((ok) => {
      if (ok && durum.premiumHedef && ALT[durum.premiumHedef]) { const h = durum.premiumHedef; durum.premiumHedef = null; git(h); }
      else if (rota === 'premium') ciz('premium', { koru: true });
    });
    return;
  }
  if (d.kaydet) {
    const i = durum.kayitli.indexOf(d.kaydet);
    if (i >= 0) durum.kayitli.splice(i, 1); else durum.kayitli.unshift(d.kaydet);
    DEPO.yaz('kayitli', durum.kayitli);
    const acik = i < 0;
    el.setAttribute('aria-pressed', String(acik));
    el.setAttribute('aria-label', acik ? 'Kayıtlardan çıkar' : 'Kaydet');
    bildir(acik ? 'Kaydedildi' : 'Kayıtlardan çıkarıldı');
  } else if (d.bolumKaydir) {
    bolumeGit(d.bolumKaydir, true);
  } else if (d.filtre) {
    durum.filtre[d.konu] = d.filtre;
    ciz(rota, { koru: true });
    const b = $(`[data-filtre="${d.filtre}"]`);
    if (b) b.focus({ preventScroll: true });
  } else if (d.hesap) {
    const tur = d.hesapTur;
    if (!HESAPLAR[tur]) return;
    hesapDurum(tur)[d.hesap] = Number(d.deger);
    DEPO.yaz('hesaplar', durum.hesaplar);
    $$(`[data-hesap-tur="${tur}"][data-hesap="${d.hesap}"]`).forEach((b) => b.setAttribute('aria-pressed', String(b === el)));
    hesapYaz(tur);
  } else if (d.araTerim) {
    durum.sorgu = d.araTerim;
    aramaKaydet(d.araTerim);
    if (rota === 'ara') {
      const g = $('#arama-kutusu');
      if (g) g.value = durum.sorgu;
      sonucYenile();
      window.scrollTo(0, 0);
    } else {
      git('ara');
    }
  } else if (d.git) {
    if (rota === 'ara' && el.closest('#arama-sonuc')) aramaKaydet(durum.sorgu);
    git(d.git, d.hedefBolum);
  }
});
document.addEventListener('input', (e) => {
  if (e.target && e.target.id === 'arama-kutusu') {
    durum.sorgu = e.target.value;
    sonucYenile();

});
document.addEventListener('keydown', (e) => {

    e.target.blur();
  }
});
