/* ---- kaynak/konular/10-sensorler/hesaplar.js ---- */
/* Sensörler: hesaplayıcılar. */
Object.assign(HESAPLAR, {
  pt100: {
    gruplar: [
      { k: 't', ad: 'Gerçek sıcaklık', v: 100, s: [[-20, '−20 °C'], [0, '0 °C'], [25, '25 °C'], [100, '100 °C'], [200, '200 °C']] },
      { k: 'b', ad: 'Bağlantı', v: 2, s: [[2, '2 telli'], [3, '3 telli'], [4, '4 telli']] },
      { k: 'l', ad: 'Kablo uzunluğu (0,75 mm²)', v: 50, s: [[10, '10 m'], [50, '50 m'], [100, '100 m']] }
    ],
    hesapla(d) {
      const A = 3.9083e-3, B = -5.775e-7, C = -4.183e-12;
      const R = 100 * (1 + A * d.t + B * d.t * d.t + (d.t < 0 ? C * (d.t - 100) * d.t ** 3 : 0));
      const rk = (0.0178 * d.l) / 0.75;
      const Rm = R + (d.b === 2 ? 2 * rk : 0);
      const Tm = (-A + Math.sqrt(A * A - 4 * B * (1 - Rm / 100))) / (2 * B);
      const hata = d.b === 2 ? Tm - d.t : 0;
      const isaretli = (x) => (x < 0 ? '−' : '') + sayi(Math.abs(x), 1);
      return {
        sonuclar: [['PT100 direnci', sayi(R, 2) + ' Ω'], ['Kablo (tek tel)', sayi(rk, 2) + ' Ω'], ['Okunan sıcaklık', isaretli(d.b === 2 ? Tm : d.t) + ' °C'], ['Hata', (hata > 0 ? '+' : '') + sayi(hata, 1) + ' °C']],
        adimlar: [`R(${isaretli(d.t)} °C) = ${sayi(R, 2)} Ω (IEC 60751)`, `Kablo: 0,0178 × ${d.l} ÷ 0,75 = ${sayi(rk, 2)} Ω/tel`, d.b === 2 ? `2 telli: ${sayi(R, 2)} + 2 × ${sayi(rk, 2)} = ${sayi(Rm, 2)} Ω → ${isaretli(Tm)} °C` : `${d.b} telli: kablo direnci ölçümden düşülür, hata ≈ 0`]
      };
    },
    not: 'Her 1 °C ≈ 0,385 Ω. 3 telli bağlantı, üç telin direnci eşitse hatayı sıfırlar.'
  },

  hsc: {
    gruplar: [
      { k: 'ppr', ad: 'Enkoder (darbe/tur)', v: 1000, s: [[100, '100'], [500, '500'], [1000, '1.000'], [2500, '2.500']] },
      { k: 'n', ad: 'En yüksek devir', v: 1500, s: [[300, '300 d/dk'], [1500, '1.500'], [3000, '3.000']] },
      { k: 'm', ad: 'Sayım modu', v: 4, s: [[1, '×1 (A)'], [4, '×4 (A/B kenar)']] }
    ],
    hesapla(d) {
      const f = (d.ppr * d.n) / 60;
      const durum = f > 100000 ? 'Aşıyor' : 'Uygun';
      return {
        sonuclar: [['A kanalı frekansı', sayi(f, 0) + ' Hz'], ['Tur başına sayım', sayi(d.ppr * d.m)], ['Standart giriş', f <= 50 ? 'Sayabilir' : 'Kaçırır'], ['HSC (100 kHz)', durum]],
        adimlar: [`f = ${sayi(d.ppr)} × ${sayi(d.n)} ÷ 60 = ${sayi(f, 0)} Hz`, `Sayım: ${sayi(d.ppr)} × ${d.m} = ${sayi(d.ppr * d.m)} / tur`, f > 100000 ? 'Hızlı sayıcı kartı ya da daha düşük çözünürlüklü enkoder gerekir.' : f > 50 ? 'Standart girişin filtresi ve tarama süresi darbeleri kaçırır; HSC girişini kullan.' : 'Standart giriş de sayabilir; yine de HSC önerilir.']
      };
    },
    not: 'HSC sınırı PLC’ye göre değişir (tipik 30–200 kHz); kataloğa bak.'
  },

  enduktif: {
    gruplar: [
      { k: 'm', ad: 'Gövde', v: 18, s: [[8, 'M8'], [12, 'M12'], [18, 'M18'], [30, 'M30']] },
      { k: 'g', ad: 'Montaj', v: 1, s: [[1, 'Gömülü'], [0, 'Gömülü değil']] },
      { k: 'k', ad: 'Hedef malzeme', v: 1, s: [[1, 'Çelik'], [0.7, 'Paslanmaz'], [0.45, 'Pirinç'], [0.4, 'Alüminyum'], [0.3, 'Bakır']] }
    ],
    hesapla(d) {
      const tablo = { 8: [1.5, 2.5], 12: [2, 4], 18: [5, 8], 30: [10, 15] };
      const sn = tablo[d.m][d.g ? 0 : 1], etkin = sn * d.k, sa = Math.floor(0.81 * etkin * 100) / 100;
      const b = etkin < 1 ? 2 : 1;
      return {
        sonuclar: [['Nominal Sn', sayi(sn, 1) + ' mm'], ['Malzeme faktörü', '× ' + sayi(d.k)], ['Etkin mesafe', sayi(etkin, b) + ' mm'], ['Güvenli algılama (Sa)', '≤ ' + sayi(sa, b) + ' mm']],
        adimlar: [`Sn (M${d.m}, ${d.g ? 'gömülü' : 'gömülü değil'}) = ${sayi(sn, 1)} mm`, `Etkin = ${sayi(sn, 1)} × ${sayi(d.k)} = ${sayi(etkin, b)} mm`, `Sa = 0,81 × ${sayi(etkin, b)} ≈ ${sayi(sa, b)} mm: hedef bu mesafenin içinden geçsin`]
      };
    },
    not: 'Tipik katalog değerleridir. Kendi sensörünün kataloğundaki Sn ve malzeme faktörlerini kullan.'
  },

  analog: {
    gruplar: [
      { k: 'o', ad: 'Ölçüm aralığı', v: 1, s: [[1, '0–10 bar'], [2, '0–16 bar'], [3, '0–100 °C'], [4, '−50…150 °C']] },
      { k: 'i', ad: 'Akım (mA)', v: 12, s: [[0, '0'], [4, '4'], [8, '8'], [12, '12'], [16, '16'], [20, '20']] }
    ],
    hesapla(d) {
      const [alt, ust, b] = { 1: [0, 10, 'bar'], 2: [0, 16, 'bar'], 3: [0, 100, '°C'], 4: [-50, 150, '°C'] }[d.o];
      if (d.i < 3.8) {
        return {
          sonuclar: [['Ölçülen değer', '—'], ['Aralığın yüzdesi', '—'], ['Ham değer (0–27.648)', 'aralık altı'], ['Durum', 'Arıza / kopuk kablo']],
          adimlar: ['Akım 4 mA’in altında: ölçüm aralığının dışında.', '0 mA genelde kopuk kablo ya da kapalı besleme demektir.', 'NAMUR NE 43: 3,6 mA altı ve 21 mA üstü arıza sinyalidir.']
        };
      }
      const oran = (d.i - 4) / 16, deger = alt + oran * (ust - alt), f = (v) => (v < 0 ? `(−${sayi(-v)})` : sayi(v));
      return {
        sonuclar: [['Ölçülen değer', (deger < 0 ? '−' + sayi(-deger, 1) : sayi(deger, 1)) + ' ' + b], ['Aralığın yüzdesi', '%' + sayi(oran * 100, 0)], ['Ham değer (0–27.648)', sayi(Math.round(oran * 27648), 0)], ['Durum', 'Normal']],
        adimlar: [`Değer = ${f(alt)} + (${d.i} − 4) × (${f(ust)} − ${f(alt)}) ÷ 16`, `Değer = ${deger < 0 ? '−' + sayi(-deger, 1) : sayi(deger, 1)} ${b}`, `Ham = (${d.i} − 4) ÷ 16 × 27.648 = ${sayi(Math.round(oran * 27648), 0)}`]
      };
    },
    not: 'Ham değer Siemens S7-1200/1500 ölçeğidir (4 mA = 0, 20 mA = 27.648). Başka PLC’lerde aralık farklı olabilir.'
  },
});

/* ---- kaynak/konular/10-sensorler/modeller.js ---- */
/* Sensörler: 3B modeller. Ölçüler mm; sensör ekseni z, aktif yüzey z = 0 (+z hedefe doğru). */
(() => {
  const SN = 5;                  // M18 gömülü tip, standart çelik hedefte (tipik katalog değeri)
  const AL = 0.4;                // alüminyum için malzeme faktörü (tipik; hesaplayıcıyla aynı)
  const UZAK = 12, YAKIN = 1, HIZ = 3;   // hedefin yolu (mm) ve hızı (mm/s)
  const HIST = 0.1;              // histerezis: tipik %10 (IEC 60947-5-2 en çok %20 izin verir)
  const esik = (s) => SN * (s.al ? AL : 1);
  const genlik = (s) => { const t = Math.min(1, Math.max(0, (s.d - 0.5 * esik(s)) / (0.9 * esik(s)))); return t * t * (3 - 2 * t); };

  Object.assign(MODELLER, {
    'enduktif-sensor': {
      aciklama: 'M18 gömülü tip endüktif sensörün 3B modeli: aktif yüzey, ferrit çanak nüve, bobin, osilatör kartı, dişli gövde, somunlar, durum LED’i, M12 konnektör, kablo soketi, braket ve standart hedef.',
      not: 'Hedefi yaklaştır: metal alana girince salınım söner, çıkış açılır ve LED yanar. Hedefi alüminyum seç: aynı çıkış için hedef daha çok yaklaşmalı. Kablo soketine dokununca tel renkleri çıkar.',
      etiketBaslik: 'Kablo uçları (3 telli PNP)',
      etiketler: [
        ['BN', 'Kahverengi: +24 V DC besleme.'],
        ['BU', 'Mavi: 0 V.'],
        ['BK', 'Siyah: çıkış. PNP sensör algılayınca bu uca +24 V verir; PLC girişine bağlanır.']
      ],
      parcalar: [
        ['Aktif yüzey', 'Plastik kapak; manyetik alan buradan çıkar. Gömülü tipte kovanın ucuyla aynı hizadadır. Darbe ve talaş birikmesi en çok bu yüzeye zarar verir.'],
        ['Ferrit çanak nüve', 'Bobinin alanını öne, aktif yüzeye yönlendirir; arkaya ve yanlara taşmasını önler. Gömülü tipin metal içine gömülebilmesi bu yüzdendir.'],
        ['Bobin', 'Osilatörün bobini. Yüksek frekanslı akım, önde değişken bir manyetik alan oluşturur.'],
        ['Osilatör ve değerlendirme kartı', 'Osilatör bobini sürer; değerlendirme devresi salınım genliğini izler. Genlik eşiğin altına inince çıkış transistörü anahtarlar. İç boşluk reçineyle doldurulur (titreşim ve neme karşı).'],
        ['Dişli gövde (M18 × 1)', 'Nikel kaplı pirinç ya da paslanmaz çelik kovan. Diş, montajda mesafe ayarı içindir.'],
        ['Somunlar', 'İki somun braketi arada sıkıştırır; sensörü ileri geri alarak mesafe ayarlanır. Aşırı sıkma dişi ve gövdeyi bozar; katalogdaki sıkma momentine uy.'],
        ['Durum LED’i', 'Çıkış açıkken yanar; halka biçimi her yönden görünür. Arızada ilk bakılacak yer.'],
        ['M12 konnektör', '4 pinli erkek M12 × 1 fiş (A kodlu). Kablo arızasında sensörü sökmeden kablo değiştirilir.'],
        ['Kablo soketi ve kablo', 'Dişi M12 soket, rakor somunu elle sonuna kadar sıkılır; yoksa su girer, IP67 geçerli olmaz.'],
        ['Montaj braketi', 'Sensörü makineye tutar. Gömülü tipte aktif yüzeyin çevresi metal olabilir.'],
        ['Hedef', 'Standart hedef: 1 mm kalın, kenarı aktif yüzey çapı ya da 3 × Sn’den büyük olanı kadar (burada 18 mm) çelik kare plaka. Sn bu hedefle ölçülür.'],
        ['Manyetik alan (gösterim)', 'Bobinin nüveden öne taşan alanı. Alana giren metalde girdap akımları dolaşır, osilatörden enerji çeker; salınım genliği düşer.']
      ],
      kamera: { yon: [0.95, 0.7, 0.75], patlak: [1, 0.5, 0.2] },
      secimdeOdak: true,
      yeni: () => ({ yakin: false, al: false, d: UZAK, cikis: false }),
      dugmeler: (s) => [
        ['hedef', s.yakin ? 'Hedefi uzaklaştır' : 'Hedefi yaklaştır', s.yakin],
        ['malzeme', s.al ? 'Hedef: alüminyum' : 'Hedef: çelik', s.al]
      ],
      olay(s, olay) {
        if (olay === 'hedef') s.yakin = !s.yakin;
        else if (olay === 'malzeme') s.al = !s.al;
      },
      tik(s, dt) {
        const hedef = s.yakin ? YAKIN : UZAK, once = s.d, onceC = s.cikis;
        s.d = hedef < s.d ? Math.max(hedef, s.d - dt * HIZ) : Math.min(hedef, s.d + dt * HIZ);
        if (s.d <= esik(s)) s.cikis = true;
        else if (s.d > esik(s) * (1 + HIST)) s.cikis = false;
        return s.d !== once || s.cikis !== onceC;
      },
      durum(s) {
        const e = esik(s), mal = s.al ? 'Alüminyum' : 'Çelik';
        const bas = `Mesafe ${sayi(s.d, 1)} mm. ${mal} hedefte çalışma mesafesi ≈ ${sayi(e, 1)} mm (Sn ${SN} mm × ${sayi(s.al ? AL : 1)}). `;
        if (!s.cikis) return { metin: bas + 'Salınım sürüyor: çıkış kapalı, LED sönük.' };
        const hist = s.d > e ? ` Histerezis: çıkış ancak ${sayi(e * (1 + HIST), 1)} mm’nin ötesinde kapanır.` : '';
        return { metin: bas + 'Salınım söndü: çıkış açık, LED yanıyor, BK ucunda +24 V (PNP).' + hist };
      },

      kur(y) {
        const T = y.T, TUR = Math.PI * 2;
        const kok = new T.Group();
        const grup = (...n) => { const g = new T.Group(); n.forEach((x) => g.add(x)); return g; };
        const yer = (n, x, yy, z) => { n.position.set(x, yy, z); return n; };
        const kutu = (w, h, d, m, x, yy, z, sec) => yer(y.ag(new T.BoxGeometry(w, h, d), m, sec), x, yy, z);
        const dis = (r0, rTepe, rDip, z0, z1) => {   // dış dişli kovan profili (adım 1 mm), iç çap r0
          const p = [[r0, z0], [rDip + 0.1, z0, 1]];
          for (let z = z0 + 0.5; z < z1; z += 1) { p.push([rTepe, z]); if (z + 0.5 < z1) p.push([rDip, z + 0.5]); }
          return p;
        };
        /* Birbirine değen parçalar arasında 0,05 mm boşluk vardır (kesitte z-fighting olmasın). */

        /* ---- aktif yüzey, nüve, bobin ---- */
        const kapak = grup(yer(y.ag(y.silindir(7.45, 0.8), 'plastikAcik'), 0, 0, -0.4));
        const nuve = grup(y.ag(y.torna([[0, -5.05], [7, -5.05, 1], [7, -0.85, 1], [6, -0.85, 1], [6, -3.85, 1], [2.2, -3.85, 1], [2.2, -0.85, 1], [0, -0.85]]), 'miknatis'));
        const bobin = grup(yer(y.ag(y.halka(2.3, 5.9, 2.9), 'bakir', { esik: 60 }), 0, 0, -2.35),
          ...[1.8, -1.8].map((yy) => y.ag(y.boru([[-2.8, yy, -3.7], [-2.8, yy, -5.3], [-3.2, yy, -6.3]], 0.15, 12), 'bakir', { kenar: false })));

        /* ---- kart: x = −4 … −2,4 düzleminde; elemanlar +x yüzünde (kesitte görünür) ---- */
        const eleman = (w, h, d, m, yy, z) => kutu(w, h, d, m, -2.35 + w / 2, yy, z, { kenar: false });
        const ledRenk = y.malzeme('entegre').clone();   // ayrı malzeme: yalnızca LED’ler renklenir
        const ledAglar = [3.8, -3.8].map((yy) => eleman(0.8, 1.6, 1.2, ledRenk, yy, -46.6));   // kart üstündeki LED’ler
        const kart = grup(
          kutu(1.6, 11.2, 41.5, 'kart', -3.2, 0, -26.75),
          eleman(1.2, 5, 5, 'entegre', 0, -12),                   // osilatör ve değerlendirme entegresi
          eleman(0.8, 1.6, 1, 'celik', 3.6, -10.5), eleman(0.8, 1.6, 1, 'celik', 3.6, -13.5), eleman(0.8, 1, 1.6, 'celik', -3.8, -12),
          eleman(0.6, 1, 2, 'entegre', 3.2, -20), eleman(0.6, 1, 2, 'entegre', -3.2, -20), eleman(0.8, 1.6, 1, 'celik', 0, -24),
          eleman(1.2, 3, 4, 'entegre', -1.5, -36),                // çıkış transistörü
          eleman(0.8, 1.6, 1, 'celik', 2.5, -32), eleman(0.8, 1.6, 1, 'celik', 2.5, -40),
          ...ledAglar
        );

        /* ---- gövde: M18 × 1 dişli kovan, iç çap 15 ---- */
        const govde = grup(y.ag(y.torna(dis(7.5, 9, 8.4, -50, 0).concat([[8.5, 0, 1], [7.5, 0, 1], [7.5, -50]]), 40), 'celik', { esik: 70 }));

        /* ---- somunlar (M18 × 1, anahtar ağzı 24, kalınlık 4) ---- */
        const altigen = new T.Shape();
        for (let k = 0; k < 6; k++) { const a = Math.PI / 6 + (k * Math.PI) / 3, R = 24 / Math.sqrt(3); if (k) altigen.lineTo(R * Math.cos(a), R * Math.sin(a)); else altigen.moveTo(R * Math.cos(a), R * Math.sin(a)); }
        altigen.closePath();
        altigen.holes.push(new T.Path().absarc(0, 0, 9.05, 0, TUR, true));
        const somunGeo = y.cek(altigen, 4, { pah: 0.4 });
        const somunlar = grup(yer(y.ag(somunGeo, 'celik'), 0, 0, -17.95), yer(y.ag(somunGeo, 'celik'), 0, 0, -24.05));

        /* ---- arka: LED halkası, arka kapak ve M12 erkek fiş ---- */
        const ledHalka = yer(y.ag(y.halka(5, 8.5, 3.9), 'plastikAcik'), 0, 0, -52);
        const led = grup(ledHalka);
        const pim = y.silindir(0.5, 4, 16);
        const fis = grup(
          yer(y.ag(y.silindir(8.5, 3.9), 'plastik'), 0, 0, -56),
          y.ag(y.torna(dis(4.6, 6, 5.45, -68, -59).concat([[7, -59, 1], [7, -58.05, 1], [4.6, -58.05, 1], [4.6, -68]]), 40), 'celik', { esik: 70 }),
          yer(y.ag(y.silindir(4.55, 5.9), 'plastik'), 0, 0, -61.1),
          ...[1, 3, 5, 7].map((k) => yer(y.ag(pim, 'bakir', { esik: 60 }), 2.5 * Math.cos((k * Math.PI) / 4), 2.5 * Math.sin((k * Math.PI) / 4), -65.55))
        );

        /* ---- dişi soket ve kablo ---- */
        const tel = (m, uc) => [y.ag(y.boru([[0, -27, -106.5], ...uc.slice(0, 2)], 0.7, 16), m, { kenar: false }), y.ag(y.boru(uc.slice(1), 0.45, 8), 'bakir', { kenar: false })];
        const BN = [[-4, -38, -106], [-6, -44, -105.5], [-6.6, -47, -105.4]], BU = [[0, -39, -107], [0, -45, -107], [0, -48, -107]], BK = [[4, -38, -108], [6, -44, -108.5], [6.6, -47, -108.6]];
        const soket = grup(
          yer(y.ag(y.halka(6.05, 8, 9), 'celik'), 0, 0, -63.55),
          yer(y.ag(y.silindir(4.55, 7.95), 'plastik'), 0, 0, -68.075),
          y.ag(y.torna([[0, -88], [3.5, -88, 1], [3.5, -84, 1], [5, -82, 1], [7.6, -75, 1], [7.6, -68.1, 1], [0, -68.1]]), 'plastik'),
          y.ag(y.boru([[0, 0, -87.5], [0, 0, -96], [0, -3, -102], [0, -12, -105.5], [0, -27, -107]], 2.4, 40), 'kabloSiyah', { kenar: false }),
          ...tel('kabloKahve', BN), ...tel('kabloMavi', BU), ...tel('kabloSiyah', BK)
        );

        /* ---- braket (2 mm sac) ---- */
        const plaka = new T.Shape().moveTo(-16, -27.95).lineTo(16, -27.95).lineTo(16, 16).lineTo(-16, 16).closePath();
        plaka.holes.push(new T.Path().absarc(0, 0, 9.1, 0, TUR, true));
        const braket = grup(yer(y.ag(y.cek(plaka, 2), 'aluminyum'), 0, 0, -21), kutu(32, 2, 32, 'aluminyum', 0, -29, -36));

        /* ---- hedef ve alan (iç gruplar kayar) ---- */
        const plaka18 = kutu(18, 18, 1, y.malzeme('celik').clone(), 0, 0, 0.5);
        const renkCelik = y.malzeme('celik').color.clone(), renkAl = y.malzeme('aluminyum').color.clone();
        const hedefIc = grup(plaka18, kutu(4, 24, 1, 'sac', 0, 21.05, 0.5));
        const hedef = grup(hedefIc);
        const renkAlan = y.malzeme('vurgu').color.clone(), renkSonuk = y.malzeme('sac').color.clone();
        const yay = y.boru(Array.from({ length: 13 }, (_, i) => { const t = (i / 12) * Math.PI; return [3.85 - 2.65 * Math.cos(t), 0, 3 * Math.sin(t)]; }), 0.15, 24);
        const alanIc = grup();
        for (let k = 0; k < 8; k++) { const a = y.ag(yay, 'vurgu', { kenar: false }); a.rotation.z = (k * Math.PI) / 4 + Math.PI / 8; alanIc.add(a); }
        alanIc.position.z = 0.1;
        const alan = grup(alanIc);

        const parcalar = [
          { nesne: kapak, isaret: [-3.5, 0, 0], patlat: [0, 0, 12] },
          { nesne: nuve, isaret: [0, 6.5, -2.5], patlat: [0, 0, 4] },
          { nesne: bobin, isaret: [0, 4, -2.35], patlat: [0, 0, 8] },
          { nesne: kart, isaret: [-2.4, 4.5, -28], patlat: [0, 0, 0] },
          { nesne: govde, isaret: [8.46, -3.08, -29.5], patlat: [0, 28, 0] },
          { nesne: somunlar, isaret: [12, -3, -17.95], patlat: [0, 28, 0] },
          { nesne: led, isaret: [-1.48, 8.37, -52], patlat: [0, 0, -5] },
          { nesne: fis, isaret: [4.25, -7.36, -56], patlat: [0, 0, -10] },
          { nesne: soket, isaret: [7.52, -2.74, -66], patlat: [0, 0, -22] },
          { nesne: braket, isaret: [12, -20, -20], patlat: [0, 0, 0] },
          { nesne: hedef, isaretNesne: hedefIc, isaret: [-5, -5, 1], patlat: [0, 0, 16] },
          { nesne: alan, isaretNesne: alanIc, isaret: [-3.56, -1.47, 3], patlat: [0, 0, 12] }
        ];
        parcalar.forEach((p) => kok.add(p.nesne));

        const etiketYerleri = [[BN, -3.5], [BU, 0], [BK, 3.5]].map(([uc, dx]) => ({ nesne: soket, konum: [uc[2][0] + dx, uc[2][1] - 3.5, uc[2][2]], parca: 8 }));

        return {
          kok,
          parcalar,
          etiketYerleri,
          uygula(s) {
            /* Malzemeler burada okunur: çalışma zamanı her parçaya kendi kopyasını verir. */
            hedefIc.position.z = s.d;
            plaka18.material.color.copy(s.al ? renkAl : renkCelik);
            const g = genlik(s);
            alanIc.scale.z = 0.2 + 0.8 * g;
            alanIc.children[0].material.color.copy(renkSonuk).lerp(renkAlan, g);
            ledHalka.material.color.set(s.cikis ? 0xffc21a : 0xe8e4da);
            ledAglar[0].material.color.set(s.cikis ? 0xffc21a : 0x3a3218);
          }
        };
      }
    }
  });
})();

/* Sıcaklık sensörü: B tipi kafalı, G1/2 bağlantılı, Ø6 kılıflı daldırma sensörü; borudaki akışkana daldırılmış. Ölçüler mm; sensör ekseni y (kafa yukarıda).
   Eleman PT100 (3 telli) ya da K tipi termokupl seçilir. Tablo değerleri: IEC 60751 (PT100), IEC 60584 (K tipi, 0 °C referans). */
(() => {
  const TUR = Math.PI * 2;
  const PT = [[0, 100], [20, 107.79], [100, 138.51], [200, 175.86]];
  const K = [[0, 0], [20, 0.798], [100, 4.096], [200, 8.138]];
  const ara = (tablo, t) => { for (let i = 1; i < tablo.length; i++) if (t <= tablo[i][0] || i === tablo.length - 1) { const [a, fa] = tablo[i - 1], [b, fb] = tablo[i]; return fa + ((fb - fa) * (t - a)) / (b - a); } return 0; };
  const HEDEF = [20, 100, 200];
  const UC = -93, BORU_Y = -75.2;   // kılıf ucu ve DN50 borunun ekseni (y)
  const mA = (t) => 4 + (16 * Math.min(200, Math.max(0, t))) / 200;   // transmitter 0–200 °C → 4–20 mA

  Object.assign(MODELLER, {
    'sicaklik-sensoru': {
      aciklama: 'Daldırma tipi sıcaklık sensörünün 3B modeli: bağlantı kafası ve kapağı, kablo rakoru, kafa transmitteri, proses bağlantısı, koruyucu kılıf, ölçüm elemanı (PT100 ya da termokupl), iç teller, kaynak soketi ve boru.',
      not: 'Boyuna kesit kılıfın içini gösterir. Proses sıcaklığını değiştir: sensör kılıf yüzünden biraz geç yetişir. Elemanı PT100 ile termokupl arasında değiştirip tellere ve uca bak.',
      parcalar: [
        ['Bağlantı kafası', 'Alüminyum B tipi kafa; içinde klemens bloğu ya da transmitter bulunur. Kapak contası suyu dışarıda tutar.'],
        ['Kafa kapağı', 'Vidalıdır; kapak açık bırakılırsa nem girer, ölçüm kayar.'],
        ['Kablo rakoru ve kablo', 'Transmitterin 4–20 mA çıkışı iki telli kabloyla PLC’ye gider.'],
        ['Kafa transmitteri', 'Direnci ya da mV’u 4–20 mA’e çevirir; uzun kabloda sinyal bozulmaz. Termokuplda soğuk uç kompanzasyonunu da yapar.'],
        ['Proses bağlantısı', 'G1/2 diş ve altıgen; boruya kaynatılmış sokete vidalanır.'],
        ['Koruyucu kılıf', 'Paslanmaz çelik. Elemanı basınç ve akışkandan korur ama ısıyı gecikmeli iletir; tepki süresi uzar.'],
        ['Ölçüm elemanı', 'PT100: sıcaklıkla direnci artan platin eleman. Termokupl: iki farklı telin kaynatıldığı uç; sıcaklık farkıyla gerilim üretir.'],
        ['İç teller', 'PT100’de 3 tel: iki kırmızı, bir beyaz (IEC 60751). K tipi termokuplda + yeşil, − beyaz (IEC 60584-3).'],
        ['Kaynak soketi ve boru', 'Kılıf ucu borunun ortasına yakın durmalı; akışkan kılıfın çevresinden akmalı.'],
        ['Akışkan (gösterim)', 'Renk proses sıcaklığını gösterir: mavi soğuk, turuncu sıcak.']
      ],
      kamera: { yon: [1, 0.35, 0.9], patlak: [1, 0.3, 0.8] },
      secimdeOdak: true,
      kesitler: [{ ad: 'boyuna', planlar: [[-1, 0, 0, 0]] }],
      yeni: () => ({ eleman: 'pt', hedef: 20, P: 20, T: 20 }),
      dugmeler: (s) => [
        ['eleman', s.eleman === 'pt' ? 'Eleman: PT100' : 'Eleman: termokupl K', s.eleman === 'tc'],
        ['isi', `Proses: ${s.hedef} °C`, s.hedef !== 20]
      ],
      olay(s, olay) {
        if (olay === 'eleman') s.eleman = s.eleman === 'pt' ? 'tc' : 'pt';
        else if (olay === 'isi') s.hedef = HEDEF[(HEDEF.indexOf(s.hedef) + 1) % HEDEF.length];
      },
      tik(s, dt) {
        const once = s.P + ',' + s.T;
        const yaklas = (v, h, tau) => { const n = v + (h - v) * Math.min(1, dt / tau); return Math.abs(h - n) < 0.05 ? h : n; };
        s.P = yaklas(s.P, s.hedef, 0.4);   // akışkan
        s.T = yaklas(s.T, s.P, 2.5);        // sensör: kılıf yüzünden gecikir (gösterim; gerçekte saniyeler–dakikalar)
        return s.P + ',' + s.T !== once;
      },
      durum(s) {
        const P = sayi(s.P, 0), T = sayi(s.T, 0), akim = sayi(mA(s.T), 1);
        const bas = `Proses ${P} °C, sensör ${T} °C${Math.abs(s.P - s.T) > 1 ? ' (kılıf ısıyı gecikmeli iletiyor)' : ''}. `;
        if (s.eleman === 'pt') return { metin: `${bas}PT100 ≈ ${sayi(ara(PT, s.T), 1)} Ω (0 °C’ta 100 Ω). 3 telli bağlantıda kablo direnci düşülür. Transmitter (0–200 °C) ≈ ${akim} mA.` };
        return { metin: `${bas}Klemens (soğuk uç) 20 °C: K tipi termokupl yalnızca farkı görür, ≈ ${sayi(ara(K, s.T) - ara(K, 20), 2)} mV. Transmitter soğuk ucu ölçüp ekler (soğuk uç kompanzasyonu): ≈ ${akim} mA.` };
      },

      kur(y) {
        const T = y.T;
        const kok = new T.Group();
        const grup = (...n) => { const g = new T.Group(); n.forEach((x) => g.add(x)); return g; };
        const yer = (n, x, yy, z) => { n.position.set(x, yy, z); return n; };
        const dikey = (geo) => geo.rotateX(-Math.PI / 2);   // z eksenli (torna, halka, cek) geometriyi y eksenine çevirir
        const tel = (n, m, r = 0.3) => y.ag(y.boru(n, r, 48), m, { kenar: false });
        /* Birbirine değen parçalar arasında 0,05 mm boşluk vardır (kesitte z-fighting olmasın). */

        /* ---- kafa, kapak, rakor ve kablo ---- */
        const kafa = grup(y.ag(dikey(y.torna([[7.05, 0], [26, 0, 1], [26, 29.95, 1], [23, 29.95, 1], [23, 3, 1], [7.05, 3, 1], [7.05, 0]], 48)), 'aluminyum', { esik: 50 }));
        const kapak = grup(y.ag(dikey(y.torna([[0, 30.05], [26, 30.05, 1], [26, 35, 1], [20, 40], [0, 40]], 48)), 'aluminyum', { esik: 50 }),
          yer(y.ag(new T.CylinderGeometry(2.5, 2.5, 2, 16), 'celik'), 0, 41.05, 0));
        const rakor = grup(yer(y.ag(y.silindir(7, 14, 24).rotateY(Math.PI / 2), 'plastik'), 33.05, 17, 0),
          yer(y.ag(new T.CylinderGeometry(8.5, 8.5, 4, 6).rotateZ(Math.PI / 2), 'plastik'), 28.1, 17, 0),
          tel([[40, 17, 0], [58, 17, 0], [70, 8, 0], [74, -14, 0]], 'kabloGri', 3.5));

        /* ---- kafa transmitteri: 4–20 mA çıkışı rakora gider ---- */
        const transmitter = grup(yer(y.ag(new T.CylinderGeometry(21.5, 21.5, 14, 40), 'plastik', { esik: 60 }), 0, 13, 0),
          ...[0, 1, 2, 3, 4].map((k) => { const a = (k * TUR) / 5; return yer(y.ag(new T.CylinderGeometry(1.8, 1.8, 2, 12), 'celik'), 14 * Math.cos(a), 21.05, 14 * Math.sin(a)); }),
          tel([[14, 22.3, 0], [20, 22.3, 0], [23.5, 17.5, 0], [27, 17, 0]], 'kabloKirmizi', 0.8),
          tel([[4.3, 22.3, 13.3], [15, 22.3, 7], [23.5, 17.5, 1.8], [27, 17, 1.8]], 'kabloSiyah', 0.8));

        /* ---- proses bağlantısı: G1/2 diş, altıgen, boyun (içleri teller için boş) ---- */
        const dis = [[3.05, -48], [9.4, -48, 1]];
        for (let yy = -47.1; yy < -30.6; yy += 1.814) dis.push([10.45, yy], [9.3, yy + 0.907]);
        dis.push([9.4, -30.05, 1], [3.05, -30.05, 1], [3.05, -48]);
        const altigen = new T.Shape();
        for (let k = 0; k < 6; k++) { const a = (k * TUR) / 6, R = 27 / Math.sqrt(3); if (k) altigen.lineTo(R * Math.cos(a), R * Math.sin(a)); else altigen.moveTo(R * Math.cos(a), R * Math.sin(a)); }
        altigen.closePath();
        altigen.holes.push(new T.Path().absarc(0, 0, 3.05, 0, TUR, true));
        const baglanti = grup(y.ag(dikey(y.torna(dis, 40)), 'celik', { esik: 70 }),
          yer(y.ag(dikey(y.cek(altigen, 9.9, { pah: 0.6 })), 'celik'), 0, -25, 0),
          yer(y.ag(dikey(y.halka(3, 7, 19.9, 32)), 'celik'), 0, -10, 0));

        /* ---- koruyucu kılıf: Ø6 × 0,6 boru, yuvarlak kapalı uç ---- */
        const ic = Array.from({ length: 7 }, (_, i) => { const t = (i / 6) * (Math.PI / 2); return [2.4 * Math.cos(t), UC + 3 - 2.4 * Math.sin(t)]; });
        const dis2 = Array.from({ length: 7 }, (_, i) => { const u = (i / 6) * (Math.PI / 2); return [3 * Math.sin(u), UC + 3 - 3 * Math.cos(u)]; });
        const kilif = grup(y.ag(dikey(y.torna([[2.4, -48], ...ic, [0, UC], ...dis2.slice(1), [3, -48, 1], [2.4, -48]], 32)), 'celik', { esik: 50 }));

        /* ---- ölçüm elemanları ve teller (PT100: 3 tel; termokupl: 2 tel ve kaynak ucu) ---- */
        const ptEleman = yer(y.ag(new T.CylinderGeometry(1.4, 1.4, 9, 16), 'plastikAcik'), -0.5, UC + 7, 0);
        const tcUc = yer(y.ag(new T.SphereGeometry(0.9, 16, 12), 'bakir', { kenar: false }), -0.8, UC + 1.8, 0);
        const eleman = grup(ptEleman, tcUc);
        const telYolu = (z, y0) => [[-0.8, y0, z], [-0.8, -55, z], [-0.8, -10, z], [-1.2, 5.9, z * 3]];
        const ptTeller = grup(tel(telYolu(-0.8, UC + 11.7), 'kabloKirmizi'), tel(telYolu(0, UC + 11.7), 'kabloKirmizi'), tel(telYolu(0.8, UC + 11.7), 'plastikAcik'));
        const tcTeller = grup(tel(telYolu(-0.5, UC + 2), 'kabloYesil'), tel(telYolu(0.5, UC + 2), 'plastikAcik'));
        const teller = grup(ptTeller, tcTeller);

        /* ---- DN50 boru (Ø60 × 2,8) ve kaynak soketi; akışkan ---- */
        const boru = grup(yer(y.ag(y.halka(27.2, 30, 70, 64), 'celik', { esik: 50 }), 0, BORU_Y, 0),
          y.ag(dikey(y.torna([[10.55, -47.9], [14, -47.9, 1], [14, -40.05, 1], [10.55, -40.05, 1], [10.55, -47.9]], 40)), 'celik', { esik: 50 }));
        const akiskanAg = yer(y.ag(y.silindir(27.15, 69.9, 64), y.malzeme('kabloMavi').clone(), { kenar: false }), 0, BORU_Y, 0);
        const akiskan = grup(akiskanAg);

        const parcalar = [
          { nesne: kafa, isaret: [0, 15, 26], patlat: [0, 0, 0] },
          { nesne: kapak, isaret: [0, 40, 12], patlat: [0, 40, 0] },
          { nesne: rakor, isaret: [40.05, 17, 5], patlat: [22, 0, 0] },
          { nesne: transmitter, isaret: [0, 13, 21.5], patlat: [0, 24, 0] },
          { nesne: baglanti, isaret: [0, -39.84, 10.45], patlat: [0, 0, 0] },
          { nesne: kilif, isaret: [0, -58, 3], patlat: [0, 0, 0] },
          { nesne: eleman, isaret: [0, UC + 8, 1.4], patlat: [16, 0, 0] },
          { nesne: teller, isaret: [-0.8, -55, 1.1], patlat: [16, 0, 0] },
          { nesne: boru, isaret: [0, -44, 14], patlat: [0, -30, 0] },
          { nesne: akiskan, isaret: [0, BORU_Y - 12, 34.95], patlat: [0, -30, 0] }
        ];
        parcalar.forEach((p) => kok.add(p.nesne));

        const soguk = y.malzeme('kabloMavi').color.clone(), sicak = new T.Color(0xf08a24), elemanRenk = ptEleman.material.color.clone(), kizgin = y.malzeme('kuzey').color.clone();

        return {
          kok,
          parcalar,
          uygula(s) {
            /* Malzemeler burada okunur: çalışma zamanı her parçaya kendi kopyasını verir. */
            const pt = s.eleman === 'pt';
            /* visible ağlara verilir: ışın testi (dokunma, örtülme) üst grubun görünürlüğüne bakmaz. */
            ptEleman.visible = pt; ptTeller.children.forEach((m) => { m.visible = pt; });
            tcUc.visible = !pt; tcTeller.children.forEach((m) => { m.visible = !pt; });
            akiskanAg.material.color.copy(soguk).lerp(sicak, Math.min(1, s.P / 200));
            ptEleman.material.color.copy(elemanRenk).lerp(kizgin, 0.6 * Math.min(1, s.T / 200));
          }
        };
      }
    }
  });
})();

/* ---- kaynak/konular/11-haberlesme/hesaplar.js ---- */
/* Endüstriyel haberleşme: hesaplayıcılar. */
Object.assign(HESAPLAR, {
  seri: {
    gruplar: [
      { k: 'baud', ad: 'Hız (baud)', v: 9600, s: [[9600, '9.600'], [19200, '19.200'], [38400, '38.400'], [115200, '115.200']] },
      { k: 'bit', ad: 'Karakter biçimi', v: 11, s: [[10, '8N1'], [11, '8E1 · 8N2']] },
      { k: 'bayt', ad: 'Mesaj uzunluğu', v: 8, s: [[8, '8 bayt'], [32, '32 bayt'], [256, '256 bayt']] }
    ],
    hesapla(d) {
      const tk = d.bit / d.baud, tm = tk * d.bayt, bps = d.baud / d.bit;
      const t35 = d.baud > 19200 ? 0.00175 : 3.5 * tk;
      return {
        sonuclar: [['Karakter süresi', sayi(tk * 1000, 3) + ' ms'], ['Mesaj süresi', sayi(tm * 1000, 1) + ' ms'], ['Saniyede bayt', '≈ ' + sayi(bps, 0)], ['Modbus boşluğu', sayi(t35 * 1000, 2) + ' ms']],
        adimlar: [`1 karakter = ${d.bit} bit (başlangıç + 8 veri + ${d.bit === 11 ? 'parite ya da 2. stop + stop' : 'stop'})`, `${d.bit} ÷ ${sayi(d.baud)} = ${sayi(tk * 1000, 3)} ms`, `${d.bayt} × ${sayi(tk * 1000, 3)} = ${sayi(tm * 1000, 1)} ms`, d.baud > 19200 ? '19.200 baud üstünde Modbus boşluğu sabit 1,75 ms alınır' : `Modbus boşluğu = 3,5 × ${sayi(tk * 1000, 3)} = ${sayi(t35 * 1000, 2)} ms`]
      };
    },
    not: 'Gerçek süreye cihazın cevap gecikmesi eklenir. Hesap RS-232 ve RS-485 için aynıdır.'
  },

  altag: {
    gruplar: [
      { k: 'c', ad: 'Cihaz IP: 192.168.… (PLC: 192.168.0.10)', v: 1, s: [[1, '0.20'], [2, '1.20'], [3, '0.10'], [4, '0.255']] },
      { k: 'm', ad: 'Alt ağ maskesi', v: 24, s: [[24, '/24 · 255.255.255.0'], [16, '/16 · 255.255.0.0']] }
    ],
    hesapla(d) {
      const ipler = { 1: [192, 168, 0, 20], 2: [192, 168, 1, 20], 3: [192, 168, 0, 10], 4: [192, 168, 0, 255] };
      const plc = [192, 168, 0, 10], cih = ipler[d.c];
      const ag = (ip) => ip.map((o, i) => (i < d.m / 8 ? o : 0)).join('.');
      const ayniAg = ag(plc) === ag(cih);
      const yayin = cih.slice(d.m / 8).every((o) => o === 255);
      const cakisma = cih.join('.') === plc.join('.');
      const durum = cakisma ? 'IP çakışması' : !ayniAg ? 'Farklı ağ' : yayin ? 'Yayın adresi' : 'Uygun';

    hesapla(d) {

        sonuclar: [['Kılavuzdaki gösterim', gosterim], ['Protokol adresi', String(adres)], ['Hex', hex], ['Fonksiyon kodu', kod]],

/* Güç kaynağı ve ölçüm: hesaplayıcılar. */
Object.assign(HESAPLAR, {
  psu: {
    gruplar: [
      { k: 'plc', ad: 'PLC ve I/O kartları', v: 1, s: [[0.5, '0,5 A'], [1, '1 A'], [2, '2 A']] },
      { k: 'sn', ad: 'Sensör sayısı (≈ 25 mA)', v: 10, s: [[5, '5'], [10, '10'], [20, '20'], [40, '40']] },
      { k: 'vl', ad: 'Valf / röle sayısı (≈ 100 mA)', v: 5, s: [[2, '2'], [5, '5'], [10, '10'], [20, '20']] }
    ],
    hesapla(d) {
      const toplam = d.plc + d.sn * 0.025 + d.vl * 0.1;
      const payli = toplam * 1.25;
      const secim = [2.5, 5, 10, 20, 40].find((a) => a >= payli) || 40;
      return {
        sonuclar: [['Toplam akım', sayi(toplam, 2) + ' A'], ['%25 pay ile', sayi(payli, 2) + ' A'], ['Önerilen kaynak', payli > 40 ? '> 40 A: böl' : sayi(secim) + ' A'], ['Kaynak gücü', sayi(secim * 24, 0) + ' W']],
        adimlar: [`${sayi(d.plc)} + ${d.sn} × 0,025 + ${d.vl} × 0,1 = ${sayi(toplam, 2)} A`, `Pay: ${sayi(toplam, 2)} × 1,25 = ${sayi(payli, 2)} A`, `En yakın üst standart değer: ${sayi(secim)} A (${sayi(secim * 24, 0)} W)`]
      };
    },
    not: 'Tüketimler tipiktir; katalog değerlerini kullan. Kapasitif yükler ve motorlu valfler kalkışta daha fazla çeker.'
  },

  dengesizlik: {
    gruplar: [
      { k: 'a', ad: 'L1 akımı', v: 5, s: [[4, '4'], [4.5, '4,5'], [5, '5'], [5.5, '5,5'], [6, '6']] },
      { k: 'b', ad: 'L2 akımı', v: 5, s: [[4, '4'], [4.5, '4,5'], [5, '5'], [5.5, '5,5'], [6, '6']] },
      { k: 'c', ad: 'L3 akımı', v: 4.5, s: [[4, '4'], [4.5, '4,5'], [5, '5'], [5.5, '5,5'], [6, '6']] }
    ],
    hesapla(d) {
      const l = [d.a, d.b, d.c], ort = (d.a + d.b + d.c) / 3;
      const sapma = Math.max(...l.map((x) => Math.abs(x - ort)));
      const yuzde = (100 * sapma) / ort;
      const durum = yuzde <= 5 ? 'İyi' : yuzde <= 10 ? 'Kontrol et' : 'Arıza şüphesi';
      return {
        sonuclar: [['Ortalama', sayi(ort, 2) + ' A'], ['En büyük sapma', sayi(sapma, 2) + ' A'], ['Dengesizlik', '%' + sayi(yuzde, 1)], ['Durum', durum]],
        adimlar: [`Ortalama = (${sayi(d.a)} + ${sayi(d.b)} + ${sayi(d.c)}) ÷ 3 = ${sayi(ort, 2)} A`, `En büyük sapma = ${sayi(sapma, 2)} A`, `Dengesizlik = ${sayi(sapma, 2)} ÷ ${sayi(ort, 2)} × 100 = %${sayi(yuzde, 1)}`]
      };
    },
    not: 'Akım dengesizliği %10’u geçerse şebeke gerilimlerini, bağlantıları ve motor sargılarını kontrol et.'
  },

  izolasyon: {
    gruplar: [
      { k: 'u', ad: 'Devre gerilimi', v: 2, s: [[1, 'SELV/PELV'], [2, '230/400 V'], [3, '690 V']] },
      { k: 'r', ad: 'Ölçülen değer', v: 200, s: [[0.3, '0,3 MΩ'], [0.8, '0,8 MΩ'], [5, '5 MΩ'], [200, '200 MΩ']] }
    ],
    hesapla(d) {
      const [test, min] = { 1: [250, 0.5], 2: [500, 1], 3: [1000, 1] }[d.u];
      const uygun = d.r >= min;
      const yorum = !uygun ? 'Bozuk ya da nemli: kullanma' : d.r < 10 * min ? 'Sınıra yakın: izle' : 'İyi';
      return {
        sonuclar: [['Test gerilimi', sayi(test) + ' V DC'], ['En az', sayi(min) + ' MΩ'], ['Sonuç', uygun ? 'Uygun' : 'Uygun değil'], ['Yorum', yorum]],
        adimlar: [`Devre: ${['', 'SELV/PELV', '230/400 V', '690 V'][d.u]} → ${test} V DC ile ölç`, `IEC 60364-6 alt sınırı: ${sayi(min)} MΩ`, `${sayi(d.r)} MΩ ${uygun ? '≥' : '<'} ${sayi(min)} MΩ → ${uygun ? 'uygun' : 'uygun değil'}`]
      };
    },
    not: 'Tesisat için alt sınırdır. 1 kV altı motor sargısında IEEE 43’e göre en az 5 MΩ beklenir. Yeni kablo ve motorda değer genelde yüzlerce MΩ’dur; düşüş eğilimi tek ölçümden daha anlamlıdır.'
  },
});

/* ---- kaynak/konular/13-pnomatik/hesaplar.js ---- */
/* Pnömatik: hesaplayıcılar. */
Object.assign(HESAPLAR, {
  silindir: {
    gruplar: [
      { k: 'D', ad: 'Piston çapı', v: 50, s: [[20, 'Ø20'], [32, 'Ø32'], [50, 'Ø50'], [63, 'Ø63'], [80, 'Ø80'], [100, 'Ø100']] },
      { k: 'p', ad: 'Çalışma basıncı', v: 6, s: [[4, '4 bar'], [6, '6 bar'], [8, '8 bar']] }
    ],
    hesapla(d) {
      const mil = { 20: 8, 32: 12, 50: 20, 63: 20, 80: 25, 100: 25 }[d.D];
      const A = (Math.PI * d.D * d.D) / 4, Ac = (Math.PI * (d.D * d.D - mil * mil)) / 4;
      const F = d.p * 0.1 * A, Fc = d.p * 0.1 * Ac, Fp = 0.9 * F;
      return {
        sonuclar: [['İtme (teorik)', sayi(F, 0) + ' N'], ['Çekme (teorik)', sayi(Fc, 0) + ' N'], ['İtme (sürtünmeyle)', '≈ ' + sayi(Fp, 0) + ' N'], ['Kütle karşılığı', '≈ ' + sayi(Fp / 9.81, 0) + ' kg']],
        adimlar: [`A = π × ${d.D}² ÷ 4 ≈ ${sayi(A, 0)} mm²`, `F = ${d.p} bar × 0,1 × ${sayi(A, 0)} ≈ ${sayi(F, 0)} N`, `Çekmede mil (Ø${mil}) alanı düşer: ≈ ${sayi(Fc, 0)} N`, 'Hareketli yükte hesaplanan kuvvetin %50–70’ini kullan.']
      };
    },
    not: '1 bar = 0,1 N/mm². Mil çapları tipik ISO 15552 / ISO 6432 değerleridir. Kütle karşılığı dikey ve durağan yük içindir.'
  },

  hava: {
    gruplar: [
      { k: 'D', ad: 'Piston çapı', v: 50, s: [[32, 'Ø32'], [50, 'Ø50'], [63, 'Ø63'], [100, 'Ø100']] },
      { k: 'h', ad: 'Strok', v: 100, s: [[50, '50 mm'], [100, '100 mm'], [200, '200 mm'], [500, '500 mm']] },
      { k: 'n', ad: 'Çevrim / dakika', v: 30, s: [[10, '10'], [30, '30'], [60, '60']] },
      { k: 'p', ad: 'Çalışma basıncı', v: 6, s: [[4, '4 bar'], [6, '6 bar'], [8, '8 bar']] }
    ],
    hesapla(d) {
      const V = (2 * Math.PI * d.D * d.D * d.h) / 4 / 1e6;
      const Vs = V * (d.p + 1), Q = Vs * d.n;
      return {
        sonuclar: [['Bir çevrim', sayi(Vs, 2) + ' Nl'], ['Dakikada', sayi(Q, 0) + ' Nl/dk'], ['Saatte', sayi((Q * 60) / 1000, 1) + ' Nm³/h'], ['Kaçak payıyla', sayi(Q * 1.3, 0) + ' Nl/dk']],
        adimlar: [`Hacim (ileri + geri) = 2 × π × ${d.D}² ÷ 4 × ${d.h} ≈ ${sayi(V, 3)} l`, `Serbest hava = ${sayi(V, 3)} × (${d.p} + 1) ≈ ${sayi(Vs, 2)} Nl`, `${sayi(Vs, 2)} × ${d.n} ≈ ${sayi(Q, 0)} Nl/dk; %30 kaçak ve hortum payı ile ${sayi(Q * 1.3, 0)} Nl/dk`]
      };
    },
    not: 'Çift etkili silindir, mil hacmi ihmal edildi. Kompresörü bütün tüketicilerin toplamına göre seç.'
  },
});

/* Pnömatik: simülasyonlar. */
Object.assign(SIMLER, {
  valf52: {
    not: 'Monostabil valf bobin enerjisi kesilince yayla döner; bistabil valf son konumunu hatırlar. Valf tipini değiştirip havayı kesmeyi de dene.',
    yeni: () => ({ mod: 'mono', y1: false, y2: false, konum: 'a', hava: true, poz: 0 }),
    hesapla(s) {
      if (s.mod === 'mono') s.konum = s.y1 ? 'b' : 'a';
      else if (s.y1 && !s.y2) s.konum = 'b';
      else if (s.y2 && !s.y1) s.konum = 'a';
    },
    tik(s, dt) {
      if (!s.hava) return;
      const hedef = s.konum === 'b' ? 1 : 0, fark = hedef - s.poz;
      s.poz += Math.sign(fark) * Math.min(Math.abs(fark), 0.8 * dt);
    },
    olay(s, o, guncelle) {
      const darbe = (k) => { s[k] = true; this.hesapla(s); setTimeout(() => { s[k] = false; this.hesapla(s); guncelle(); }, 600); };
      if (o === 'y1') { if (s.mod === 'mono') s.y1 = !s.y1; else darbe('y1'); }
      else if (o === 'y2') darbe('y2');
      else if (o === 'hava') s.hava = !s.hava;
      else if (o === 'mod') { s.mod = s.mod === 'mono' ? 'bi' : 'mono'; s.y1 = false; s.y2 = false; }
      this.hesapla(s);
    },
    dugmeler: (s) => s.mod === 'mono'
      ? [['y1', s.y1 ? 'Y1 enerjili · kes' : 'Y1’i enerjile', s.y1], ['hava', s.hava ? 'Havayı kes' : 'Havayı aç', !s.hava], ['mod', 'Valf: monostabil']]
      : [['y1', 'Y1 darbesi', s.y1], ['y2', 'Y2 darbesi', s.y2], ['hava', s.hava ? 'Havayı kes' : 'Havayı aç', !s.hava], ['mod', 'Valf: bistabil']],
    durum(s) {
      const ileri = s.poz >= 0.97, geri = s.poz <= 0.03, hedefIleri = s.konum === 'b';
      if (!s.hava) return { metin: 'Hava kesik: silindir olduğu yerde kalır ve kuvvet uygulamaz. Valf konumu değişse de hareket olmaz.', uyari: true };
      if (hedefIleri && !ileri) return { metin: 'Valf b konumunda: 1→4 basınçlı, 2→3 egzoz. Silindir ileri gidiyor…' };
      if (!hedefIleri && !geri) return { metin: 'Valf a konumunda: 1→2 basınçlı, 4→5 egzoz. Silindir geri dönüyor…' };
      if (s.mod === 'mono') return hedefIleri
        ? { metin: 'Y1 enerjili: silindir ileride, B2 algılıyor. Y1 kesilince yay valfi geri iter ve silindir döner.' }
        : { metin: 'Y1 enerjisiz: yay valfi a konumunda tutar, silindir geride, B1 algılıyor.' };
      return hedefIleri
        ? { metin: 'Y1 darbesi yetti: bistabil valf b konumunu hatırlar. Bobin enerjisizken de silindir ileride kalır.' }
        : { metin: 'Silindir geride, B1 algılıyor. Bistabil valfi ileri almak için Y1’e bir darbe ver.' };
    },
    ciz(s) {
      const px = 46 + s.poz * 100, b = s.konum === 'b', hava = s.hava;
      const basinc = (on) => (hava && on ? '--signal' : '--muted');
      const dx = b ? 60 : 0;
      const kutu = (x, ic) => `<rect x="${x}" y="150" width="60" height="40" style="fill:var(--svg-body);stroke:var(--ink)" stroke-width="1.5"></rect>${ic}`;
      const ok = (x1, y1, x2, y2) => { const a = Math.atan2(y2 - y1, x2 - x1), u = 7; return `<path d="M${x1} ${y1}L${x2} ${y2}" style="stroke:var(--ink)" stroke-width="1.5"></path><path d="M${x2} ${y2}L${(x2 - u * Math.cos(a - 0.4)).toFixed(1)} ${(y2 - u * Math.sin(a - 0.4)).toFixed(1)}L${(x2 - u * Math.cos(a + 0.4)).toFixed(1)} ${(y2 - u * Math.sin(a + 0.4)).toFixed(1)}Z" style="fill:var(--ink)"></path>`; };
      const xa = 131 + dx, xb = 71 + dx;
      const kutuA = kutu(xa, ok(xa + 30, 188, xa + 45, 152) + ok(xa + 15, 152, xa + 5, 188));
      const kutuB = kutu(xb, ok(xb + 30, 188, xb + 15, 152) + ok(xb + 45, 152, xb + 55, 188));
      const bobin = (x, ad, on) => `<rect x="${x}" y="158" width="20" height="24" style="fill:var(${on ? '--accent' : '--card'});stroke:var(--ink)" stroke-width="1.5"></rect><path d="M${x} 182L${x + 20} 158" style="stroke:var(--ink)" stroke-width="1"></path>` + _yazi(x + 10, 150, ad, { a: 'middle', b: 9, w: 600 });
      const yay = (x) => `<path d="M${x} 170l4-8 4 16 4-16 4 16 4-8" style="stroke:var(--ink)" stroke-width="1.5" fill="none"></path>`;
      const sol = bobin(xb - 20, 'Y1', s.y1);
      const sag = s.mod === 'mono' ? yay(xa + 60) : bobin(xa + 60, 'Y2', s.y2);
      const sensor = (x, ad, on) => `<rect x="${x}" y="8" width="22" height="9" rx="2" style="fill:var(--card);stroke:var(--ink)" stroke-width="1.2"></rect><circle cx="${x + 16}" cy="12.5" r="2.6" style="fill:var(${on ? '--accent' : '--line'})"></circle>` + _yazi(x - 4, 16, ad, { a: 'end', b: 9, w: 600 });
      let o = `<svg class="sema" viewBox="0 0 318 236" role="img" aria-label="5/2 valf ve çift etkili silindir simülasyonu">`;
      o += `<rect x="40" y="22" width="150" height="36" rx="3" style="fill:var(--svg-body);stroke:var(--ink)" stroke-width="1.5"></rect>`;
      o += `<rect x="42" y="24" width="${(px - 42).toFixed(1)}" height="32" style="fill:var(--signal);opacity:${hava && b ? 0.22 : 0}"></rect>`;
      o += `<rect x="${(px + 10).toFixed(1)}" y="24" width="${(188 - px - 10).toFixed(1)}" height="32" style="fill:var(--signal);opacity:${hava && !b ? 0.22 : 0}"></rect>`;
      o += `<rect x="34" y="18" width="7" height="44" rx="2" style="fill:var(--chip);stroke:var(--ink)" stroke-width="1.2"></rect><rect x="190" y="18" width="7" height="44" rx="2" style="fill:var(--chip);stroke:var(--ink)" stroke-width="1.2"></rect>`;
      o += `<rect x="${px.toFixed(1)}" y="24" width="10" height="32" rx="2" style="fill:var(--hatch);stroke:var(--ink)" stroke-width="1.2"></rect>`;
      o += `<rect x="${(px + 10).toFixed(1)}" y="35" width="152" height="10" rx="2" style="fill:var(--rail);stroke:var(--ink)" stroke-width="1.2"></rect>`;
      o += sensor(46, 'B1', s.poz <= 0.08) + sensor(146, 'B2', s.poz >= 0.92);
      o += _tel('M52 58V104H146V150', basinc(b), { w: 2.5 }) + _tel('M176 58V150', basinc(!b), { w: 2.5 });
      o += _yazi(140, 146, '4', { a: 'end', b: 9, r: '--muted' }) + _yazi(182, 146, '2', { b: 9, r: '--muted' });
      o += kutuB + kutuA + sol + sag;
      o += _tel('M161 190V214', hava ? '--signal' : '--muted', { w: 2.5 }) + `<path d="M161 214l-7 10h14z" style="fill:var(${hava ? '--signal' : '--muted'})"></path>`;
      o += _tel('M136 190V200M186 190V200', '--ink', { w: 1.5 }) + `<path d="M130 200h12l-6 8zM180 200h12l-6 8z" style="fill:none;stroke:var(--ink)" stroke-width="1.2"></path>`;
      o += _yazi(128, 204, '5', { a: 'end', b: 9, r: '--muted' }) + _yazi(168, 208, '1', { b: 9, r: '--muted' }) + _yazi(196, 204, '3', { b: 9, r: '--muted' });
      o += _yazi(176, 232, hava ? 'hava: 6 bar' : 'hava kesik', { b: 9, w: 600, r: hava ? '--ink' : '--dc-plus' });
      o += _yazi(310, 104, b ? 'b konumu' : 'a konumu', { a: 'end', b: 10, w: 600 });
      return o + '</svg>';
    }
  },
});

/* ---- kaynak/konular/13-pnomatik/modeller.js ---- */
/* Pnömatik: 3B modeller. Ölçüler mm. Silindir ve valf kendi gruplarında kurulur (yerel z ekseni = dünyada +x);
   yerel x dünyada −z’dir, yani yerel −x yüzü kameraya bakar. Kesit düzlemi dünyada z = 0 (yerel x = 0). */
(() => {
  const STROK = 100;               // ISO 15552, Ø32 silindir, strok 100 (tipik)
  const KAYMA = 12;                // makara yolu: ağız aralığı kadar
  const VALF = [64, -80, 0];       // valfin dünyadaki yeri
  /* Valf ağızları (yerel z): 5 | 4 | 1 | 2 | 3 sırasıyla, üstte 4 ve 2, altta 5, 1, 3 (ISO 5599 numaraları). */
  const AGIZ = { 5: -24, 4: -12, 1: 0, 2: 12, 3: 24 };
  const UST = [4, 2], ALT = [5, 1, 3];

  Object.assign(MODELLER, {
    'pnomatik-silindir': {
      aciklama: 'Çift etkili pnömatik silindir ve 5/2 tek bobinli valfin 3B modeli: profil boru, kapaklar, mıknatıslı piston, piston kolu, konum sensörleri, valf gövdesi, makara, bobin ve pilot, yay, susturucular, hortumlar.',
      not: 'Boyuna kesit, valfin makarasını ve silindirin içini gösterir. Y1’e sinyal ver: makara kayar, 1→4 ve 2→3 olur, silindir ileri çıkar. Kırmızı basınçlı hava, mavi egzoz. Valf gövdesine dokununca ağız numaraları çıkar.',
      etiketBaslik: 'Valf ağızları (ISO 5599)',
      etiketler: [
        ['1', 'Besleme: hazırlanmış basınçlı hava (ör. 6 bar).'],
        ['2', 'Çalışma çıkışı. Bobin enerjisizken 1’e bağlıdır; modelde silindirin kol tarafına gider, silindir geride durur.'],
        ['3', 'Egzoz: bobin enerjiliyken 2’deki hava buradan çıkar. Susturucu takılır.'],
        ['4', 'Çalışma çıkışı. Bobin enerjiliyken 1’e bağlıdır; modelde silindirin arka tarafına gider, silindir ileri çıkar.'],
        ['5', 'Egzoz: bobin enerjisizken 4’teki hava buradan çıkar. Susturucu takılır.'],
        ['14', 'Bobin (pilot) tarafı. 14 uyarısı 1’i 4’e bağlayan konuma geçirir.']
      ],
      parcalar: [
        ['Silindir borusu', 'Alüminyum profil (ISO 15552). Üstteki kanala konum sensörleri takılır.'],
        ['Arka kapak', 'Arka hava ağzı buradadır; bu taraf basınçlanınca silindir ileri çıkar. Cıvatalar kapağı boruya sıkar.'],
        ['Ön kapak ve kol yatağı', 'Kol yatağı (burç) kolu yönlendirir, sıyırıcı conta tozu dışarıda tutar. Ön ağız basınçlanınca silindir geri çekilir.'],
        ['Piston', 'İki yanındaki contalar odaları birbirinden ayırır. Ortadaki mıknatıs halka, sensörlerin pistonun yerini görmesini sağlar.'],
        ['Piston kolu', 'Kromlu çelik. Ucundaki dişe bağlantı parçası takılır. Kola yandan yük bindirmek yatağı ve contaları aşındırır.'],
        ['Konum sensörleri (B1, B2)', 'Mıknatıslı pistonu borunun dışından algılar. B1 geri, B2 ileri konumu PLC’ye bildirir; algılayınca LED yanar.'],
        ['Valf gövdesi', 'Ağızlar ve aralarındaki oluklar gövdededir. Makaranın konumu hangi ağızın hangisine bağlanacağını belirler.'],
        ['Makara (sürgü)', 'Üzerindeki conta bilezikleri oluklar arasını kapatır. Bir ağız aralığı kadar kayınca bağlantılar değişir: 1→2 / 4→5 ya da 1→4 / 2→3.'],
        ['Bobin ve pilot (Y1)', 'Bobin küçük bir pilot valfi açar; 1’den gelen hava pilot pistonunu iterek makarayı kaydırır. Pilot valf, besleme havası olmadan çalışmaz. Konnektördeki LED bobin sinyalini gösterir; sarı buton manuel kumandadır.'],
        ['Geri dönüş yayı', 'Bobin enerjisi kesilince makarayı geri iter (monostabil valf). Enerji kesintisinde valf bilinen konuma döner.'],
        ['Susturucular', 'Egzoz havasının sesini azaltır. Tıkanırsa silindir yavaşlar ya da hareket etmez.'],
        ['Hortumlar ve rakorlar', 'Hızlı geçme rakorlar Ø6 hortumu tutar. Hortumu çıkarmak için rakorun halkasına bastır. Renkler basınç durumunu gösterir.'],
        ['Basınçlı hava (gösterim)', 'Kırmızı: beslemeye bağlı, basınçlı. Mavi: egzoza açık. Gri: kapalı ağız.']
      ],
      kamera: { yon: [0.35, 0.5, 1], patlak: [0.3, 0.55, 1] },
      secimdeOdak: true,
      kesitler: [{ ad: 'boyuna', planlar: [[0, 0, -1, 0]] }],
      yeni: () => ({ y1: false, manuel: false, k: 0, p: 0 }),
      dugmeler: (s) => [
        ['y1', s.y1 ? 'Y1: sinyal var' : 'Y1’e sinyal ver', s.y1],
        ['manuel', s.manuel ? 'Manuel buton basılı' : 'Manuel butona bas', s.manuel]
      ],
      olay(s, olay) {
        if (olay === 'y1') s.y1 = !s.y1;
        else if (olay === 'manuel') s.manuel = !s.manuel;
      },
      tik(s, dt) {
        const hedefK = s.y1 || s.manuel ? 1 : 0, onceK = s.k, onceP = s.p;
        /* Hedefe yaklaş, geçme: sınır olarak hedefin kendisi kullanılır (0/1 değil), yoksa hedefte titrer. */
        s.k = hedefK > s.k ? Math.min(hedefK, s.k + dt * 14) : Math.max(hedefK, s.k - dt * 14);
        const hedefP = s.k > 0.5 ? 1 : 0;
        s.p = hedefP > s.p ? Math.min(hedefP, s.p + dt * 0.8) : Math.max(hedefP, s.p - dt * 0.8);
        return s.k !== onceK || s.p !== onceP;
      },
      durum(s) {
        const ileri = s.k > 0.5;
        const valf = ileri ? 'Makara sağda: 1→4, 2→3.' : 'Yay makarayı solda tutuyor: 1→2, 4→5.';
        const sil = s.p >= 1 ? 'Silindir ileride; B2 algılıyor.' : s.p <= 0 ? 'Silindir geride; B1 algılıyor.' : ileri ? 'Arka oda basınçlı, silindir ileri çıkıyor…' : 'Kol tarafı basınçlı, silindir geri çekiliyor…';
        if (s.manuel) return { metin: `Manuel buton basılı: valf elektrik olmadan konum değiştirdi (besleme havası gerekir). ${valf} ${sil} Arızada valfi elektrikten ayırmak için kullanılır; silindir beklenmedik hareket eder, önce çevreyi kontrol et.`, uyari: true };
        return { metin: `${s.y1 ? 'Y1 enerjili.' : 'Y1 enerjisiz.'} ${valf} ${sil}` };
      },

      kur(y) {
        const T = y.T, TUR = Math.PI * 2;
        const kok = new T.Group();
        const grup = (...n) => { const g = new T.Group(); n.forEach((x) => g.add(x)); return g; };
        const yer = (n, x, yy, z) => { n.position.set(x, yy, z); return n; };
        const kutu = (w, h, d, m, x, yy, z, sec) => yer(y.ag(new T.BoxGeometry(w, h, d), m, sec), x, yy, z);
        const dikey = (r, u, b = 24) => y.silindir(r, u, b).rotateX(Math.PI / 2);   // yerel y ekseninde silindir
        const altigen = (r, u) => new T.CylinderGeometry(r, r, u, 6);               // y ekseninde altıgen
        const eksende = (g) => { g.rotation.y = Math.PI / 2; return g; };            // yerel z → dünya +x
        const kesitli = (n) => new T.Shape(n.map(([z, yy]) => new T.Vector2(-z, yy)));
        const xBoyunca = (sekil, d) => new T.ExtrudeGeometry(sekil, { depth: d, bevelEnabled: false }).rotateY(Math.PI / 2).translate(-d / 2, 0, 0);   // (z, y) profili x boyunca, x = 0’a ortalı
        const malzemeKopya = (ad) => y.malzeme(ad).clone();
        /* Birbirine değen parçalar arasında 0,05 mm boşluk vardır (kesitte z-fighting olmasın). */

        /* ================= SİLİNDİR (yerel z ekseni) ================= */
        const profil = new T.Shape().moveTo(2, 22.5).lineTo(17.5, 22.5).quadraticCurveTo(22.5, 22.5, 22.5, 17.5).lineTo(22.5, -17.5).quadraticCurveTo(22.5, -22.5, 17.5, -22.5)
          .lineTo(-17.5, -22.5).quadraticCurveTo(-22.5, -22.5, -22.5, -17.5).lineTo(-22.5, 17.5).quadraticCurveTo(-22.5, 22.5, -17.5, 22.5).lineTo(-2, 22.5).lineTo(-2, 19.5).lineTo(2, 19.5).closePath();
        profil.holes.push(new T.Path().absarc(0, 0, 16, 0, TUR, true));
        const boru = grup(yer(y.ag(y.cek(profil, 127.9), 'aluminyum', { esik: 50 }), 0, 0, 64));

        const kapakSekli = (delik) => { const s = y.yuvarlakDikdortgen(45, 45, 5); if (delik) s.holes.push(new T.Path().absarc(0, 0, delik, 0, TUR, true)); return s; };
        const civata = (z) => [[-1, -1], [1, -1], [-1, 1], [1, 1]].map(([a, b]) => yer(y.ag(y.silindir(3, 3, 16), 'celik'), a * 16.25, b * 16.25, z));
        const rakor = (x, yy, z, asagi) => {   // hızlı geçme rakor: altıgen gövde + halka; asagi: ağız −y’ye bakar
          const d = asagi ? -1 : 1;
          return [yer(y.ag(altigen(7, 4), 'celik'), x, yy + d * 2.05, z), yer(y.ag(dikey(5, 6), 'celik'), x, yy + d * 7.1, z), yer(y.ag(dikey(5.5, 2), 'plastik'), x, yy + d * 11.15, z)];
        };
        const arkaKapak = grup(yer(y.ag(y.cek(kapakSekli(0), 21.95, { pah: 1 }), 'aluminyum'), 0, 0, -11.025), ...civata(-23.55));
        const onKapak = grup(yer(y.ag(y.cek(kapakSekli(6.05), 21.95, { pah: 1 }), 'aluminyum'), 0, 0, 139.025), ...civata(151.55),
          yer(y.ag(y.halka(6.05, 11, 6), 'bakir'), 0, 0, 153.05), yer(y.ag(y.halka(6.05, 8, 1), 'plastik'), 0, 0, 156.6));
        const silRakorlar = [...rakor(0, -22.5, -11, true), ...rakor(0, -22.5, 139, true)];

        /* Piston ve kol iç gruplarda kayar (geride z = 1, ileride z = 101). */
        const pistonIc = grup(
          yer(y.ag(y.halka(6.05, 15.95, 4.9), 'plastik'), 0, 0, 2.5),
          yer(y.ag(y.halka(6.05, 12, 7.9), 'aluminyum'), 0, 0, 9),
          yer(y.ag(y.halka(12.05, 15.9, 7.9), 'miknatis'), 0, 0, 9),
          yer(y.ag(y.halka(6.05, 15.95, 4.9), 'plastik'), 0, 0, 15.5)
        );
        const kolIc = grup(
          y.ag(y.torna([[0, 0], [6, 0, 1], [6, 159, 1], [5, 159, 1], [5, 178.5, 1], [4.5, 179, 1], [0, 179]], 32), 'celik', { esik: 50 }),
          yer(y.ag(altigen(9.8, 6).rotateX(Math.PI / 2), 'celik'), 0, 0, 164)
        );
        const piston = grup(pistonIc), kol = grup(kolIc);

        const sensorLed = [malzemeKopya('entegre'), malzemeKopya('entegre')];
        const sensor = (z, led) => [kutu(3.9, 2.9, 25, 'plastik', 0, 21, z), kutu(2.4, 0.5, 3, led, 0, 22.75, z + 9, { kenar: false }),
          y.ag(y.boru([[0, 22, z + 12.4], [0, 28, z + 16], [0, 40, z + 18]], 1.4, 16), 'kabloSiyah', { kenar: false })];
        const sensorler = grup(...sensor(14, sensorLed[0]), ...sensor(106, sensorLed[1]));
        const silG = eksende(grup(boru, arkaKapak, onKapak, piston, kol, sensorler, ...silRakorlar));

        /* ================= VALF (yerel z ekseni; derinlik yerel x) ================= */
        /* Gövde: orta katman oluk ve kanallarıyla parçalar hâlinde, önde ve arkada kapak levhası. Delik yarıçapı 5, oluk derinliği 2. */
        const parca = (z0, z1, ust, oluk) => {
          const d = ust ? 1 : -1, n = [[z0, 5 * d]];
          if (oluk) n.push([oluk[0], 5 * d], [oluk[0], 7 * d], [oluk[1], 7 * d], [oluk[1], 5 * d]);
          n.push([z1, 5 * d], [z1, 12 * d], [z0, 12 * d]);
          return y.ag(xBoyunca(kesitli(ust ? n : n.reverse()), 11.9), 'aluminyum', { esik: 50 });
        };
        const valfGovde = grup(
          parca(-45, -15, true, [-27, -21]), parca(-9, 9, true, [-3, 3]), parca(15, 45, true, [21, 27]),
          parca(-45, -27, false), parca(-21, -3, false, [-15, -9]), parca(3, 21, false, [9, 15]), parca(27, 45, false),
          kutu(4.95, 24, 90, 'aluminyum', 8.525, 0, 0), kutu(4.95, 24, 90, 'aluminyum', -8.525, 0, 0)
        );
        const valfRakorlar = [...UST.flatMap((a) => rakor(0, 12, AGIZ[a], false)), ...rakor(0, -12, AGIZ[1], true)];

        /* Makara: mil, conta bilezikleri, sol uçta pilot pistonu, sağ uçta yay tablası. */
        const makaraG = grup(
          yer(y.ag(y.silindir(3, 107, 24), 'celik'), 0, 0, -12.5),                                      // mil: z −66 … 41
          ...[-30, -6, 18, 30].map((z) => yer(y.ag(y.silindir(4.95, 6, 32), 'plastik'), 0, 0, z)),     // conta bilezikleri
          yer(y.ag(y.silindir(9, 4, 32), 'celik'), 0, 0, -64.5),                                        // pilot pistonu
          yer(y.ag(y.silindir(4.5, 1, 24), 'celik'), 0, 0, 40.5)                                        // yay tablası
        );
        const makara = grup(makaraG);

        const bobinLed = malzemeKopya('entegre');
        const pilot = grup(
          kutu(22, 24, 29.9, 'plastik', 0, 0, -60.05),
          kutu(18, 12, 18, 'plastikAcik', 0, 18.05, -62), kutu(4, 3, 3, bobinLed, -9.05, 18, -57, { kenar: false }),
          yer(y.ag(y.silindir(3.5, 3, 24).rotateY(Math.PI / 2), 'vurgu'), -12.55, -5, -52),
          y.ag(y.boru([[5, 18, -71.05], [14, 18, -80], [24, 10, -90]], 2.5, 16), 'kabloSiyah', { kenar: false })   // kablo arkaya (dünyada −z) çıkar
        );
        const yayAg = yer(y.ag(y.helis(3.4, 0.45, 26.4, 7), 'celik', { kenar: false }), 0, 0, 41.5);
        const yay = grup(kutu(22, 24, 24.9, 'plastik', 0, 0, 57.5), yayAg);
        const susturucu = (z) => [yer(y.ag(dikey(4.5, 13, 16), 'bakir', { esik: 60 }), 0, -21.6, z), yer(y.ag(altigen(6, 3), 'celik'), 0, -13.55, z)];
        const susturucular = grup(...susturucu(AGIZ[5]), ...susturucu(AGIZ[3]));
        const valG = eksende(grup(valfGovde, makara, pilot, yay, susturucular, ...valfRakorlar));
        valG.position.set(...VALF);

        /* ================= HORTUMLAR (dünya koordinatı) ================= */
        const [vx, vy] = VALF;
        const hortum = (m, n) => y.ag(y.boru(n, 3, 48), m, { kenar: false });
        const h4 = hortum(malzemeKopya('kabloSiyah'), [[vx + AGIZ[4], vy + 24, 0], [vx + AGIZ[4] - 2, vy + 34, 0], [22, -44, 0], [-8, -46, 0], [-11, -35, 0]]);
        const h2 = hortum(malzemeKopya('kabloSiyah'), [[vx + AGIZ[2], vy + 24, 0], [vx + AGIZ[2] + 2, vy + 34, 0], [108, -44, 0], [136, -46, 0], [139, -35, 0]]);
        const h1 = hortum(malzemeKopya('kabloSiyah'), [[vx, vy - 24, 0], [vx, vy - 40, 0], [vx - 20, vy - 50, 0], [vx - 60, vy - 52, 0]]);
        const hortumlar = grup(h4, h2, h1);

        /* ================= BASINÇLI HAVA (gösterim) ================= */
        const havaMalzeme = () => malzemeKopya('sac');
        const arkaOda = y.ag(y.silindir(15.85, 1, 32), havaMalzeme(), { kenar: false });
        const onOda = y.ag(y.halka(6.1, 15.85, 1, 32), havaMalzeme(), { kenar: false });
        const silHava = eksende(grup(arkaOda, onOda));
        const kanal = {};
        [...UST, ...ALT].forEach((a) => { kanal[a] = kutu(11.8, 6.9, 5.9, havaMalzeme(), 0, (UST.includes(a) ? 1 : -1) * 8.5, AGIZ[a], { kenar: false }); });
        const valHava = eksende(grup(...Object.values(kanal)));
        valHava.position.set(...VALF);
        const hava = grup(silHava, valHava);

  if (!durum.sim[tur]) { const S = SIMLER[tur]; durum.sim[tur] = S.yeni(); if (S.hesapla) S.hesapla(durum.sim[tur]); }

};
const simDugmeler = (tur, s) => SIMLER[tur].dugmeler(s).map(([o, e, b]) =>
  `<button type="button" class="dugme dugme-kucuk" data-sim-tur="${tur}" data-sim-olay="${o}"${b == null ? '' : ` aria-pressed="${!!b}"`}>${esc(e)}</button>`).join('');

  const S = SIMLER[tur];

      <div id="sim-${tur}-c">${S.ciz(s)}</div>
      <div class="sim-durum${d.uyari ? ' uyari' : ''}" id="sim-${tur}-d"${S.tik ? '' : ' aria-live="polite"'}>${esc(d.metin)}</div>
      <div class="dugme-satir" id="sim-${tur}-b">${simDugmeler(tur, s)}</div>

}
function simGuncelle(tur) {
  const S = SIMLER[tur], s = simDurum(tur);

  if (!c) return;
  c.innerHTML = S.ciz(s);
  const d = S.durum(s), de = document.getElementById(`sim-${tur}-d`);
  if (de.textContent !== d.metin) de.textContent = d.metin;
  de.classList.toggle('uyari', !!d.uyari);
  const be = document.getElementById(`sim-${tur}-b`), yeni = simDugmeler(tur, s);
  if (be.dataset.son !== yeni) {
    const odak = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.simOlay : null;
    be.innerHTML = yeni;

/* ---------- Başlık yazımı ----------
   Veride başlıklar cümle düzeninde yazılır; burada bir kez baslikYaz ile dönüştürülür (arama dizini de bunu görür).
   Başlık sayılanlar: konu, filtre, alt başlık ve sayfa adları, bölüm başlıkları ve çipleri, kart ve örnek başlıkları,
   şema işaret adları, “Birlikte kullanılır” listeleri, hesaplayıcı grup adları, model parça adları, metin sayfası başlıkları. */
(() => {
  const B = baslikYaz;
  VERI.konular.forEach((k) => {
    k.ad = B(k.ad);
    (k.filtreler || []).forEach((f) => { f.ad = B(f.ad); });

  });
  Object.values(VERI.sayfalar).forEach((s) => {
    s.baslik = B(s.baslik);
    s.bolumler.forEach((b) => {
      b.baslik = B(b.baslik);
      b.kisa = B(b.kisa);
      b.bloklar.forEach((k) => {
        if (k.baslik) k.baslik = B(k.baslik);
        if (k.ornek) k.ornek.baslik = B(k.ornek.baslik);
        if (k.kartlar) k.kartlar.forEach((c) => { c.baslik = B(c.baslik); });
        if (k.isaretler) k.isaretler.forEach((i) => { i[0] = B(i[0]); });
        if (k.tip === 'parcalar') k.parcalar = k.parcalar.map(B);
      });
    });
  });
  Object.values(HESAPLAR).forEach((h) => (h.gruplar || []).forEach((g) => { g.ad = B(g.ad); }));
  Object.values(MODELLER).forEach((m) => {
    m.parcalar.forEach((p) => { p[0] = B(p[0]); });
    if (m.etiketBaslik) m.etiketBaslik = B(m.etiketBaslik);
  });
  Object.values(METINLER).forEach((m) => {
    m.baslik = B(m.baslik);
    m.bolumler.forEach((b) => { b[0] = B(b[0]); });
  });
})();

/* ---------- Arama dizini ---------- */
const KATLA = { 'ı': 'i', 'ş': 's', 'ğ': 'g', 'ü': 'u', 'ö': 'o', 'ç': 'c', 'â': 'a', 'î': 'i', 'û': 'u', '–': '-', '—': '-', '−': '-', '’': "'" };
function katla(s) {
  s = String(s);
  let o = '';
  for (let i = 0; i < s.length; i++) {
    let l = s[i].toLocaleLowerCase('tr-TR');
    if (l.length !== 1) l = l[0];
    o += KATLA[l] || l;
  }
  return o;
}
function blokMetni(b) {
  const p = [];
  const ekle = (...x) => x.forEach((y) => { if (y) p.push(Array.isArray(y) ? y.join(' ') : y); });
  switch (b.tip) {
    case 'sema': (b.lejant || []).forEach((l) => ekle(l[1])); (b.isaretler || []).forEach((i) => ekle(i)); ekle(b.not); break;
    case 'kartlar': b.kartlar.forEach((k) => ekle(k.baslik, k.etiket, k.metin)); break;
    case 'aralik': ekle(b.baslik, b.eksen); b.satirlar.forEach((r) => ekle(r.ad + ' ' + sayi(r.bas) + '–' + sayi(r.son), r.metin)); ekle(b.not); break;
    case 'formul': ekle(b.formul); b.tanimlar.forEach((t) => ekle(t)); if (b.ornek) { ekle(b.ornek.baslik); b.ornek.satirlar.forEach((t) => ekle(t)); } ekle(b.kural); break;
    case 'tablo': b.satirlar.forEach((r) => ekle(r[0], r[2])); break;
    case 'hesap': if (HESAPLAR[b.tur]) { ekle(HESAPLAR[b.tur].gruplar.map((g) => g.ad).join(', ')); ekle(HESAPLAR[b.tur].not); } break;
    case 'ariza': ekle('Belirti: ' + b.belirti); b.satirlar.forEach((r) => ekle(r)); break;
    case 'hatalar': b.hatalar.forEach((r) => ekle(r)); break;
    case 'parcalar': ekle(b.parcalar.join(', ')); break;
    case 'not': ekle(b.metin); break;
    case 'renkler': b.satirlar.forEach((r) => ekle(r[0] + ' ' + r[2])); break;
    case 'sim': ekle('Simülasyon'); if (SIMLER[b.tur]) ekle(SIMLER[b.tur].not); break;
    case 'model': ekle('3B model'); if (MODELLER[b.tur]) { ekle(MODELLER[b.tur].aciklama); MODELLER[b.tur].parcalar.forEach((x) => ekle(x)); } break;
    case 'adimlar': b.satirlar.forEach((m) => ekle(m)); break;
  }
  return p.join(' · ');
}
const DIZIN = [];
VERI.konular.forEach((k) => k.altlar.forEach((a) => {
  const s = sayfaOf(a);
  if (!s) {
    const m = a.ad + ' · ' + a.alt;
    DIZIN.push({ alt: a, bolum: null, bolumAd: null, metin: m, katli: katla(m) });
    return;
  }
  const bm = [s.baslik, a.alt, s.giris].concat(s.etiketler || []).join(' · ');
  DIZIN.push({ alt: a, bolum: null, bolumAd: null, metin: bm, katli: katla(bm) });
  s.bolumler.forEach((b) => {
    const m = [b.baslik].concat(b.bloklar.map(blokMetni)).join(' · ');
    DIZIN.push({ alt: a, bolum: b.id, bolumAd: b.kisa, metin: m, katli: katla(m) });
  });
}));
/* Arama ekranındaki parça çipleri: konu ve sayfa sırasıyla, tekrarsız. */
const TUM_PARCALAR = Array.from(new Set(hazirlar().map(sayfaOf).flatMap((s) => s.bolumler.flatMap((b) => b.bloklar.filter((x) => x.tip === 'parcalar').flatMap((x) => x.parcalar)))));
const aramaTerimi = (p) => p.replace(/\s*\(.*\)\s*$/, '');

function ara(q) {
  const terimler = katla(q.trim()).split(/\s+/).filter((t) => t.length > 0);
  if (!terimler.length || katla(q.trim()).length < 2) return { terimler, sonuclar: [] };
  const gorulen = new Map();
  DIZIN.forEach((d) => {
    if (!terimler.every((t) => d.katli.includes(t))) return;
    const var_ = gorulen.get(d.alt.id);
    if (!var_) gorulen.set(d.alt.id, d);
  });
  const sonuclar = Array.from(gorulen.values()).sort((x, y) => (hazirMi(y.alt) ? 1 : 0) - (hazirMi(x.alt) ? 1 : 0));
  return { terimler, sonuclar };
}
function vurgula(metin, terimler) {
  const k = katla(metin);
  const araliklar = [];
  terimler.forEach((t) => {
    if (!t) return;
    let i = k.indexOf(t);
    while (i !== -1) { araliklar.push([i, i + t.length]); i = k.indexOf(t, i + t.length); }
  });
  if (!araliklar.length) return esc(metin);
  araliklar.sort((a, b) => a[0] - b[0]);
  const birlesik = [araliklar[0].slice()];
  araliklar.slice(1).forEach((r) => { const s = birlesik[birlesik.length - 1]; if (r[0] <= s[1]) s[1] = Math.max(s[1], r[1]); else birlesik.push(r.slice()); });
  let o = '', son = 0;
  birlesik.forEach(([a, b]) => { o += esc(metin.slice(son, a)) + '<mark>' + esc(metin.slice(a, b)) + '</mark>'; son = b; });
  return o + esc(metin.slice(son));
}
function kesit(metin, terim) {
  const i = katla(metin).indexOf(terim);
  if (i < 0 || metin.length <= 140) return metin;
  let bas = Math.max(0, i - 45);
  if (bas > 0) { const b = metin.indexOf(' ', bas); if (b !== -1 && b < i) bas = b + 1; }
  let bit = Math.min(metin.length, i + 110);
  if (bit < metin.length) { const b = metin.lastIndexOf(' ', bit); if (b > i) bit = b; }
  return (bas > 0 ? '…' : '') + metin.slice(bas, bit) + (bit < metin.length ? '…' : '');
}

/* ---------- Premium (Google Play Faturalandırma) ---------- */
const PREMIUM = {
  aktif: DEPO.oku('premium', false) === true,
  servis: null,
  fiyat: null,
  ayarla(v) { this.aktif = !!v; DEPO.yaz('premium', this.aktif); },
  async baslat() {
    if (!('getDigitalGoodsService' in window)) return;
    try { this.servis = await window.getDigitalGoodsService('https://play.google.com/billing'); } catch (e) { this.servis = null; return; }
    if (!this.servis) return;
    try {
      const d = await this.servis.getDetails([UYGULAMA.premium.urun]);
      if (d && d[0] && d[0].price) this.fiyat = new Intl.NumberFormat('tr-TR', { style: 'currency', currency: d[0].price.currency }).format(Number(d[0].price.value));
    } catch (e) { /* fiyat okunamadı */ }
    await this.geriYukle(true);
  },
  async geriYukle(sessiz) {
    if (!this.servis) { if (!sessiz) bildir('Geri yükleme yalnızca Google Play sürümünde çalışır.'); return false; }
    try {
      const liste = await this.servis.listPurchases();
      const var_ = liste.some((p) => p.itemId === UYGULAMA.premium.urun);
      if (var_ || !sessiz) this.ayarla(var_);
      if (!sessiz) bildir(var_ ? 'Premium geri yüklendi' : 'Bu hesapta Premium satın alımı bulunamadı');
      return var_;
    } catch (e) {
      if (!sessiz) bildir('Satın almalar okunamadı. İnternet bağlantını kontrol et.');
      return false;
    }
  },
  async satinAl() {
    if (!this.servis || !window.PaymentRequest) { bildir('Satın alma yalnızca Google Play’den yüklenen uygulamada yapılabilir.'); return false; }
    try {
      const istek = new PaymentRequest(
        [{ supportedMethods: 'https://play.google.com/billing', data: { sku: UYGULAMA.premium.urun } }],
        { total: { label: 'Toplam', amount: { currency: 'TRY', value: '0' } } }
      );
      const yanit = await istek.show();
      const kod = yanit.details && yanit.details.purchaseToken;
      let gecerli = !!kod;
      if (gecerli && UYGULAMA.premium.dogrulamaAdresi) {
        try {
          const r = await fetch(UYGULAMA.premium.dogrulamaAdresi, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ urun: UYGULAMA.premium.urun, purchaseToken: kod }) });
          gecerli = r.ok;
        } catch (e) { gecerli = false; }
      }
      await yanit.complete(gecerli ? 'success' : 'fail');
      if (gecerli) { this.ayarla(true); bildir('Premium açıldı. Teşekkürler.'); }
      else bildir('Satın alma doğrulanamadı. Biraz sonra “Satın alımı geri yükle”yi dene.');
      return gecerli;
    } catch (e) {
      if (e && e.name === 'AbortError') return false;
      bildir('Satın alma tamamlanamadı.');
      return false;
    }
  }
};
const kilitli = (a) => !!(UYGULAMA.premium.kilit && !PREMIUM.aktif && a && !VERI.ucretsiz.includes(a.id));

function temaUygula() {

/* ---------- Yönlendirme ---------- */
let rota = null;
let onceki = 'ana';
let bekleyenBolum = null;
let ilkCizim = true;
function rotaCoz(t) {
  t = String(t || '').replace(/^#/, '');
  if (!t || t === 'ana') return 'ana';
  if (['ara', 'kaydedilenler', 'ayarlar', 'premium', 'hakkinda'].includes(t) || METINLER[t]) return t;
  if (KONU[t]) return t;
  if (ALT[t] && hazirMi(ALT[t])) {
    if (kilitli(ALT[t])) { durum.premiumHedef = t; return 'premium'; }
    return t;
  }
  return 'ana';
}
function git(hedef, bolum) {
  const t = rotaCoz(hedef);
  bekleyenBolum = bolum || null;
  let hashDegisti = false;
  try {
    if (location.hash.replace(/^#/, '') !== t) { location.hash = t; hashDegisti = true; }
  } catch (e) { hashDegisti = false; }
  if (!hashDegisti) ciz(t);
  else setTimeout(() => { if (rota !== t) ciz(t); }, 80);
}
window.addEventListener('hashchange', () => {
  let t = 'ana';
  try { t = rotaCoz(location.hash); } catch (e) { /* yok say */ }
  if (t !== rota) ciz(t);
});

function ciz(t, secenek) {
  const koru = secenek && secenek.koru;
  if (rota && rota !== t) onceki = rota;
  rota = t;
  const app = $('#uygulama');
  const y = window.scrollY;
  let html;
  if (t === 'ara') html = aramaEkrani();
  else if (t === 'kaydedilenler') html = kayitEkrani();
  else if (t === 'ayarlar') html = ayarlarEkrani();
  else if (t === 'premium') html = premiumEkrani();
  else if (t === 'hakkinda') html = hakkindaEkrani();
  else if (METINLER[t]) html = metinEkrani(t);
  else if (KONU[t]) html = konuEkrani(KONU[t]);
  else if (ALT[t]) html = bilgiSayfasi(ALT[t]);
  else html = anaSayfa();
  modelleriTemizle();
  app.innerHTML = html;
  menuGuncelle();
  aktifBolum = null;
  if (ALT[t]) sayfaAcildi(ALT[t]);
  if (koru) {
    window.scrollTo(0, y);
  } else if (bekleyenBolum && ALT[t]) {
    const hedef = bekleyenBolum;
    requestAnimationFrame(() => bolumeGit(hedef, false));
  } else {
    window.scrollTo(0, 0);
  }
  bekleyenBolum = null;
  if (!koru && !ilkCizim) {
    if (t === 'ara') { const g = $('#arama-kutusu'); if (g) g.focus({ preventScroll: true }); }
    else { const h = app.querySelector('h1'); if (h) h.focus({ preventScroll: true }); }
  }
  ilkCizim = false;
  kaydirmaIzle();
  simSaatiKur();
  modelleriKur();
}

function menuGuncelle() {
  const aktif = rota === 'ara' ? 'ara' : rota === 'kaydedilenler' ? 'kaydedilenler' : (rota === 'ana' || KONU[rota] || ALT[rota]) ? 'konular' : '';
  $$('[data-menu]').forEach((b) => {
    if (b.dataset.menu === aktif) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
}

/* ---------- Ekranlar ---------- */
function anaSayfa() {

function devamKarti() {
  let a = durum.son && ALT[durum.son.sayfa];
  let devam = !!(a && hazirMi(a));
  if (!devam) a = hazirlar()[0];
  if (!a) return '';
  const s = sayfaOf(a);
  const toplam = s.bolumler.length;
  let bi = 0;
  if (devam) bi = Math.max(0, s.bolumler.findIndex((b) => b.id === durum.son.bolum));
  const okunan = devam ? Math.min(toplam, Math.max(bi, Number(durum.ilerleme[a.id]) || 0) + 1) : 0;
  const alt = devam ? `${a.konu.ad} · ${s.bolumler[bi].kisa} bölümünden devam et` : `${a.konu.ad} · ${toplam} bölüm`;
  const seg = s.bolumler.map((b, i) => `<span class="${i < okunan ? 'dolu' : ''}"></span>`).join('');
  return `
    <button type="button" class="panel" data-git="${a.id}"${devam ? ` data-hedef-bolum="${s.bolumler[bi].id}"` : ''}>
      <span class="panel-ust"><span class="panel-etiket">${devam ? 'Kaldığın Yer' : 'Buradan Başla'}</span><span class="panel-sayac">${okunan} / ${toplam} bölüm</span></span>
      <span><span class="panel-baslik" style="display:block">${esc(s.baslik)}</span><span class="panel-alt" style="display:block">${esc(alt)}</span></span>
      <span class="ilerleme" style="grid-template-columns:repeat(${toplam},minmax(0,1fr))" aria-hidden="true">${seg}</span>
    </button>`;
}

/* Ana sayfa kartı: yalnızca sembol ve konu adı (özet ve sayaç konu ekranında ve aramada kalır). */
function konuKarti(k) {
  return `
    <button type="button" class="konu-kart" data-git="${k.id}">

function altSatiri(a, yolGoster) {
  const h = hazirMi(a);
  const ic = `<span class="kod${h ? ' hazir' : ''}">${esc(a.kod)}</span>
    <span class="satir-metin">${yolGoster ? `<span class="sonuc-yol">${esc(a.konu.ad)}</span>` : ''}<span class="satir-ad">${esc(a.ad)}</span><span class="satir-alt">${esc(a.alt)}</span></span>`;

    : `<div class="satir">${ic}<span class="rozet">Hazırlanıyor</span></div>`;

function konuEkrani(k) {

    : '';

    ${filtreler}
    <div class="liste">
      <span class="ust">${altlar.length} alt başlık</span>
      ${altlar.map((a) => altSatiri(a, false)).join('')}
    </div>`;
}

function bilgiSayfasi(a) {
  const s = sayfaOf(a);
  const kayitli = durum.kayitli.includes(a.id);
  return `
    <div class="ust-cubuk" id="ust-cubuk">

        <button type="button" class="ikon-dugme" data-kaydet="${a.id}" aria-pressed="${kayitli}" aria-label="${kayitli ? 'Kayıtlardan çıkar' : 'Kaydet'}">${IKON.yerimi}</button>
      </div>
      <nav class="cipler" id="bolum-cipleri" aria-label="Sayfa bölümleri">
        ${s.bolumler.map((b) => `<button type="button" class="cip" data-bolum-kaydir="${b.id}">${esc(b.kisa)}</button>`).join('')}
      </nav>
    </div>
    <div class="baslik-blok">
      <span class="ust">${esc(a.konu.ad)} › ${a.no}</span>

      ${s.etiketler ? `<div class="etiketler">${s.etiketler.map((e) => `<span class="etiket">${esc(e)}</span>`).join('')}</div>` : ''}
    </div>
    <div class="bolumler">
