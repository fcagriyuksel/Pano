<style>
:root{
  --paper:#F3F1EA; --card:#FFFDF8; --ink:#1B1E21; --ink-2:#3A3F44; --muted:#50565C;
  --line:#DAD5C8; --line-soft:#E4E0D5; --chip:#E9E5DA;
  --accent:#F2B01E; --on-accent:#1B1E21; --signal:#1D5FB8;
  --panel:#1B1E21; --panel-ink:#F3F1EA; --panel-muted:#C9C5BA; --panel-track:#3A3F44;
  --danger-bg:#F8E4DE; --danger-line:#E7B9AD; --danger-ink:#7F2414;
  --mark:#FBE3A6; --focus:#1D5FB8;
  --wire-l:#7A4A22; --wire-l2:#1B1E21; --wire-l3:#8A8F94; --wire-n:#1D5FB8; --wire-pe:#4E8A2A; --wire-pe2:#E0C21A; --dc-plus:#A8321F;
  --rail:#D3CEC1; --svg-body:#FFFFFF; --hatch:#8A8F94;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --nav-h:68px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#141619; --card:#1D2024; --ink:#ECE8DF; --ink-2:#C9C5BB; --muted:#A7A398;
    --line:#343940; --line-soft:#2A2E34; --chip:#2A2E34;
    --signal:#7AAAF2; --panel:#262A30; --panel-ink:#F3F1EA; --panel-muted:#C3BFB5; --panel-track:#454B52;
    --danger-bg:#3A201B; --danger-line:#6B3328; --danger-ink:#F2A996;
    --mark:#6B5410; --focus:#7AAAF2;
    --wire-l:#C58B55; --wire-l2:#646B73; --wire-l3:#B3B7BC; --wire-n:#7AAAF2; --wire-pe:#6DB043; --dc-plus:#E07A64;
    --rail:#3A3F45; --svg-body:#2A2E34; --hatch:#7D838A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#141619; --card:#1D2024; --ink:#ECE8DF; --ink-2:#C9C5BB; --muted:#A7A398;
  --line:#343940; --line-soft:#2A2E34; --chip:#2A2E34;
  --signal:#7AAAF2; --panel:#262A30; --panel-ink:#F3F1EA; --panel-muted:#C3BFB5; --panel-track:#454B52;
  --danger-bg:#3A201B; --danger-line:#6B3328; --danger-ink:#F2A996;
  --mark:#6B5410; --focus:#7AAAF2;
  --wire-l:#C58B55; --wire-l2:#646B73; --wire-l3:#B3B7BC; --wire-n:#7AAAF2; --wire-pe:#6DB043; --dc-plus:#E07A64;
  --rail:#3A3F45; --svg-body:#2A2E34; --hatch:#7D838A;
}

html{background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
a{color:var(--signal)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
h1,h2,h3{text-wrap:balance}
.mono{font-family:var(--f-mono)}
.ust{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.app{max-width:480px;margin:0 auto;padding-inline:20px;padding-block:16px calc(var(--nav-h) + 32px);display:flex;flex-direction:column;gap:20px;min-height:100%}

/* Marka */
.marka{display:flex;align-items:center;gap:12px;padding-top:8px}
.marka-plaka{width:12px;height:40px;border-radius:3px;background:var(--accent);flex-shrink:0}
.marka-ad{margin:0;font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;letter-spacing:.02em}
.marka-alt{font-size:13px;color:var(--muted);margin:4px 0 0}

/* Arama kutusu (ana sayfa) */
.arama-dugme{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--muted);font-size:15px;text-align:left;cursor:pointer;width:100%}
.arama-dugme svg{color:var(--ink);flex-shrink:0}

/* Koyu panel (kaldığın yer) */
.panel{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:16px;background:var(--panel);color:var(--panel-ink);border:0;text-align:left;cursor:pointer;width:100%}
.panel-ust{display:flex;justify-content:space-between;align-items:center;gap:12px}
.panel-etiket{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.panel-sayac{font-family:var(--f-mono);font-size:12px;color:var(--panel-muted);font-variant-numeric:tabular-nums}
.panel-baslik{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.panel-alt{font-size:13px;color:var(--panel-muted);margin-top:6px}
.ilerleme{display:grid;gap:4px}
.ilerleme span{height:4px;border-radius:2px;background:var(--panel-track)}
.ilerleme span.dolu{background:var(--accent)}

/* Bölüm başlıkları */
.satir-baslik{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.h2{margin:0;font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.1}

/* Konu kartları */
.konu-izgara{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.konu-kart{display:flex;flex-direction:column;gap:8px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left;cursor:pointer;min-height:118px}
.konu-kart:hover{border-color:var(--ink)}
.konu-kart-ust{display:flex;justify-content:space-between;align-items:flex-start;color:var(--ink)}
.konu-kart-ad{margin-top:auto;font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.1}

/* Üst çubuk (alt ekranlar) */
.ust-cubuk{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);margin-inline:-20px;padding:8px 20px 10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid transparent}
.ust-cubuk.golgeli{border-bottom-color:var(--line)}
.ust-satir{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.geri{display:flex;align-items:center;gap:4px;height:44px;padding:0 12px 0 4px;margin-left:-4px;border:0;background:none;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;color:var(--ink)}
.ikon-dugme{width:44px;height:44px;flex-shrink:0;border:1px solid var(--line);border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.ikon-dugme[aria-pressed="true"] .yerimi{fill:var(--accent)}

/* Çipler */
.cipler{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding-inline:20px;padding-bottom:2px}
.cipler::-webkit-scrollbar{display:none}
.cip{flex-shrink:0;height:36px;padding:0 13px;display:flex;align-items:center;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--ink)}
.cip[aria-pressed="true"],.cip.etkin{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.cip-kutu{display:flex;flex-wrap:wrap;gap:8px}
.parca{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:13px;cursor:pointer;color:var(--ink);text-align:left}
.parca:hover{border-color:var(--ink)}

/* Başlık bloğu */
.baslik-blok{display:flex;flex-direction:column;gap:10px}
.h1{margin:0;font-family:var(--f-display);font-size:38px;font-weight:700;line-height:1.02}
.giris{margin:0;font-size:15px;line-height:1.55;color:var(--ink-2)}
.etiketler{display:flex;flex-wrap:wrap;gap:6px}
.etiket{padding:4px 10px;border-radius:6px;background:var(--chip);font-family:var(--f-mono);font-size:12px;color:var(--ink)}

/* Liste satırları */
.liste{display:flex;flex-direction:column;gap:8px}
.satir{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left;width:100%;color:var(--ink)}
button.satir{cursor:pointer}
button.satir:hover{border-color:var(--ink)}
.kod{width:52px;height:52px;flex-shrink:0;border-radius:10px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--ink);text-align:center;line-height:1.1;padding:2px}
.kod.hazir{background:var(--accent);color:var(--on-accent)}
.satir-metin{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.satir-ad{font-size:16px;font-weight:600;line-height:1.3}
.satir-alt{font-size:13px;line-height:1.4;color:var(--muted)}
.rozet{flex-shrink:0;padding:3px 8px;border-radius:6px;border:1px dashed var(--line);font-family:var(--f-mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.satir .ok{flex-shrink:0;color:var(--ink)}

/* Bilgi sayfası bölümleri */
.bolumler{display:flex;flex-direction:column;gap:40px;padding-top:8px}
.gizli{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.blok-grup{display:flex;flex-direction:column;gap:12px}
.bolum{display:flex;flex-direction:column;gap:14px;scroll-margin-top:120px}
.bolum-baslik{display:flex;align-items:baseline;gap:10px}
.bolum-no{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.bolum-ad{margin:0;font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1}
.kart{padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card);display:flex;flex-direction:column;gap:12px}
.sema{display:block;width:100%;height:auto}
.sema text{font-family:var(--f-mono)}
.lejant{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.lejant span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:18px;height:3px;border-radius:2px}
.sw-l{background:var(--wire-l)} .sw-l2{background:var(--wire-l2)} .sw-l3{background:var(--wire-l3)} .sw-acc{background:var(--accent);height:8px} .sw-opt2{background:repeating-linear-gradient(90deg,var(--ink) 0 5px,transparent 5px 9px)} .sw-kacak{background:repeating-linear-gradient(90deg,var(--dc-plus) 0 4px,transparent 4px 7px)} .sw-n{background:var(--wire-n)} .sw-sig{background:var(--signal)} .sw-dc{background:var(--dc-plus)} .sw-ink{background:var(--ink)}
.sw-pe{background:repeating-linear-gradient(90deg,var(--wire-pe) 0 6px,var(--wire-pe2) 6px 12px)}
.sw-hatch{background:var(--hatch)}
.sw-pen{background:repeating-linear-gradient(90deg,var(--wire-pe) 0 6px,var(--wire-n) 6px 9px,var(--wire-pe) 9px 12px)}
.sw-opt{background:repeating-linear-gradient(90deg,var(--signal) 0 5px,transparent 5px 9px)}

.isaretler{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.isaretler li{display:flex;gap:12px}
.isaret-no{width:24px;height:24px;flex-shrink:0;border-radius:12px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:12px;font-weight:600}
.isaret-ad{font-size:15px;font-weight:600;display:block}
.isaret-metin{display:block;font-size:14px;line-height:1.5;color:var(--ink-2)}
.not{margin:0;padding:12px 14px;border-radius:12px;background:var(--chip);font-size:13px;line-height:1.5;color:var(--ink)}

.ikili{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini-kart{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.mini-kart svg{color:var(--ink)}
.mini-ad{font-size:15px;font-weight:600;line-height:1.3}
.mini-etiket{align-self:flex-start;padding:2px 8px;border-radius:6px;background:var(--chip);font-family:var(--f-mono);font-size:11px}
.mini-metin{font-size:13px;line-height:1.5;color:var(--ink-2)}

.aralik-alt{font-family:var(--f-mono);font-size:11px;color:var(--muted);align-self:flex-end}
.aralik-liste{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line-soft)}

.ariza{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}

.sonuc{padding:14px;border-radius:14px;background:var(--panel);color:var(--panel-ink);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.sonuc div{display:flex;flex-direction:column;gap:2px;min-width:0}

/* Sonraki */
.sonraki{padding:16px;border-radius:14px;background:var(--panel);color:var(--panel-ink);display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;width:100%;text-align:left}
button.sonraki{cursor:pointer}
.sonraki-ad{font-size:16px;font-weight:600}
.sonraki .rozet{border-color:var(--panel-track);color:var(--panel-muted)}

/* Arama ekranı */
.arama-satir{display:flex;align-items:center;gap:10px}
.arama-alan{flex-grow:1;min-width:0;display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border:2px solid var(--ink);border-radius:12px;background:var(--card)}
.arama-alan input{flex-grow:1;min-width:0;height:100%;border:0;outline:none;background:transparent;font:inherit;font-size:16px;color:var(--ink)}
.arama-alan input::placeholder{color:var(--muted)}
.metin-dugme{flex-shrink:0;height:44px;padding:0 4px;border:0;background:none;color:var(--signal);font-size:15px;font-weight:500;cursor:pointer}
.sonuc-kart{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left;width:100%;color:var(--ink)}
button.sonuc-kart{cursor:pointer}
button.sonuc-kart:hover{border-color:var(--ink)}
.sonuc-yol{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.bulgu-ad{font-size:16px;font-weight:600}
.sonuc-parca{font-size:13px;line-height:1.5;color:var(--ink-2)}
mark{background:var(--mark);color:var(--ink);padding:0 2px;border-radius:3px}
.bos{padding:28px 20px;border:1px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5;display:flex;flex-direction:column;align-items:center;gap:10px}
.bos svg{color:var(--muted)}

/* Alt menü */
.alt-menu{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px))}
.alt-menu-ic{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.menu-oge{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;border:0;background:none;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer}
.menu-ikon{width:60px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.menu-oge[aria-current="page"]{color:var(--ink);font-weight:600}
.menu-oge[aria-current="page"] .menu-ikon{background:var(--accent);color:var(--on-accent)}
.sayi{font-family:var(--f-mono);font-size:10px;margin-left:2px}

.bildirim{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;padding:10px 16px;border-radius:12px;background:var(--panel);color:var(--panel-ink);font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .2s}
.bildirim.acik{opacity:1}

/* Düğmeler, uyarı, premium, metin sayfaları */
.dugme{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.dugme-ana{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.dugme-tehlike{background:var(--danger-ink);border-color:var(--danger-ink);color:var(--paper)}
.dugme-genis{width:100%}
.dugme-satir{display:flex;gap:8px;flex-wrap:wrap}
.uyari-kart{padding:16px;border:1px solid var(--danger-line);border-radius:16px;background:var(--danger-bg);display:flex;flex-direction:column;gap:10px}
.uyari-ust{display:flex;align-items:center;gap:8px;color:var(--danger-ink)}
.uyari-ust h2{margin:0;font-size:16px;font-weight:600}
.uyari-kart p{margin:0;font-size:14px;line-height:1.5;color:var(--ink)}
.premium-panel{cursor:default}
.premium-fiyat{font-family:var(--f-mono);font-size:16px;font-weight:600;color:var(--accent)}
.premium-liste{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.premium-liste li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.5}
.premium-liste svg{flex-shrink:0;margin-top:3px;color:var(--ink)}
.basari{padding:14px 16px;border-radius:14px;background:var(--chip);font-weight:600}
.rozet-premium{border-style:solid;border-color:var(--accent);color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.metin-sayfa{display:flex;flex-direction:column;gap:20px}
.metin-sayfa section{display:flex;flex-direction:column;gap:6px}
.metin-baslik{margin:0;font-size:16px;font-weight:600}
.metin-sayfa p{margin:0;font-size:15px;line-height:1.6;color:var(--ink-2)}
.marka-ic{flex-grow:1;min-width:0}
.buyuk-yazi .app{zoom:1.12}

/* Simülasyon */
.sim-durum{padding:10px 12px;border-radius:10px;background:var(--chip);font-size:14px;line-height:1.5;font-weight:500;min-height:44px;display:flex;align-items:center}
.sim-durum.uyari{background:var(--danger-bg);color:var(--danger-ink);border:1px solid var(--danger-line)}
.dugme-kucuk{min-height:44px;padding:0 12px;font-size:14px}
.dugme[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.secenekler{flex-wrap:wrap}
.secenek{flex:1 1 56px}

/* Açılış ekranı: defter sayfası belirir, satırlar yazılır, orta satır kontağa dönüşür, uç yanar, ayraç düşer, uygulama adı belirir.
   Çizim simge_olustur.py ile aynı koordinatları kullanır. Sayfa temanın mürekkep rengindedir: açık temada koyu, koyu temada açık sayfa.
   Ekran CSS ile kendi kendine kapanır; JS yalnızca DOM’dan kaldırır. */
.acilis-ekran{display:none;position:fixed;inset:0;z-index:50;overflow:hidden;background:var(--paper);align-items:center;justify-content:center;padding-bottom:8vh;cursor:pointer;animation:acilis-kapan .35s ease 1.55s forwards}
.acilis-var .acilis-ekran{display:flex}
.acilis-ekran.atla{animation:acilis-atla .2s ease forwards}
.acilis-ic{display:flex;flex-direction:column;align-items:center;gap:12px}
.acilis-isaret{display:block;width:132px;height:auto;margin-bottom:12px;overflow:visible}
.a-sayfa{fill:var(--ink);transform-box:fill-box;transform-origin:50% 100%;animation:acilis-sayfa .45s cubic-bezier(.2,.8,.2,1) both}
.a-satir,.a-kontak{fill:none;stroke:var(--paper);stroke-linecap:round}
.a-satir{stroke-width:18}
/* Çizgi boyu + 20: yuvarlak uç, çizim başlamadan görünmesin. Boy değişirse bu değerleri de güncelle. */
.a-s1{stroke-dasharray:92 400;stroke-dashoffset:112;animation:acilis-ciz .22s ease-out .3s forwards}
.a-s2{stroke-dasharray:74 400;stroke-dashoffset:94;animation:acilis-ciz .18s ease-out .46s forwards}
.a-s3{stroke-dasharray:34 400;stroke-dashoffset:54;animation:acilis-ciz .1s ease-out .7s forwards}
.a-s4{stroke-dasharray:124 400;stroke-dashoffset:144;animation:acilis-ciz .26s ease-out .56s forwards}
.a-kontak{stroke-width:14;transform-box:fill-box;transform-origin:center;animation:acilis-kontak .2s cubic-bezier(.3,1.5,.5,1) .6s both}
.a-uc{fill:var(--accent);stroke:var(--ink);stroke-width:8;transform-box:fill-box;transform-origin:center;animation:acilis-uc .3s cubic-bezier(.3,1.6,.5,1) .78s both}
.a-halka{fill:none;stroke:var(--accent);stroke-width:6;opacity:0;transform-box:fill-box;transform-origin:center;animation:acilis-halka .6s ease-out .92s}
.a-ayrac{fill:var(--accent);transform-box:fill-box;transform-origin:50% 0;animation:acilis-ayrac .45s cubic-bezier(.3,1.4,.5,1) .88s both}
.acilis-ad{font-family:var(--f-display);font-weight:700;font-size:36px;line-height:1;white-space:nowrap;letter-spacing:.04em;padding-left:.04em;color:var(--ink);animation:acilis-ad .6s cubic-bezier(.2,.7,.2,1) .35s both}
.acilis-alt{font-size:13px;color:var(--muted);animation:acilis-belir .5s ease .6s both}
.acilis .app>*{animation:acilis-gir .55s cubic-bezier(.2,.7,.2,1) 1.7s both}
.acilis .app>:nth-child(1){animation-delay:1.4s}
.acilis .app>:nth-child(2){animation-delay:1.46s}
.acilis .app>:nth-child(3){animation-delay:1.52s}
.acilis .app>:nth-child(4){animation-delay:1.58s}
.acilis .app>:nth-child(5){animation-delay:1.64s}
.acilis .alt-menu{animation:acilis-menu .5s cubic-bezier(.2,.7,.2,1) 1.5s both}
@keyframes acilis-sayfa{from{opacity:0;transform:translateY(14px) scale(.9)}}
@keyframes acilis-ciz{to{stroke-dashoffset:0}}
@keyframes acilis-kontak{from{opacity:0;transform:scaleY(.2)}}
@keyframes acilis-uc{from{opacity:0;transform:scale(.2)}}
@keyframes acilis-halka{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(3)}}
@keyframes acilis-ayrac{from{opacity:0;transform:scaleY(.2)}}
@keyframes acilis-ad{from{opacity:0;letter-spacing:.16em;padding-left:.16em}}
@keyframes acilis-belir{from{opacity:0;transform:translateY(6px)}}
@keyframes acilis-kapan{to{opacity:0;visibility:hidden}}
@keyframes acilis-atla{to{opacity:0;visibility:hidden}}
@keyframes acilis-gir{from{opacity:0;transform:translateY(14px)}}
@keyframes acilis-menu{from{transform:translateY(100%)}}

/* 3B model bloğu (kaynak/uygulama/86-model.js) */
.model-blok{display:flex;flex-direction:column;gap:12px}
.model-kutu{gap:14px}
.model-sahne{position:relative;margin:-16px -16px 0;aspect-ratio:10/9;border-radius:15px 15px 0 0;overflow:hidden;background:radial-gradient(circle at 50% 42%,var(--svg-body) 0%,var(--card) 72%);border-bottom:1px solid var(--line-soft)}
.model-tuval{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab;-webkit-user-select:none;user-select:none}
.model-tuval:active{cursor:grabbing}
.model-bilgi{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;margin:0;padding:24px;text-align:center;font-size:14px;line-height:1.5;color:var(--muted)}
.model-blok[data-durum="hazir"] .model-bilgi{display:none}
.model-isaretler{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.model-blok:not([data-durum="hazir"]) .model-isaretler{display:none}
.model-no{position:absolute;left:0;top:0;width:24px;height:24px;margin:-12px 0 0 -12px;padding:0;border:0;border-radius:12px;background:var(--ink);color:var(--paper);box-shadow:0 0 0 2px var(--card);font-family:var(--f-mono);font-size:12px;font-weight:600;line-height:1;display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;transition:opacity .2s}
.model-no::before{content:'';position:absolute;inset:-10px}
/* Arkada kalan (ya da kesitte atılan) parçanın numarası gizlenir; seçiliyse soluk görünür. */
.model-no.arkada{opacity:0;pointer-events:none}
.model-no.arkada[aria-pressed="true"]{opacity:.55}
.model-no.gizli-no{visibility:hidden}
.model-no[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);opacity:1}
.model-secim{display:flex;gap:12px;padding:12px 14px;border-radius:12px;background:var(--chip)}
.model-secim[hidden]{display:none}
.model-secim .isaret-no,.model-parca[aria-pressed="true"] .isaret-no{background:var(--accent);color:var(--on-accent)}
.model-parcalar li{display:block}
.model-parca{display:flex;gap:12px;width:100%;padding:4px 0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;border-radius:8px}
/* Etiketler: klemens ve uç adları; ait oldukları parça seçiliyken görünür */
.model-etiket{position:absolute;left:0;top:0;padding:2px 5px;border:1px solid var(--line);border-radius:5px;background:var(--card);color:var(--ink);font-family:var(--f-mono);font-size:10px;font-weight:600;line-height:1.2;white-space:nowrap;pointer-events:auto;cursor:pointer;transition:opacity .2s}
.model-etiket::before{content:'';position:absolute;inset:-6px}
.model-etiket.gizli-no{visibility:hidden}
.model-etiket.arkada{opacity:0;pointer-events:none}
.model-etiket[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.model-etiket-ad{flex-shrink:0;align-self:flex-start;padding:2px 7px;border-radius:6px;background:var(--accent);color:var(--on-accent);font-family:var(--f-mono);font-size:13px;font-weight:600}
.model-etiket-satir{width:100%;border:0;border-bottom:1px solid var(--line-soft);background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.model-etiket-satir[aria-pressed="true"]{background:var(--chip)}

@media (prefers-reduced-motion: reduce){
  *{scroll-behavior:auto!important;transition:none!important}
  .acilis-ekran{display:none!important}
  .acilis .app>*,.acilis .alt-menu{animation:none!important}
}

<div class="app" id="uygulama" lang="tr"></div>

<script>
/* İlk kareden önce: seçili tema uygulanır (renk sıçraması olmasın) ve açılış ekranı oturum başına bir kez açılır.
   Depo öneki uygulama/40-dizin-depo-durum.js içindeki DEPO_ONEK ile aynı olmalı. */
(function () {
  var k = document.documentElement;
  try {
    var t = (JSON.parse(localStorage.getItem('otomasyon-notlari.ayarlar')) || {}).tema;
    if (t === 'acik' || t === 'koyu') {
      k.setAttribute('data-ilk-tema', k.getAttribute('data-theme') || '');
      k.setAttribute('data-theme', t === 'acik' ? 'light' : 'dark');
    }
  } catch (e) { /* depo kapalı olabilir */ }
  var goster = true;
  try { goster = !matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { /* yok say */ }
  try { if (sessionStorage.getItem('otomasyon-notlari.acilis')) goster = false; else sessionStorage.setItem('otomasyon-notlari.acilis', '1'); } catch (e) { /* yok say */ }
  if (goster) k.classList.add('acilis', 'acilis-var');
})();
</script>

    </svg>
    <div class="acilis-ad">Otomasyon Notları</div>

</div>

  return k.slice(0, j) + k[j].toLocaleUpperCase('tr-TR') + k.slice(j + 1);
}).join(' ');

Object.assign(HESAPLAR, {
  mccb: {
    gruplar: [
      { k: 'in', ad: 'Şalter anma akımı (In)', v: 160, s: [[100, '100 A'], [160, '160 A'], [250, '250 A'], [400, '400 A']] },
      { k: 'ir', ad: 'Ir ayarı (× In)', v: 0.8, s: [[0.5, '0,5'], [0.7, '0,7'], [0.8, '0,8'], [0.9, '0,9'], [1, '1']] },
      { k: 'sd', ad: 'Isd ayarı (× Ir)', v: 6, s: [[2, '2'], [4, '4'], [6, '6'], [10, '10']] }
    ],
    hesapla(d) {
      const Ir = d.in * d.ir, Isd = Ir * d.sd;
      return {
        sonuclar: [['Ir (aşırı yük)', sayi(Ir, 0) + ' A'], ['Isd (kısa gecikme)', sayi(Isd, 0) + ' A'], ['Kablo Iz en az', sayi(Ir, 0) + ' A'], ['Hat sonu Ik en az', sayi(Isd * 1.2, 0) + ' A']],
        adimlar: [`Ir = ${sayi(d.ir)} × ${d.in} = ${sayi(Ir, 0)} A`, `Isd = ${d.sd} × ${sayi(Ir, 0)} = ${sayi(Isd, 0)} A`, `Hat sonundaki kısa devre akımı ≈ 1,2 × Isd = ${sayi(Isd * 1.2, 0)} A’i aşmalı; yoksa şalter kısa devrede yalnızca uzun gecikmeyle açar.`]
      };
    },
    not: 'Ayar aralıkları üreticiye göre değişir. 1,2 katsayısı ayar toleransı içindir. Ii çoğu modelde ayrıca ayarlanır ya da sabittir.'

});

      parcalar: [

        ['Bimetal', 'Aşırı yükte ısınıp eğilir ve mandalı açar. Yavaştır; akım büyüdükçe daha çabuk açar. Soğumadan sigorta yeniden kurulamaz.'],

        ['Ark söndürme hücresi', 'Kontaklar açılınca oluşan ark, kılavuzlarla çelik plakaların arasına itilir; plakalar arkı küçük parçalara böler ve soğutur, ark söner.'],

      ],
      kamera: { yon: [1.25, 0.35, 0.85], patlak: [1, 0.3, 0.75] },
      kesitler: [{ ad: 'yan', planlar: [[-1, 0, 0, 0]] }],
      yeni: () => ({ kapali: true, kol: 1, kontak: 1, olay: '', isi: 0, pim: 0, ark: 0, uyari: '' }),
      dugmeler: (s) => [
        ['kol', s.kapali ? 'Kolu indir' : 'Kolu kaldır'],

        ['kisa', 'Kısa devre']
      ],
      olay(s, olay) {
        s.uyari = '';
        if (olay === 'kol') {
          if (s.kapali) { s.kapali = false; s.olay = ''; }
          else if (s.isi > 0.25) s.uyari = 'soguma';
          else { s.kapali = true; s.olay = ''; }
        } else if (olay === 'asiri') { if (s.kapali) s.olay = 'asiri'; else s.uyari = 'acik'; }
        else if (olay === 'kisa') {
          if (s.kapali) { s.olay = 'kisa'; s.pim = 1; s.ark = 1; s.kapali = false; } else s.uyari = 'acik';
        }
      },
      tik(s, dt) {
        let h = false;
        const yaklas = (a, b, v) => (a < b ? Math.min(b, a + v) : Math.max(b, a - v));
        const kol = s.kapali ? 1 : 0;
        if (s.kol !== kol) { s.kol = yaklas(s.kol, kol, dt * 6); h = true; }
        if (s.kontak !== kol) { s.kontak = yaklas(s.kontak, kol, dt * 14); h = true; }
        if (s.olay === 'asiri' && s.kapali) {
          s.isi = Math.min(1, s.isi + dt / ISINMA);
          if (s.isi >= 1) s.kapali = false;
          h = true;
        } else if (s.isi > 0 && !s.kapali) { s.isi = Math.max(0, s.isi - dt / SOGUMA); h = true; }
        if (s.pim > 0) { s.pim = Math.max(0, s.pim - dt * 2.5); h = true; }
        if (s.ark > 0) { s.ark = Math.max(0, s.ark - dt * 1.6); h = true; }
        return h;
      },
      durum(s) {
        if (s.uyari === 'soguma') return { metin: 'Bimetal henüz soğumadı: kol kalksa da mandal tutmaz. Biraz bekle.', uyari: true };
        if (s.uyari === 'acik') return { metin: 'Sigorta zaten açık; önce kolu kaldır.', uyari: true };
        if (s.olay === 'asiri' && s.kapali) return { metin: `Aşırı yük (ör. 1,45 × In): akım bimetali ısıtıyor, bimetal eğiliyor… ${Math.round(s.isi * 100)} %. Gerçekte bu süre dakikaları bulabilir.` };
        if (s.olay === 'asiri') return { metin: `Termik açtı: bimetal mandalı itti, kol düştü, kontaklar açıldı.${s.isi > 0.25 ? ' Bimetal soğumadan yeniden kurulamaz.' : ' Bimetal soğudu; nedeni giderip kolu kaldırabilirsin.'}` };
        if (s.olay === 'kisa') return { metin: 'Kısa devre (ör. C eğrisinde 10 × In üstü): bobin pimi ittirdi, kontaklar milisaniyeler içinde açıldı; ark, ark söndürme hücresinde bölünüp söndü. Nedeni bulmadan kurma.' };
        return { metin: s.kapali ? 'Kol yukarıda (ON): kontaklar kapalı, hat enerjili. Gösterge kırmızı.' : 'Kol aşağıda (OFF): kontaklar açık, hat enerjisiz. Gösterge yeşil.' };
      },

      kur(y) {
        const T = y.T, TUR = Math.PI * 2;
        const kok = new T.Group();
        const grup = (...n) => { const g = new T.Group(); n.forEach((x) => g.add(x)); return g; };
        const yer = (n, x, yy, z) => { n.position.set(x, yy, z); return n; };
        const kutu = (w, h, d, m, x, yy, z, sec) => yer(y.ag(new T.BoxGeometry(w, h, d), m, sec), x, yy, z);
        const eksenX = (geo) => geo.rotateY(Math.PI / 2);   // z eksenli geometriyi x eksenine çevirir
        /* Birbirine değen parçalar arasında 0,05 mm boşluk vardır (kesitte z-fighting olmasın). */

        /* ---- gövde: iki yarım kabuk. Her yarım = yan levha + çevre bandı (içi boş; kesitte mekanizma görünür).
           Profil (z, y) x boyunca çekilir; şekilde x = −z (dünya). Band iç profili dış profilin 1,5 mm içeriden geçer. ---- */
        const DIS = [[0, -45], [44, -45], [44, -22.5], [68, -22.5], [68, 22.5], [44, 22.5], [44, 45], [0, 45]];
        const IC = [[1.5, -43.5], [42.5, -43.5], [42.5, -21], [66.5, -21], [66.5, 21], [42.5, 21], [42.5, 43.5], [1.5, 43.5]];
        const sekil = (n) => new T.Shape(n.map(([z, yy]) => new T.Vector2(-z, yy)));
        const levhaGeo = eksenX(new T.ExtrudeGeometry(sekil(DIS), { depth: 1.5, bevelEnabled: false }));
        const bantSekli = sekil(DIS);
        bantSekli.holes.push(new T.Path(IC.map(([z, yy]) => new T.Vector2(-z, yy))));
        const bantGeo = eksenX(new T.ExtrudeGeometry(bantSekli, { depth: 7.15, bevelEnabled: false }));
        const govdeSol = grup(yer(y.ag(levhaGeo, 'plastikAcik'), -8.75, 0, 0), yer(y.ag(bantGeo, 'plastikAcik'), -7.2, 0, 0));
        const govdeSag = grup(yer(y.ag(levhaGeo, 'plastikAcik'), 7.25, 0, 0), yer(y.ag(bantGeo, 'plastikAcik'), 0.05, 0, 0));

        /* ---- klemensler: kafes, vida, yüzeydeki vida kuyusu ve kablo girişi ---- */
        const klemens = (yy) => {
          const d = Math.sign(yy);
          return grup(
            kutu(8, 6, 10, 'celik', 0, yy, 27),
            yer(y.ag(y.silindir(1.8, 11.9, 20), 'celik', { esik: 60 }), 0, yy, 38.05),
            yer(y.ag(y.silindir(2.9, 1.4, 24), 'celik'), 0, yy, 44.9),
            kutu(0.5, 4, 0.2, 'entegre', 0, yy, 45.7, { kenar: false }),
            kutu(7.5, 7.5, 0.1, 'entegre', 0, yy, 44.1, { kenar: false }),
            kutu(7, 0.1, 12, 'entegre', 0, d * 45.1, 27, { kenar: false })
          );
        };
        const giris = klemens(36), cikis = klemens(-36);

        /* ---- kol ve gösterge ---- */
        const kol = yer(grup(yer(y.ag(eksenX(y.silindir(5, 7, 32)), 'plastik'), 0, 0, 0), kutu(7, 8, 14, 'plastik', 0, 0, 7)), 0, 0, 64);
        const gosterge = kutu(4, 3, 0.1, y.malzeme('plastik').clone(), 0, -15, 68.1, { kenar: false });
        const kirmizi = y.malzeme('kuzey').color.clone(), yesil = new T.Color(0x2e9e4f);

        /* ---- bobin ve pim (pim aşağı, hareketli kontağa doğru iter) ---- */
        const pim = yer(y.ag(new T.CylinderGeometry(1.4, 1.4, 18, 20), 'celik', { esik: 60 }), 0, 21.2, 34);
        const bobin = grup(yer(y.ag(y.halka(1.7, 4.5, 14, 40).rotateX(Math.PI / 2), 'bakir'), 0, 19, 34), pim,
          kutu(3, 2.25, 2, 'bakir', 0, 10.825, 31), kutu(3, 6.9, 12, 'bakir', 0, 29.5, 26));

        /* ---- kontaklar ---- */
        const sabit = grup(kutu(6, 2, 7, 'bakir', 0, 8.65, 28.5), kutu(5, 1, 3.5, 'celik', 0, 7.1, 28.25));
        const kontakKolu = yer(grup(kutu(5, 2, 26, 'bakir', 0, 0.5, -13), kutu(5, 1, 3.5, 'celik', 0, 2.05, -23.75)), 0, 4, 52);
        const hareketli = grup(kontakKolu, y.ag(y.boru([[3, 3.3, 49.5], [3, -1, 51], [3, -6, 45], [3, -7.8, 40.6]], 0.9, 24), 'bakir', { kenar: false }));   // mandalın yanından geçer

        /* ---- bimetal (alt ucundan bağlı, üst ucu öne eğilir) ve çıkışa giden iletken ---- */
        const serit = kutu(6, 22, 1.2, y.malzeme('celik').clone(), 0, 11, 0);
        const bimetalKol = yer(grup(serit), 0, -30, 39.6);
        const bimetal = grup(bimetalKol, kutu(4, 2, 11.7, 'bakir', 0, -31.1, 33.9));
        const soguk = serit.material.color.clone(), sicak = y.malzeme('kuzey').color.clone();

        /* ---- mandal: açma kolu, bağlantı kolu, pimler ---- */
        const mandal = grup(
          kutu(4, 11.4, 2, 'plastik', 0, -2.3, 42.6),
          kutu(3, 2, 6.75, 'plastik', 0, 1.2, 55.5),
          yer(y.ag(eksenX(y.silindir(1, 1.45, 16)), 'celik', { esik: 60 }), 3.275, 4, 52),   // kontak kolunun iki yanındaki pim
          yer(y.ag(eksenX(y.silindir(1, 1.45, 16)), 'celik', { esik: 60 }), -3.275, 4, 52)
        );

        /* ---- ark söndürme hücresi: çelik plakalar, ark kılavuzu, ark ---- */
        const ark = kutu(6, 22, 6, 'vurgu', 0, -11, 27, { kenar: false });
        const hucre = grup(kutu(5, 29, 0.8, 'celik', 0, -7.5, 19.5), ark);
        for (let k = 0; k < 9; k++) hucre.add(kutu(11, 0.8, 14, 'celik', 0, -4 - k * 2.3, 27.2, { esik: 60 }));

        /* ---- DIN klipsi ve ray ---- */
        const klips = kutu(12, 6, 8, 'plastik', 0, -48.05, 4.3);
        const ray = yer(y.ag(y.dinRay(70), 'aluminyum'), -35, 0, -0.05);

        const parcalar = [
          { nesne: giris, isaret: [0, 36, 45.7], patlat: [0, 12, 0] },
          { nesne: cikis, isaret: [0, -36, 45.7], patlat: [0, -12, 0] },
          { nesne: kol, isaret: [0, 0, 14.1], patlat: [0, 0, 16] },
          { nesne: gosterge, isaret: [0, 0, 0.1], patlat: [0, 0, 10] },
          { nesne: bobin, isaret: [0, 19, 38.6], patlat: [0, 8, 6] },
          { nesne: bimetal, isaret: [0, -18, 40.3], patlat: [0, -8, 8] },
          { nesne: mandal, isaret: [0, -2, 43.65], patlat: [0, 0, 12] },
          { nesne: sabit, isaret: [0, 8.65, 32.05], patlat: [0, 4, 0] },
          { nesne: hareketli, isaret: [0, 4.5, 44], patlat: [0, -2, 4] },
          { nesne: hucre, isaret: [0, -12, 34.25], patlat: [0, -10, -10] },
          { nesne: govdeSol, isaret: [-4.4, 45.05, 10], patlat: [-26, 0, 0] },
          { nesne: govdeSag, isaret: [8.8, 0, 20], patlat: [26, 0, -100] },
          { nesne: klips, isaret: [0, -3.05, 0], patlat: [0, -14, 0] },
          { nesne: ray, isaret: [55, 15.5, 0.05], patlat: [0, 0, -18] }
        ];
        parcalar.forEach((p) => kok.add(p.nesne));

        return {
          kok,
          parcalar,
          uygula(s) {
            kol.rotation.x = 0.45 - 0.9 * s.kol;                       // yukarı: ON
            kontakKolu.rotation.x = -0.22 * (1 - s.kontak);             // açılınca uç ≈ 5,7 mm aşağı iner (ark hücresine değmez)
            pim.position.y = 21.2 - 6.6 * s.pim;
            bimetalKol.rotation.x = 0.12 * s.isi;                       // ısınınca üst uç öne, mandala doğru
            serit.material.color.copy(soguk).lerp(sicak, s.isi * 0.8);
            gosterge.material.color.copy(s.kontak > 0.5 ? kirmizi : yesil);
            ark.visible = s.ark > 0.02;
            ark.scale.set(1, Math.max(0.05, s.ark), 1);
          }
        };
      }
    }
  });
})();

        const eksenX = (geo) => geo.rotateY(Math.PI / 2);
        const tel = (n, r, m) => y.ag(y.boru(n, r, 32), m, { kenar: false });
        /* Birbirine değen parçalar arasında 0,05 mm boşluk vardır (kesitte z-fighting olmasın). */

        /* ---- gövde: otomatik sigortayla aynı profil, 36 mm genişlik ---- */
        const DIS = [[0, -45], [44, -45], [44, -22.5], [68, -22.5], [68, 22.5], [44, 22.5], [44, 45], [0, 45]];
        const IC = [[1.5, -43.5], [42.5, -43.5], [42.5, -21], [66.5, -21], [66.5, 21], [42.5, 21], [42.5, 43.5], [1.5, 43.5]];
        const sekil = (n) => new T.Shape(n.map(([z, yy]) => new T.Vector2(-z, yy)));
        const levhaGeo = eksenX(new T.ExtrudeGeometry(sekil(DIS), { depth: 1.5, bevelEnabled: false }));
        const bantSekli = sekil(DIS);
        bantSekli.holes.push(new T.Path(IC.map(([z, yy]) => new T.Vector2(-z, yy))));
        const bantGeo = eksenX(new T.ExtrudeGeometry(bantSekli, { depth: 16.4, bevelEnabled: false }));
        const govdeSol = grup(yer(y.ag(levhaGeo, 'plastikAcik'), -18, 0, 0), yer(y.ag(bantGeo, 'plastikAcik'), -16.45, 0, 0), kutu(12, 6, 8, 'plastik', 0, -48.05, 4.3));
        const govdeSag = grup(yer(y.ag(levhaGeo, 'plastikAcik'), 16.5, 0, 0), yer(y.ag(bantGeo, 'plastikAcik'), 0.05, 0, 0));

        /* ---- klemensler ---- */
        const klemens = (x, yy) => {
          const d = Math.sign(yy);
          return [kutu(8, 6, 10, 'celik', x, yy, 27), yer(y.ag(y.silindir(1.8, 11.9, 20), 'celik', { esik: 60 }), x, yy, 38.05),
            yer(y.ag(y.silindir(2.9, 1.4, 24), 'celik'), x, yy, 44.9), kutu(0.5, 4, 0.2, 'entegre', x, yy, 45.7, { kenar: false }),
            kutu(7.5, 7.5, 0.1, 'entegre', x, yy, 44.1, { kenar: false }), kutu(7, 0.1, 12, 'entegre', x, d * 45.1, 27, { kenar: false })];
        };
        const giris = grup(...KUTUP.flatMap((x) => klemens(x, 36)));
        const cikis = grup(...KUTUP.flatMap((x) => klemens(x, -36)),
          ...KUTUP.map((x) => tel([[x, -14.5, 24.5], [x, -22, 25.5], [x, -32.9, 27]], 1, 'bakir')));   // hareketli kontaktan gelen esnek iletkenler

        /* ---- kol ve test butonu (ön yüz) ---- */
        const kol = yer(grup(yer(y.ag(eksenX(y.silindir(5, 10, 32)), 'plastik'), 0, 0, 0), kutu(10, 8, 14, 'plastik', 0, 0, 7)), -6, 0, 64);
        const testIc = grup(yer(y.ag(y.silindir(3.5, 3, 24), 'vurgu'), 9, 12, 69.55), yer(y.ag(y.silindir(1.2, 9, 16), 'plastik'), 9, 12, 63.5));
        const test = grup(testIc,
          yer(y.ag(eksenX(y.silindir(1.3, 6, 16)), 'plastikAcik', { esik: 60 }), 11, 17, 55),
          tel([[14, 17, 55], [14.5, 14, 57.5], [10.3, 12, 59.6]], 0.35, 'bakir'),
          tel([[8, 17, 55], [6.5, 19.5, 40], [5.4, 21, 28.2]], 0.35, 'bakir'),   // nötre, toroidden önce
          tel([[7.8, 12, 59.5], [6, 7, 45], [-2, 7.5, 33], [-3, 9.6, 28.1]], 0.35, 'bakir'));   // butondan faza, toroidden sonra

        /* ---- toroid: y ekseninde halka; önündeki dilimde sekonder sargı ---- */
        const halkaY = (geo) => geo.rotateX(Math.PI / 2);
        const sargiAg = yer(y.ag(halkaY(y.torna([[5.9, -3.5], [12.1, -3.5, 1], [12.1, 3.5, 1], [5.9, 3.5, 1], [5.9, -3.5]], 24, (20 * Math.PI) / 180, (140 * Math.PI) / 180)), y.malzeme('bakir').clone(), { esik: 50 }), 0, 13, 27);
        const toroid = grup(yer(y.ag(halkaY(y.halka(6.5, 11.5, 6, 48)), 'miknatis', { esik: 60 }), 0, 13, 27), sargiAg,
          ...[-2.2, 2.2].map((x) => tel([[x, 10, 37], [x, 0, 44], [x, -12.9, 47]], 0.4, 'bakir')));

        /* ---- açma rölesi (kalıcı mıknatıslı) ve pimi; mandal ---- */
        const pim = yer(y.ag(new T.CylinderGeometry(1.2, 1.2, 6, 16), 'celik', { esik: 60 }), 0, -10, 48);
        const roleSargi = yer(y.ag(y.halka(2, 3.9, 5.9, 32), y.malzeme('bakir').clone(), { esik: 60 }), 0, -16.95, 56);   // mıknatısın önünde
        const role = grup(kutu(10, 7.9, 10, 'miknatis', 0, -16.95, 48), roleSargi, pim);
        const mandal = grup(kutu(4, 12, 3, 'plastik', 0, -1, 51), yer(y.ag(eksenX(y.silindir(1, 5.9, 16)), 'celik'), 0, 5.2, 51));

        /* ---- faz ve nötr iletkenleri: girişten toroide, oradan sabit kontağa ---- */
        const yol = (d) => [[9 * d, 32.5, 27], [9 * d, 24, 27], [3 * d, 19, 27], [3 * d, 10, 27], [5 * d, 6, 22], [9 * d, 3, 19.3]];   // sabit kontağa arkadan bağlanır
        const iletken = grup(tel(yol(-1), 1.2, 'bakir'), tel(yol(1), 1.2, 'bakir'));

        /* ---- kontaklar: sabit (arkada), hareketli köprü (pivot y −14, z 24,5; açılınca üst uç öne gider) ---- */
        const sabit = grup(...KUTUP.flatMap((x) => [kutu(5, 5, 2, 'bakir', x, 2, 21), kutu(4, 4, 0.95, 'celik', x, 2, 22.525)]));
        const hareketli = yer(grup(...KUTUP.flatMap((x) => [kutu(4, 18, 2, 'bakir', x, 9, 0.55), kutu(4, 3, 0.95, 'celik', x, 16, -0.975)]),
          kutu(26, 3, 2, 'plastik', 0, 19.55, 0.55)), 0, -14, 24.5);

        const ray = yer(y.ag(y.dinRay(70), 'aluminyum'), -35, 0, -0.05);

        const parcalar = [
          { nesne: giris, isaret: [-7.5, 36, 45.6], patlat: [0, 12, 0] },
          { nesne: cikis, isaret: [-7.5, -36, 45.6], patlat: [0, -12, 0] },
          { nesne: kol, isaret: [0, 0, 14], patlat: [0, 0, 18] },
          { nesne: test, isaretNesne: testIc, isaret: [9, 12, 71.05], patlat: [0, 0, 16] },
          { nesne: toroid, isaret: [0, 13, 39.1], patlat: [0, 0, 26] },
          { nesne: role, isaret: [-5, -16.95, 48], patlat: [0, -6, 14] },
          { nesne: mandal, isaret: [-2, -1, 51], patlat: [0, 0, 10] },
          { nesne: iletken, isaret: [-9, 28, 28.2], patlat: [0, 0, 0] },
          { nesne: sabit, isaret: [-9, 4.5, 21], patlat: [0, 0, -6] },
          { nesne: hareketli, isaret: [-9, 9, 1.55], patlat: [0, -4, 4] },
          { nesne: govdeSol, isaret: [-10, 45, 20], patlat: [-28, 0, 0] },
          { nesne: govdeSag, isaret: [18, 0, 20], patlat: [28, 0, -100] },
          { nesne: ray, isaret: [30, 15.5, -0.05], patlat: [0, 0, -18] }
        ];
        parcalar.forEach((p) => kok.add(p.nesne));

        const etiketYerleri = [[giris, -9, 1, 0], [giris, 9, 1, 0], [cikis, -9, -1, 1], [cikis, 9, -1, 1]]
          .map(([n, x, d, p]) => ({ nesne: n, konum: [x, d * 47, 40], parca: p }));
        const renkBakir = y.malzeme('bakir').color.clone(), renkAktif = y.malzeme('vurgu').color.clone();

        return {
          kok,
          parcalar,
          etiketYerleri,
          uygula(s) {
            /* Malzemeler burada okunur: çalışma zamanı her parçaya kendi kopyasını verir. */
            kol.rotation.x = 0.45 - 0.9 * s.kol;
            hareketli.rotation.x = 0.25 * (1 - s.kontak);   // üst uç ≈ 4 mm öne
            pim.position.y = -10 + 2.5 * s.pim;
            testIc.position.z = s.testT > 0 ? -1.2 : 0;
            sargiAg.material.color.copy(renkBakir).lerp(renkAktif, 0.85 * s.algi);
            roleSargi.material.color.copy(renkBakir).lerp(renkAktif, 0.85 * Math.max(s.algi, s.pim));
          }
        };
      }
    }
  });

/* ---- kaynak/konular/02-step-motorlar/modeller.js ---- */
/* Step motorlar: 3B modeller. Ölçüler mm; motor ekseni z, mil +z yönünde (öne) çıkar. */
(() => {
  /* Tam adım (tek faz) sırası: bilgi sayfasındaki A+ → B+ → A− → B− ile aynı. */
  const FAZLAR = [['A', 1, 'A+'], ['B', 1, 'B+'], ['A', -1, 'A−'], ['B', -1, 'B−']];
  const faz = (adim) => FAZLAR[((adim % 4) + 4) % 4];
  const ADIM_ACISI = 1.8;
  const HIZ = 10;   // Çalıştır: adım/sn

  Object.assign(MODELLER, {
    'step-motor': {
      aciklama: 'NEMA 17 hibrit step motorun 3B modeli: kapaklar, stator, sargılar, iki dişli rotor kabı, mıknatıs, mil ve rulmanlar.',
      not: 'Sürükleyerek döndür, iki parmakla yakınlaştır. Bir parçaya ya da numarasına dokununca parça öne çıkar. Enerjili sargılar kırmızı (N) ve mavi (S) görünür; mil ucundaki sarı çizgi dönüşü gösterir.',
      parcalar: [
        ['Ön kapak (flanş)', 'Alüminyum. NEMA 17’de yüz ≈ 42 mm, bağlantı delikleri 31 mm aralıklı (M3). Ortadaki Ø22 mm pilot çıkıntı motoru makinede merkezler.'],
        ['Ön rulman', 'Sabit bilyalı rulman; mil iki rulmanla yataklanır. Rotor ile stator arasındaki hava aralığı çok dardır: aşınmış rulman rotoru statora sürtebilir.'],
        ['Stator paketi', 'İnce silisli saclardan paketlenir, böylece girdap akımı kaybı azalır. Sekiz kutbu vardır; kutup uçlarındaki ince dişler rotor dişleriyle karşılaşır.'],
        ['Sargılar', 'Emaye bakır bobinler. Sekiz kutup sırayla A ve B fazına aittir. Enerjili sargı kutbunu N ya da S yapar; akım yönü değişince kutup da değişir.'],
        ['Rotor kabı (N)', 'Dişli çelik kap, 50 diş. Mıknatısın N yüzüne oturur; bütün dişleri N kutbudur.'],
        ['Kalıcı mıknatıs', 'Eksenel mıknatıslanmış halka. Enerji yokken de rotoru tutar: mil elle çevrilince hissedilen tıkırtı (detent torku) buradan gelir.'],
        ['Rotor kabı (S)', 'N kabıyla aynıdır ama dişleri yarım diş (3,6°) kaydırılmıştır. İki faz ve 50 diş: 360° ÷ (2 × 2 × 50) = 1,8° adım.'],
        ['Mil', 'Ø5 mm çelik mil, ucu çoğunlukla D kesimlidir. Kaplin vidası düz yüzeye oturur, mil kaplinde kaymaz.'],
        ['Arka rulman', 'Milin arka ucunu taşır. Motor hırıltılı ses çıkarıyorsa önce rulmanlardan şüphelen.'],
        ['Arka kapak', 'Arka rulmanı ve kablo çıkışını taşır. İki kapak stator paketinin iki yanına oturur.'],
        ['Bağlantı cıvataları', 'Dört uzun cıvata kapakları stator paketiyle birlikte sıkar. Rotoru çıkarmak mıknatısı zayıflatıp torku düşürebilir; üreticiler motoru sökmemeyi önerir.'],
        ['Kablo', 'Dört tel, iki sargı. Renkler üreticiye göre değişir: aynı sargının iki ucu arasında birkaç ohm ölçülür, farklı sargılar arasında devre açıktır.']
      ],
      kamera: { yon: [1, 0.72, 1.55] },
      /* Çeyrek: sağ üst çeyrek kesilir. Enine: z = 4 mm’den önü kesilir; stator kutupları, sargılar ve N kabının dişleri görünür. */
      kesitler: [{ ad: 'çeyrek', planlar: [[-1, 0, 0, 0], [0, -1, 0, 0]] }, { ad: 'enine', planlar: [[0, 0, -1, 4]] }],
      yeni: () => ({ adim: 0, aci: 0, calisiyor: false, yon: 1, sure: 0 }),
      dugmeler: (s) => [['adim', 'Bir adım'], ['calistir', s.calisiyor ? 'Durdur' : 'Çalıştır', s.calisiyor], ['yon', s.yon > 0 ? 'Yön: ileri' : 'Yön: geri']],
      olay(s, olay) {
        if (olay === 'adim') { s.calisiyor = false; s.adim += s.yon; }
        else if (olay === 'calistir') { s.calisiyor = !s.calisiyor; s.sure = 0; }
        else if (olay === 'yon') s.yon = -s.yon;
      },
      tik(s, dt) {
        let hareket = false;
        if (s.calisiyor) {
          s.sure += dt;
          while (s.sure >= 1 / HIZ) { s.sure -= 1 / HIZ; s.adim += s.yon; }
          hareket = true;
        }
        const hedef = s.adim * ADIM_ACISI;
        if (s.aci !== hedef) {
          const fark = hedef - s.aci, adim = dt * 90;
          s.aci = Math.abs(fark) <= adim ? hedef : s.aci + Math.sign(fark) * adim;
          hareket = true;
        }
        return hareket;
      },
      durum(s) {
        const aci = ((s.adim * ADIM_ACISI) % 360 + 360) % 360;
        return { metin: `Adım ${s.adim} · ${sayi(aci, 1)}° · ${faz(s.adim)[2]} fazı enerjili.${s.adim === 0 && !s.calisiyor ? ' Rotor bu konumda tutulur.' : ''}` };
      },

      kur(y) {
        const T = y.T, TUR = Math.PI * 2, DER = Math.PI / 180;
        const kok = new T.Group();
        const grup = (...n) => { const g = new T.Group(); n.forEach((x) => g.add(x)); return g; };
        const yer = (n, x, yy, z) => { n.position.set(x, yy, z); return n; };
        const KARE = 42.3, PAH = 4.5, CIVATA = 15.5;
        const kose = [[1, 1], [-1, 1], [-1, -1], [1, -1]].map(([a, b]) => [a * CIVATA, b * CIVATA]);
        const delikli = (sekil, delikler) => { delikler.forEach(([x, yy, r]) => sekil.holes.push(new T.Path().absarc(x, yy, r, 0, TUR, true))); return sekil; };
        /* ---- stator: 8 kutup, kutup ucunda 5 diş ---- */
        const kutupAci = (k) => Math.PI / 2 - k * (Math.PI / 4);   // 1. kutup üstte, numaralar saat yönünde artar
        const statorSekli = delikli(y.pahliKare(KARE, PAH), kose.map(([x, yy]) => [x, yy, 1.7]));
        statorSekli.holes.push(y.kutupluBosluk({ n: 8, rArka: 17.6, rUc: 12.3, rIc: 10.45, g: 2.2, uc: 18 * DER, dis: { sayi: 5, adim: 7.2 * DER, derinlik: 0.5, oran: 0.44 } }));
        const stator = y.ag(y.cek(statorSekli, 24), 'sac');

        /* ---- sargılar: her kutbun gövdesine bir bobin; her bobin kendi malzemesiyle (faza göre renklenir) ---- */
        const bobinGeo = y.bobin({ gw: 2.25, gh: 12.1, kalinlik: 2.35, uzanti: 2.4, r0: 12.4, derinlik: 4.4 });
        const bakir = y.malzeme('bakir'), renkBakir = bakir.color.clone(), renkN = y.malzeme('kuzey').color.clone(), renkS = y.malzeme('guney').color.clone();
        const bobinler = [];
        const sargilar = new T.Group();
        for (let k = 0; k < 8; k++) {
          const b = y.ag(bobinGeo, bakir.clone(), { esik: 50 });
          const g = grup(b);
          g.rotation.z = kutupAci(k) - Math.PI / 2;
          sargilar.add(g);
          bobinler.push(b);
        }

        /* ---- rotor: iki dişli kap (50 diş), aralarında mıknatıs ---- */
        const kapSekli = (kayma) => y.disli({ sayi: 50, rDis: 10.2, rTaban: 9.6, rDelik: 2.55, kayma });
        const rotorN = yer(y.ag(y.cek(kapSekli(0), 10), 'kuzey', { esik: 60 }), 0, 0, 7);
        const rotorS = yer(y.ag(y.cek(kapSekli(3.6 * DER), 10), 'guney', { esik: 60 }), 0, 0, -7);
        const miknatis = y.ag(y.halka(2.55, 8.8, 3.9), 'miknatis');

        /* ---- mil: Ø5, ön ucu D kesimli; uçtaki sarı çizgi dönüşü gösterir ---- */
        const dA = Math.acos(2 / 2.5);   // düz yüzey y = 2’de: 0,5 mm derinlik
        const dSekli = new T.Shape().moveTo(-1.5, 2).absarc(0, 0, 2.5, Math.PI / 2 + dA, Math.PI / 2 - dA + TUR, false).lineTo(-1.5, 2);
        const mil = grup(
          yer(y.ag(y.silindir(2.5, 43), 'celik'), 0, 0, 2.5),
          yer(y.ag(y.cek(dSekli, 20, { bolum: 32 }), 'celik'), 0, 0, 34),
          yer(new T.Mesh(new T.BoxGeometry(0.7, 2.2, 0.2), y.malzeme('vurgu')), 0, -1.1, 44.05)
        );

        /* ---- rulmanlar: dış bilezik, iç bilezik, 8 bilye ---- */
        const rulman = (z) => { const g = y.rulman(2.55, 7.95, 4.9); g.position.z = z; return g; };
        const onRulman = rulman(17.5), arkaRulman = rulman(-17);

        /* ---- kapaklar ----
           Birbirine değen parçalar arasında 0,05 mm boşluk vardır: aynı düzlemdeki yüzeyler kesit görünümünde titrer (z-fighting). */
        const etek = (z) => yer(y.ag(y.cek(delikli(y.pahliKare(KARE, PAH), [[0, 0, 17.8]].concat(kose.map(([x, yy]) => [x, yy, 1.7]))), 2.9), 'aluminyum'), 0, 0, z);
        const onKapak = grup(
          etek(13.5),
          yer(y.ag(y.cek(delikli(y.pahliKare(KARE, PAH), [[0, 0, 8]].concat(kose.map(([x, yy]) => [x, yy, 1.5]))), 4.9, { pah: 0.4 }), 'aluminyum'), 0, 0, 17.55),
          yer(y.ag(y.halka(8, 11, 1.95), 'aluminyum'), 0, 0, 21.05)
        );
        const arkaKapak = grup(
          etek(-13.5),
          yer(y.ag(y.cek(delikli(y.pahliKare(KARE, PAH), [[0, 0, 8]].concat(kose.map(([x, yy]) => [x, yy, 1.7]))), 4.4), 'aluminyum'), 0, 0, -17.25),
          yer(y.ag(y.cek(delikli(y.pahliKare(KARE, PAH), kose.map(([x, yy]) => [x, yy, 1.7])), 1.4, { pah: 0.4 }), 'aluminyum'), 0, 0, -20.25)
        );

        /* ---- cıvatalar: arkadan geçer, ön kapağa vidalanır ---- */
        const civatalar = new T.Group();
        const govdeGeo = y.silindir(1.4, 38, 16), basGeo = y.silindir(2.6, 2, 24);
        kose.forEach(([x, yy]) => {
          civatalar.add(yer(y.ag(govdeGeo, 'celik', { esik: 60 }), x, yy, -2));
          civatalar.add(yer(y.ag(basGeo, 'celik'), x, yy, -22.05));
        });

        /* ---- kablo: arka kapaktan çıkan dört tel ---- */
        const kablo = grup(yer(y.ag(new T.BoxGeometry(12, 4, 5), 'plastik'), 0, 23.2, -17.5));
        [['kabloSiyah', -3.3], ['kabloYesil', -1.1], ['kabloKirmizi', 1.1], ['kabloMavi', 3.3]].forEach(([m, x]) => {
          kablo.add(y.ag(y.boru([[x, 24.5, -17.5], [x * 1.3, 28, -22], [x * 1.9, 31, -32], [x * 2.6, 33, -44]], 0.65), m, { kenar: false }));
        });

        const parcalar = [
          { nesne: onKapak, isaret: [-15, 12, 20.2], patlat: [0, 0, 34] },
          { nesne: onRulman, isaret: [5.7, 5.7, 0], patlat: [0, 0, 22] },
          { nesne: stator, isaret: [21.2, -8, 4], patlat: [0, 0, 0] },
          { nesne: sargilar, isaret: [-3.5, 15, 14], patlat: [0, 0, 0] },
          { nesne: rotorN, isaret: [-8, 5, 5.05], patlat: [0, 46, 6] },
          { nesne: miknatis, isaret: [8.3, -2.9, 0], patlat: [0, 46, 0] },
          { nesne: rotorS, isaret: [-5, 8.8, 5.05], patlat: [0, 46, -6] },
          { nesne: mil, isaret: [0, 2.05, 40], patlat: [0, 46, 0] },
          { nesne: arkaRulman, isaret: [5.7, 5.7, 0], patlat: [0, 0, -22] },
          { nesne: arkaKapak, isaret: [21.2, -8, -17], patlat: [0, 0, -34] },
          { nesne: civatalar, isaret: [CIVATA + 2.6, CIVATA, -22], patlat: [0, 0, -62] },
          { nesne: kablo, isaret: [6, 25.1, -17.5], patlat: [0, 0, -34] }
        ];
        parcalar.forEach((p) => kok.add(p.nesne));
        const donen = [rotorN, miknatis, rotorS, mil];

        return {
          kok,
          parcalar,
          uygula(s) {
            donen.forEach((n) => { n.rotation.z = -s.aci * DER; });
            const [f, yon] = faz(s.adim);
            bobinler.forEach((b, k) => {
              const bu = (k % 2 === 0 ? 'A' : 'B') === f;
              const kutup = ((k >> 1) % 2 === 0 ? 1 : -1) * yon;
              b.material.color.copy(!bu ? renkBakir : kutup > 0 ? renkN : renkS);
            });
          }
        };
      }
    }
  });
})();

/* Servo motorlar: hesaplayıcılar. */
Object.assign(HESAPLAR, {
  enkoder: {
    gruplar: [
      { k: 'c', ad: 'Enkoder', v: 131072, s: [[10000, '2500 ppr'], [131072, '17 bit'], [8388608, '23 bit']] },
      { k: 'hatve', ad: 'Vida hatvesi', v: 10, s: [[5, '5 mm'], [10, '10 mm'], [20, '20 mm']] }
    ],
    hesapla(d) {
      const um = (d.hatve * 1000) / d.c;
      const yol = um >= 1 ? sayi(um, 2) + ' µm' : sayi(um * 1000, 1) + ' nm';
      const aci = (360 * 3600) / d.c;
      const ad = d.c === 10000 ? '2500 ppr × 4' : d.c === 131072 ? '2¹⁷' : '2²³';
      return {
        sonuclar: [['Sayım / tur', sayi(d.c)], ['Sayım başına yol', yol], ['Sayım başına açı', sayi(aci, 2) + '″'], ['1 mm için sayım', sayi(d.c / d.hatve, 0)]],
        adimlar: [`${ad} = ${sayi(d.c)} sayım/tur`, `${d.hatve} mm ÷ ${sayi(d.c)} = ${yol}`, `360 × 3600″ ÷ ${sayi(d.c)} = ${sayi(aci, 2)}″`]
      };
    },
    not: 'Mekanik doğruluk (vida hatası, boşluk) çoğu zaman enkoder çözünürlüğünden büyüktür; çözünürlük tek başına hassasiyet demek değildir.'
  },

  reduktor: {
    gruplar: [
      { k: 'p', ad: 'Servo motor (3000 d/dk)', v: 750, s: [[400, '400 W'], [750, '750 W'], [1000, '1 kW']] },
      { k: 'i', ad: 'Redüktör oranı', v: 10, s: [[3, '3:1'], [5, '5:1'], [10, '10:1'], [20, '20:1']] }
    ],
    hesapla(d) {
      const T = d.p / ((2 * Math.PI * 3000) / 60);
      const eta = d.i > 10 ? 0.92 : 0.95;
      const Tc = T * d.i * eta;
      const n = 3000 / d.i;
      return {
        sonuclar: [['Motor anma torku', sayi(T, 2) + ' N·m'], ['Çıkış torku', '≈ ' + sayi(Tc, 1) + ' N·m'], ['Çıkış hızı', sayi(n, 0) + ' d/dk'], ['Yansıyan atalet', '÷ ' + sayi(d.i * d.i)]],
        adimlar: [`T = ${sayi(d.p)} W ÷ (2π × 3000 ÷ 60) ≈ ${sayi(T, 2)} N·m`, `${sayi(T, 2)} × ${d.i} × ${sayi(eta)} (${d.i > 10 ? 'iki' : 'tek'} kademe) ≈ ${sayi(Tc, 1)} N·m`, `3000 ÷ ${d.i} = ${sayi(n, 0)} d/dk`, `Yük ataleti motora ${d.i}² = ${sayi(d.i * d.i)} kat küçük yansır`]
      };
    },
    not: 'Verim tek kademede yaklaşık %95, iki kademede %92 alındı. Çıkış torku redüktör kataloğundaki sınırı aşmamalı.'
  },
});

/* ---- kaynak/konular/03-servo-motorlar/modeller.js ---- */
/* Servo motorlar: 3B modeller. Ölçüler mm; motor ekseni z, mil +z yönünde (öne) çıkar, flanş ön yüzü z = 0. */
(() => {
  const ENKODER_BIT = 17, ENKODER_DARBE = 2 ** ENKODER_BIT;   // 131.072 darbe/tur
  const KUTUP_CIFTI = 5;                                        // 10 kutuplu rotor
  /* 12 oluk / 10 kutup toplu sargı düzeni: diş başına faz ve sarım yönü (A a b B C c a A B b c C). */
  const DUZEN = [['U', 1], ['U', -1], ['V', -1], ['V', 1], ['W', 1], ['W', -1], ['U', -1], ['U', 1], ['V', 1], ['V', -1], ['W', -1], ['W', 1]];
  const FAZ_ACI = { U: 0, V: (-2 * Math.PI) / 3, W: (2 * Math.PI) / 3 };
  const HIZ = 120;   // gösterim hızı, derece/sn
  const derece = (a) => sayi(((a % 360) + 360) % 360, 1);

  Object.assign(MODELLER, {
    'servo-motor': {
      aciklama: 'Frenli AC servo motorun 3B modeli: flanş, gövde, stator ve sargılar, mıknatıslı rotor, rulmanlar, fren, enkoder ve konnektörler.',
      not: 'Sürükleyerek döndür, iki parmakla yakınlaştır. Servo ON olunca fren açılır; “+90° git” ile rotor konuma gider, enkoder sayısı değişir. Dönerken sargılar U, V, W akımına göre kırmızı (N) ve mavi (S) renklenir.',
      parcalar: [
        ['Mil ve kama', 'Ø14 mm mil, 5 mm kama (60 mm flanşlı 400 W sınıfında tipik). Kaplin ya da kasnak kamayla bağlanır. Mile çekiçle vurma: darbe rulmana ve enkodere gider.'],
        ['Ön flanş', '60 mm kare; Ø50 mm merkezleme çıkıntısı ve Ø70 mm çember üzerinde dört Ø5,5 mm delik (tipik). Motorun ısısı flanştan makineye de atılır.'],
        ['Ön rulman', 'Sabit bilyalı rulman. Kasnak ya da dişli kullanılıyorsa katalogdaki izin verilen radyal ve eksenel yüke dikkat et.'],
        ['Gövde', 'Alüminyum gövde statoru taşır ve ısısını dışarı verir. Katalogdaki sürekli tork, motor belirli ölçüde bir alüminyum plakaya bağlıyken verilir; motoru yalıtıp örtme.'],
        ['Stator ve sargılar', 'Silisli sac paket ve üç faz sargı (U, V, W). Bu örnekte 12 dişe sarılmış toplu sargı var; oluk sayısı üreticiye göre değişir.'],
        ['Rotor ve mıknatıslar', 'Çelik göbek üzerinde neodimyum mıknatıslar, 10 kutup (örnek). Aşırı sıcaklık ya da aşırı akım mıknatısı kalıcı olarak zayıflatabilir.'],
        ['Arka rulman', 'Milin arka ucunu taşır. Rulman sesi ve titreşimi enkoder okumasını da bozabilir.'],
        ['Fren (bobin, yay, armatür)', 'Yaylı tutma freni. Enerjisizken yaylar armatürü balataya bastırır, mil kilitlenir. 24 V DC verilince bobin armatürü çeker, fren açılır.'],
        ['Fren diski (balata)', 'Mille birlikte döner. Tutma freni içindir: hareketli yükü durdurmak için kullanılırsa balata aşınır, tutma torku düşer.'],
        ['Enkoder diski', 'Mille birlikte döner. Optik enkoderde ışık diskteki ince yarıklardan geçer; manyetik enkoderler de yaygındır.'],
        ['Enkoder kartı', 'Diskteki izi okuyup konumu sürücüye sayısal olarak gönderir. 17 bit: 131.072 darbe/tur. Tek turlu mutlak enkoder tur içindeki konumu enerji kesilince de bilir; tur sayımı için çoğunlukla pil gerekir.'],
        ['Enkoder kapağı', 'Enkoderi toz ve darbeden korur. Enkoder fabrikada rotora göre ayarlanır; kapağı açma.'],
        ['Güç konnektörü', 'U, V, W ve PE; frenli motorda fren uçları da. U-V-W sırası sürücüdekiyle aynı olmalı: yanlış sırada motor kontrolden çıkar ya da sürücü alarm verir.'],
        ['Enkoder konnektörü', 'Ekranlı kablo kullanılır; ekranı katalogdaki gibi topraklanır. Enkoder kablosunu güç kablosuyla yan yana uzun mesafe taşıma.']
      ],
      kamera: { yon: [1, 0.72, 1.45], patlak: [1, 0.45, 0.3] },
      kesitler: [{ ad: 'çeyrek', planlar: [[-1, 0, 0, 0], [0, -1, 0, 0]] }, { ad: 'enine', planlar: [[0, 0, -1, -30]] }],
      yeni: () => ({ servo: false, fren: 0, aci: 0, hedef: 0, surekli: false }),
      dugmeler: (s) => [
        ['servo', s.servo ? 'Servo OFF' : 'Servo ON', s.servo],
        ['git', '+90° git'],
        ['surekli', s.surekli ? 'Durdur' : 'Sürekli dön', s.surekli]
      ],
      olay(s, olay) {
        if (olay === 'servo') { s.servo = !s.servo; if (!s.servo) { s.surekli = false; s.hedef = s.aci; } }
        else if (olay === 'git' && s.servo) { s.surekli = false; s.hedef = Math.round(s.aci / 90) * 90 + 90; }
        else if (olay === 'surekli' && s.servo) { s.surekli = !s.surekli; if (!s.surekli) s.hedef = s.aci; }
        s.uyari = !s.servo && (olay === 'git' || olay === 'surekli');
      },
      tik(s, dt) {
        let hareket = false;
        const fren = s.servo ? 1 : 0;   // 1: armatür çekili, fren açık
        if (s.fren !== fren) { s.fren = fren > s.fren ? Math.min(1, s.fren + dt * 4) : Math.max(0, s.fren - dt * 4); hareket = true; }
        if (s.servo && s.fren === 1) {
          if (s.surekli) { s.aci += HIZ * dt; s.hedef = s.aci; hareket = true; }
          else if (s.aci !== s.hedef) {
            const fark = s.hedef - s.aci, adim = Math.max(8, Math.min(HIZ * 1.5, Math.abs(fark) * 4)) * dt;
            s.aci = Math.abs(fark) <= adim ? s.hedef : s.aci + Math.sign(fark) * adim;
            hareket = true;
          }
        }
        return hareket;
      },
      durum(s) {
        const sayim = sayi(Math.round(((((s.aci % 360) + 360) % 360) / 360) * ENKODER_DARBE) % ENKODER_DARBE, 0);
        const konum = `Konum ${derece(s.aci)}° · enkoder ${sayim} / ${sayi(ENKODER_DARBE)}`;
        if (s.uyari) return { metin: 'Önce Servo ON: sürücü motoru enerjilemeden fren açılmaz ve motor dönmez.', uyari: true };
        if (!s.servo) return { metin: s.fren > 0 ? 'Servo kapanıyor: fren bobininin enerjisi kesildi, yaylar freni kapatıyor.' : `Servo OFF. Fren kapalı: yaylar balatayı sıkıştırır, mil kilitli. ${konum}.` };
        if (s.fren < 1) return { metin: 'Servo ON: sürücü fren bobinine 24 V verdi, armatür çekiliyor; fren açılınca hareket başlar.' };
        if (s.surekli) return { metin: `${konum} · sürekli dönüyor.` };
        return { metin: `${konum} · ${s.aci === s.hedef ? 'konum tutuluyor (fren açık, motor akımla tutuyor).' : 'hedefe gidiyor.'}` };
      },

      kur(y) {
        const T = y.T, TUR = Math.PI * 2, DER = Math.PI / 180;
        const kok = new T.Group();
        const grup = (...n) => { const g = new T.Group(); n.forEach((x) => g.add(x)); return g; };
        const yer = (n, x, yy, z) => { n.position.set(x, yy, z); return n; };
        const delikli = (sekil, delikler) => { delikler.forEach(([x, yy, r]) => sekil.holes.push(new T.Path().absarc(x, yy, r, 0, TUR, true))); return sekil; };
        const KARE = 60, DEL = 24.75;   // Ø70 çember üzerindeki delikler: 35 / √2
        const flansDelik = [[1, 1], [-1, 1], [-1, -1], [1, -1]].map(([a, b]) => [a * DEL, b * DEL, 2.75]);
        /* Birbirine değen parçalar arasında 0,05 mm boşluk vardır (kesitte z-fighting olmasın). */

        /* ---- ön flanş ve merkezleme ---- */
        const onFlans = grup(
          yer(y.ag(y.cek(delikli(y.pahliKare(KARE, 5), [[0, 0, 16]].concat(flansDelik)), 8, { pah: 0.5 }), 'aluminyum'), 0, 0, -4),
          yer(y.ag(y.halka(16, 25, 2.95, 72), 'aluminyum'), 0, 0, 1.525)
        );
        const onRulman = yer(y.rulman(7.05, 15.95, 6.9), 0, 0, -4);

        /* ---- gövde: kare boru + arka yatak duvarı ---- */
        const govde = grup(
          yer(y.ag(y.cek(delikli(y.pahliKare(KARE, 8), [[0, 0, 26]]), 49.95), 'aluminyum'), 0, 0, -33.025),
          yer(y.ag(y.cek(delikli(y.pahliKare(KARE, 8), [[0, 0, 13]]), 5.95), 'aluminyum'), 0, 0, -61.025)
        );
        const arkaRulman = yer(y.rulman(7.05, 12.95, 5.9), 0, 0, -61);

        /* ---- stator: 12 diş, toplu sargı ---- */
        const statorSekli = new T.Shape().absarc(0, 0, 25.95, 0, TUR, false);
        statorSekli.holes.push(y.kutupluBosluk({ n: 12, rArka: 21, rUc: 16.3, rIc: 15.2, g: 2, uc: 13 * DER }));
        const statorPaket = yer(y.ag(y.cek(statorSekli, 36, { bolum: 72 }), 'sac'), 0, 0, -33);
        const bobinGeo = y.bobin({ gw: 2.05, gh: 18.05, kalinlik: 1.6, uzanti: 2.3, r0: 16.45, derinlik: 3.8 });
        const bakir = y.malzeme('bakir'), renkBakir = bakir.color.clone(), renkN = y.malzeme('kuzey').color.clone(), renkS = y.malzeme('guney').color.clone();
        const bobinler = [];
        const stator = grup(statorPaket);
        for (let k = 0; k < 12; k++) {
          const b = y.ag(bobinGeo, bakir.clone(), { esik: 50 });
          const g = yer(grup(b), 0, 0, -33);
          g.rotation.z = k * (TUR / 12);
          stator.add(g);
          bobinler.push(b);
        }

        /* ---- rotor: çelik göbek + 10 yüzey mıknatısı ---- */
        const rotor = yer(grup(y.ag(y.halka(7.05, 12, 36), 'celik')), 0, 0, -33);
        const mSekli = new T.Shape().absarc(0, 0, 14.55, -17 * DER, 17 * DER, false).absarc(0, 0, 12.05, 17 * DER, -17 * DER, true);
        const mGeo = y.cek(mSekli, 35.9, { bolum: 12 });
        for (let j = 0; j < 10; j++) {
          const m = y.ag(mGeo, j % 2 ? 'guney' : 'kuzey', { esik: 50 });
          m.rotation.z = j * 36 * DER;
          rotor.add(m);
        }

        /* ---- mil ve kama ---- */
        const kx = 2.5, ky = Math.sqrt(7.05 * 7.05 - kx * kx), ka = Math.atan2(ky, kx);
        const kamaSekli = new T.Shape().moveTo(-kx, ky).lineTo(-kx, 9.2).lineTo(kx, 9.2).lineTo(kx, ky).absarc(0, 0, 7.05, ka, Math.PI - ka, false);
        const mil = grup(
          yer(y.ag(y.silindir(7, 116), 'celik'), 0, 0, -28),
          yer(y.ag(y.cek(kamaSekli, 20, { bolum: 8 }), 'celik'), 0, 0, 16),
          yer(new T.Mesh(new T.BoxGeometry(1, 5, 0.2), y.malzeme('vurgu')), 0, -3.2, 30.1)
        );

        /* ---- fren: bobin gövdesi (arkaya açık oluk), bobin, armatür, karşı plaka ---- */
        const armatur = y.ag(y.halka(12, 24, 1.95), 'celik');
        const fren = grup(
          yer(y.ag(y.halka(12, 15.45, 7), 'celik'), 0, 0, -67.6),
          yer(y.ag(y.halka(21.55, 24, 7), 'celik'), 0, 0, -67.6),
          yer(y.ag(y.halka(15.5, 21.5, 1.2), 'celik'), 0, 0, -64.7),
          yer(y.ag(y.halka(15.55, 21.45, 5.6), 'bakir'), 0, 0, -68.15),
          armatur,
          yer(y.ag(y.halka(10, 24, 1.55), 'celik'), 0, 0, -78.325)
        );
        const frenDiski = grup(yer(y.ag(y.halka(9.2, 21.5, 3.05), 'balata'), 0, 0, -75.925), yer(y.ag(y.halka(7.05, 9.15, 3.05), 'celik'), 0, 0, -75.925));

        /* ---- enkoder: yarıklı disk, kart, kapak ---- */
        const enkoderDiski = grup(
          yer(y.ag(y.cek(y.disli({ sayi: 90, rDis: 16, rTaban: 15, rDelik: 9.05, oran: 0.5 }), 0.8, { bolum: 90 }), 'celik', { kenar: false }), 0, 0, -81.2),
          yer(y.ag(y.halka(7.05, 9, 2.4), 'celik'), 0, 0, -80.3)
        );
        const kart = grup(yer(y.ag(y.halka(10, 24, 1.6), 'kart'), 0, 0, -85));
        kart.add(yer(y.ag(new T.BoxGeometry(7, 5, 2.4), 'entegre'), 0, 15.5, -82.95));
        [[-10, -12, 6], [9, -13, 4], [-16, 4, 3]].forEach(([x, yy, a]) => kart.add(yer(y.ag(new T.BoxGeometry(a, a, 1), 'entegre'), x, yy, -86.35)));
        const kapak = grup(
          yer(y.ag(y.cek(delikli(y.pahliKare(KARE, 8), [[0, 0, 26]]), 31.9), 'aluminyum'), 0, 0, -80),
          yer(y.ag(y.cek(y.pahliKare(KARE, 8), 3, { pah: 0.5 }), 'aluminyum'), 0, 0, -97.5)
        );

        /* ---- konnektörler ve kablo çıkışları ---- */
        const konnektor = (z, r, kablo) => grup(
          yer(y.ag(new T.BoxGeometry(r * 2 + 2, 4, r * 2 + 2), 'plastik'), 0, 32.05, z),
          yer(y.ag(new T.CylinderGeometry(r, r, 11, 32), 'plastik'), 0, 39.6, z),
          yer(y.ag(y.halka(r + 0.05, r + 1.2, 3, 32).rotateX(Math.PI / 2), 'celik'), 0, 41, z),
          y.ag(y.boru([[0, 45, z], [0, 50, z - 8], [0, 53, z - 24], [0, 54, z - 44]], kablo), 'kabloSiyah', { kenar: false })
        );
        const guc = konnektor(-42, 7, 3.2), enkoderK = konnektor(-88, 5.5, 2.4);

        const parcalar = [
          { nesne: mil, isaret: [0, 9.25, 16], patlat: [0, 72, 0] },
          { nesne: onFlans, isaret: [-20, 20, 0.05], patlat: [0, 0, 46] },
          { nesne: onRulman, isaret: [10.2, 10.2, 3.5], patlat: [0, 0, 30] },
          { nesne: govde, isaret: [30.05, -10, -30], patlat: [0, -72, 0] },
          { nesne: stator, isaret: [18.35, 18.35, -20], patlat: [0, 0, 0] },
          { nesne: rotor, isaret: [10.3, 10.3, 12], patlat: [0, 72, 0] },
          { nesne: arkaRulman, isaret: [9.1, 9.1, 0], patlat: [0, 0, -22] },
          { nesne: fren, isaret: [16.9, 16.9, -67.6], patlat: [0, 0, -34] },
          { nesne: frenDiski, isaret: [15.2, 15.2, -75.9], patlat: [0, 72, 0] },
          { nesne: enkoderDiski, isaret: [11.3, 11.3, -81.2], patlat: [0, 72, 0] },
          { nesne: kart, isaret: [0, 18.05, -83], patlat: [0, 0, -56] },
          { nesne: kapak, isaret: [30.05, -10, -84], patlat: [0, 0, -80] },
          { nesne: guc, isaret: [7.05, 39, -42], patlat: [0, -72, 0] },
          { nesne: enkoderK, isaret: [5.55, 39, -88], patlat: [0, 0, -80] }
        ];
        parcalar.forEach((p) => kok.add(p.nesne));
        const donen = [mil, rotor, frenDiski, enkoderDiski];

        return {
          kok,
          parcalar,
          uygula(s) {
            donen.forEach((n) => { n.rotation.z = -s.aci * DER; });
            armatur.position.z = -73.4 + 1.2 * s.fren;   // fren kapalı: -73,4 (balataya basar); açık: -72,2 (bobine çekili)
            const enerjili = s.servo && s.fren === 1;
            const te = -s.aci * DER * KUTUP_CIFTI + Math.PI / 2;   // elektriksel açı: akım rotoru 90° önden çeker
            bobinler.forEach((b, k) => {
              if (!enerjili) { b.material.color.copy(renkBakir); return; }
              const [faz, yon] = DUZEN[k], i = Math.cos(te + FAZ_ACI[faz]) * yon;
              b.material.color.copy(renkBakir).lerp(i > 0 ? renkN : renkS, Math.min(1, Math.abs(i) * 1.1));
            });
          }
        };
      }
    }
  });

  disli: {
    gruplar: [
      { k: 'dt', ad: 'Tur başına darbe', v: 10000, s: [[1000, '1.000'], [10000, '10.000'], [100000, '100.000']] },

      { k: 'hiz', ad: 'İlerleme hızı', v: 100, s: [[50, '50 mm/s'], [100, '100 mm/s'], [500, '500 mm/s']] }
    ],
    hesapla(d) {
      const um = (d.hatve * 1000) / d.dt;
      const f = (d.dt / d.hatve) * d.hiz;
      const rpm = (d.hiz / d.hatve) * 60;
      return {
        sonuclar: [['Darbe başına yol', sayi(um, 2) + ' µm'], ['1 mm için darbe', sayi(d.dt / d.hatve, 0)], ['Darbe frekansı', sayi(f, 0) + ' Hz'], ['Motor hızı', sayi(rpm, 0) + ' d/dk']],
        adimlar: [`${d.hatve} mm ÷ ${sayi(d.dt)} = ${sayi(um, 2)} µm/darbe`, `${sayi(d.dt / d.hatve, 0)} × ${d.hiz} = ${sayi(f, 0)} Hz`, `${d.hiz} ÷ ${d.hatve} × 60 = ${sayi(rpm, 0)} d/dk`, f > 200000 ? 'Uyarı: PLC ya da sürücünün darbe sınırını aşabilir' : rpm > 3000 ? 'Uyarı: motorun anma devrini aşıyor' : 'Frekans ve devir makul']
      };
    },
    not: 'Elektronik dişli, PLC’nin gönderdiği darbeleri enkoder sayımına ölçekler. Darbe başına yolu büyütmek aynı hız için gereken frekansı düşürür.'
  },

  vfd: {
    gruplar: [
      { k: 'f', ad: 'Çıkış frekansı', v: 50, s: [[10, '10 Hz'], [25, '25 Hz'], [50, '50 Hz'], [75, '75 Hz']] },
      { k: 'p', ad: 'Motor kutup sayısı', v: 4, s: [[2, '2 kutup'], [4, '4 kutup'], [6, '6 kutup']] }
    ],
    hesapla(d) {
      const ns = (120 * d.f) / d.p;
      const kayma = (0.04 * 6000) / d.p;
      const n = Math.round((ns - kayma) / 5) * 5;
      const V = d.f <= 50 ? (400 * d.f) / 50 : 400;
      return {
        sonuclar: [['Senkron hız', sayi(ns, 0) + ' d/dk'], ['Yaklaşık mil hızı', '≈ ' + sayi(n, 0) + ' d/dk'], ['Çıkış gerilimi', sayi(V, 0) + ' V'], ['Bölge', d.f <= 50 ? 'Sabit tork' : 'Sabit güç']],
        adimlar: [`n = 120 × ${d.f} ÷ ${d.p} = ${sayi(ns, 0)} d/dk`, `Anma kayması ≈ ${sayi(kayma, 0)} d/dk (sabit kabul) → ≈ ${sayi(n, 0)} d/dk`, d.f <= 50 ? `V/f: 400 × ${d.f} ÷ 50 = ${sayi(V, 0)} V` : '50 Hz üstünde gerilim 400 V’ta kalır; tork düşer']
      };
    },
    not: '400 V / 50 Hz asenkron motor için. Kayma motora ve yüke göre değişir; etiketteki devir 50 Hz tam yükteki değerdir.'
  },
});

/* ---- kaynak/konular/04-suruculer/modeller.js ---- */
/* Sürücüler: 3B modeller. Ölçüler mm; sürücü panoya tabanıyla bağlanır (z = 0 pano yüzü, +z öne),
   uzun kenarı dikey (y), klemensler sağ yandadır (+x). */
(() => {
  const ACIK = (b) => (b ? 'ON' : 'OFF');
  const grupYaz = (d, a, b) => d.slice(a, b).map(ACIK).join(' ');
  /* Etiket sırası: 6 sinyal ucu, 6 güç ve motor ucu, 3 DIP grubu, 2 LED. kur() içindeki etiketYerleri aynı sırada. */
  const SINYAL = ['PUL+', 'PUL−', 'DIR+', 'DIR−', 'ENA+', 'ENA−'], GUC = ['+V', 'GND', 'A+', 'A−', 'B+', 'B−'];

  Object.assign(MODELLER, {
    'step-surucu': {
      aciklama: 'Step sürücünün 3B modeli: soğutucu taban, kapak, sinyal ve güç klemensleri, DIP anahtarları, LED’ler, ana kart, optokuplörler, denetleyici, MOSFET köprüleri ve kondansatörler.',
      not: 'Bir klemense dokun: kamera yaklaşır, uçların adları çıkar; bir ada dokununca oraya ne bağlanacağı yazar. DIP ayarını enerji varken değiştirip ne olduğuna bak. Örnek, DM542 tipi genel bir sürücüdür; uç adları ve sırası üreticiye göre değişir.',
      etiketBaslik: 'Klemensler, anahtarlar ve LED’ler',
      etiketler: [
